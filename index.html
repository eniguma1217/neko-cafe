<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ねこカフェ">
<meta name="theme-color" content="#8cc7a1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>ねこカフェ物語</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
:root{
  --sky:#8cc7a1; --navy:#253561; --title:#4467c9; --paper:#fff8e6; --paper2:#f3e6c4;
  --ink:#2a2433; --muted:#7b6f63; --yellow:#ffd54a; --pink:#ff7aa2; --good:#2f9a4f; --bad:#d14b3f; --gold:#e3a21a;
  --font:"DotGothic16","Hiragino Sans","Yu Gothic",monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{height:100%;overflow:hidden}
body{touch-action:manipulation;-webkit-tap-highlight-color:transparent;margin:0;background:var(--sky);background-image:radial-gradient(rgba(255,255,255,.18) 1px,transparent 1px);background-size:12px 12px;color:var(--ink);font-family:var(--font);font-size:15px}
.app{position:fixed;inset:0;display:flex;gap:0;background:#d4a774;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.side{display:flex;flex-direction:column;gap:2px;padding:2px;width:max-content;min-width:52px;flex:none;overflow-y:auto;background:var(--navy);scrollbar-width:none}
.side::-webkit-scrollbar{display:none}
.side .tab{flex:none;height:36px;padding:1px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;font-size:10px;border-width:2px}   /* 中身の大きさだけ（伸ばさない） */
.side .tab i{font-style:normal;font-size:15px}
.side .tab span{white-space:nowrap;letter-spacing:-.5px}
/* 左の列の「おうちへ」「一時停止」：項目のボタンと見分けがつくように、青い色 */
.sidebtn{flex:none;height:36px;padding:1px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;font-size:10px;font-family:var(--font);border:2px solid #fff;border-radius:6px;background:#4f7fd6;color:#fff;cursor:pointer}
.sidebtn i{font-style:normal;font-size:15px}
.sidebtn span{white-space:nowrap;letter-spacing:-.5px}
.sidebtn.on{background:#e0525a}
.matside{flex:none;display:flex;flex-direction:column;gap:0;padding:2px 3px;background:var(--paper2);border:2px solid var(--navy);border-radius:6px;font-size:11px;line-height:1.25;color:var(--ink)}
.matside span{white-space:nowrap;display:flex;justify-content:space-between;gap:3px;font-size:9px;letter-spacing:-.5px}
.matside span i{font-style:normal}   /* 名前は切らない（左の列が中身に合わせて広がる） */
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:0;position:relative}
.stagebox{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
#bgc{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;z-index:0}
.main>.chipsline{padding:4px 6px;background:var(--paper2);border-bottom:2px solid var(--navy)}
.drawer{position:absolute;left:0;top:0;bottom:0;width:min(340px,46%);font-size:13px;display:flex;flex-direction:column;z-index:6;border-width:0 3px 0 0;border-radius:0;box-shadow:4px 0 0 rgba(37,53,97,.35)}
.drawer>.tt{display:flex;justify-content:space-between;align-items:center;flex:none}
#drawerTitle.back{cursor:pointer;text-decoration:underline;text-underline-offset:3px}
#pageBack{display:none!important}
.drawer .grp.acc:not(.closed)>h3{display:none}   /* 開いているページの見出しは、上のタイトルに出す */
.drawer .x{font-family:var(--font);background:none;border:0;color:#fff;font-size:18px;cursor:pointer;padding:0 4px}
.subnav{display:flex;flex-wrap:wrap;gap:4px;padding:6px 8px;border-bottom:3px solid var(--navy);background:var(--paper2);flex:none}
.sub{font-family:var(--font);font-size:12px;padding:4px 8px;border:2px solid var(--navy);border-radius:12px;background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap}
.sub.on{background:var(--yellow)}
.catpic{image-rendering:pixelated;flex:none;background:#fff8e6;border:2px solid var(--navy);border-radius:6px;vertical-align:middle}
.catcard .hd{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.grp.acc{gap:0;border:2px solid var(--navy);border-radius:6px;background:var(--paper);overflow:hidden;flex:none}
.grp.acc>h3{cursor:pointer;padding:9px 10px;background:#fff;color:var(--ink);font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:6px;-webkit-user-select:none;user-select:none}
.grp.acc>h3::after{content:"▼";font-size:11px;color:var(--title);flex:none}
.grp.acc.closed>h3::after{content:"▶"}
.grp.acc:not(.closed)>h3{background:var(--yellow);border-bottom:2px solid var(--navy)}
.grp.acc:not(.closed)>h3::after{content:""}   /* ページを開いているときは矢印なし（上の「もどる」で戻る） */
.grp.acc:not(.closed){display:flex;flex-direction:column;gap:6px;padding-bottom:6px}
.grp.acc:not(.closed)>:not(h3){margin:0 6px}
.grp.acc.closed>:not(h3){display:none!important}
#telop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);z-index:30;pointer-events:none;opacity:0;text-align:center;padding:14px 28px;border:4px solid var(--navy);border-radius:12px;box-shadow:0 6px 0 rgba(37,53,97,.4);min-width:min(320px,80vw);transition:opacity .2s,transform .25s cubic-bezier(.2,1.6,.4,1)}
#telop.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#telop.ok{background:linear-gradient(135deg,#ff9ab8,#ffe066);color:#5a1a3a}
#telop.ng{background:#d6dbe2;color:#3a3f52}
#telop b{display:block;font-size:30px;letter-spacing:2px;text-shadow:2px 2px 0 #fff}
#telop span{display:block;font-size:15px;margin-top:4px}
#sysPane{flex:1;min-height:0;overflow:auto;padding:6px 10px;display:flex;flex-direction:column;gap:6px}
#logPane{flex:1;min-height:0;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:12px}
#ticker{position:absolute;left:6px;right:6px;bottom:4px;font-size:12px;line-height:1.35;background:rgba(255,248,230,.88);border:2px solid var(--navy);border-radius:4px;padding:1px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#ticker:empty{display:none}
#modeBtn{position:absolute;right:6px;top:6px;z-index:3;line-height:1.2}
.win{background:var(--paper);border:3px solid var(--navy);border-radius:6px;box-shadow:0 4px 0 rgba(37,53,97,.35)}
.win>.tt{background:var(--title);color:#fff;padding:3px 10px;font-size:14px;border-bottom:3px solid var(--navy)}
.win>.bd{padding:10px 12px}
.hud{display:flex;flex-wrap:nowrap;gap:6px 16px;align-items:center;padding:3px 10px;overflow-x:auto;scrollbar-width:none;flex:none;white-space:nowrap;border-width:0 0 3px 0;border-radius:0;box-shadow:none}
.hud .t{font-size:17px}
.hud .lb{font-size:12px;color:var(--muted)}
.hud .sp{flex:1}
.chipsline{display:flex;flex-wrap:wrap;gap:4px 6px;flex:none;white-space:nowrap;scrollbar-width:none}   /* 折り返して全部見せる（下のお店の画面は、そのぶん小さくなる） */
.chipsline::-webkit-scrollbar,.hud::-webkit-scrollbar{display:none}
.chipsline:empty{display:none}
.tag{font-size:12px;background:#fff;border:2px solid var(--navy);border-radius:12px;padding:1px 8px}
.tag.ev{background:#ffe0ec}.tag.boom{background:#fff1b8}.tag.ad{background:#d9ecff}
.stars{color:var(--gold);letter-spacing:1px}
.stage{position:relative;line-height:0;overflow:hidden;flex:none;z-index:1;transition:transform .2s}
canvas{-webkit-user-select:none;user-select:none;width:100%;height:auto;image-rendering:pixelated;display:block}
.swapbox{display:flex;flex-wrap:wrap;gap:5px;min-height:52px;border:2px dashed #9aa3c5;border-radius:8px;padding:6px;background:#fff;align-items:flex-start}
.swapbox.over{background:#fff3c4;border-color:#e3a21a}
.swaplb{width:100%;font-size:13px}
.swapcat{padding:5px 8px;background:#f6f8ff;border:2px solid var(--navy);border-radius:8px;font-size:13px;line-height:1.3;touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab}
.swapcat.ghost{position:fixed;z-index:9999;pointer-events:none;opacity:.9;box-shadow:0 4px 12px rgba(0,0,0,.3)}
#cv{height:100%;touch-action:none;-webkit-touch-callout:none}
#fx{position:absolute;inset:0;pointer-events:none;line-height:1.2}
.pop{position:absolute;transform:translate(-50%,-100%);font-size:13px;font-weight:700;white-space:nowrap;text-shadow:1px 1px 0 #fff,-1px 1px 0 #fff,1px -1px 0 #fff,-1px -1px 0 #fff;animation:up 1.2s ease-out forwards}
.pop.money{color:#b07400}.pop.heart{color:var(--pink)}.pop.zz{color:#5a6bb0}.pop.lv{color:var(--good);font-size:15px}.pop.bad{color:var(--bad)}.pop.like{color:#d05a00}
@keyframes up{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-26px}}
.tab{font-family:var(--font);font-size:14px;padding:5px 0;border:3px solid var(--navy);border-radius:6px;background:var(--paper2);color:var(--ink);cursor:pointer}
.tab.on{background:var(--yellow)}
#panel{flex:1;min-height:0;padding:8px 8px;overflow:auto;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.drawer .row{padding:5px 6px;gap:6px}
.drawer .row .nm{flex:1 1 130px}
.drawer .btn{font-size:12px;padding:4px 8px}
.drawer .note{font-size:12px}
.more-help{font-size:11px;color:var(--title)}
.help p{margin:0;font-size:13px;line-height:1.6}
.help ul{margin:0;padding-left:18px;font-size:13px;line-height:1.6}
h3{margin:0;font-size:14px;color:var(--title);font-weight:400}
.grp{display:flex;flex-direction:column;gap:6px}
.row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px;background:#fff;border:2px solid var(--paper2);border-radius:4px}
.row .nm{min-width:0;flex:1 1 170px}
.row .btn small{white-space:normal}
.row small{display:block;color:var(--muted);font-size:12px}
.row.done{border-color:#bfe3c8;background:#f2fbf4}
.row.locked{background:#f1ede4;color:var(--muted)}
.btn{font-family:var(--font);font-size:13px;padding:5px 10px;border:2px solid var(--navy);border-radius:4px;background:var(--yellow);color:var(--ink);cursor:pointer;white-space:nowrap;box-shadow:0 2px 0 var(--navy)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.off{background:#ddd}
.btn.big{font-size:16px;padding:8px 18px}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,select:focus-visible,.pick:focus-visible{outline:3px solid var(--pink);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--font);font-size:13px;padding:4px 8px;border:2px solid var(--navy);border-radius:14px;background:#fff;color:var(--ink);cursor:pointer}
.chip:disabled{opacity:.45;cursor:not-allowed;background:#eee}
.chip.sel{background:var(--pink);color:#fff}
.bar{height:8px;background:#e6dcc4;border:1px solid var(--navy);border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--title)}
.bar.fan>i{background:var(--pink)}
.catcard{background:#fff;border:2px solid var(--paper2);border-radius:4px;padding:8px;display:flex;flex-direction:column;gap:5px}
.catcard .hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sk{display:inline-block;font-size:12px;background:var(--paper2);border-radius:3px;padding:1px 6px;margin:0 4px 2px 0}
.line{display:flex;gap:6px;align-items:center}
select{font-family:var(--font);font-size:13px;padding:3px;border:2px solid var(--navy);border-radius:4px;background:#fff;color:var(--ink);min-width:0;flex:1}
.note{font-size:12px;color:var(--muted)}
.log{list-style:none;margin:0;padding:0;font-size:13px;display:flex;flex-direction:column;gap:2px}
.log li{color:var(--muted)}.log li:first-child{color:var(--ink)}
.plus{color:var(--good)}.minus{color:var(--bad)}
.modal{position:fixed;inset:0;background:rgba(20,25,50,.55);display:grid;place-items:center;padding:16px;z-index:10}
.modal .win{max-width:400px;width:100%;max-height:90vh;overflow:auto}
.modal .bd{display:flex;flex-direction:column;gap:10px}
.modal .win:has(.wk){max-width:600px}
.modal .bd:has(.wk){gap:6px}
.wk{display:grid;grid-template-columns:repeat(3,max-content minmax(0,1fr));gap:3px 10px;font-size:13px;align-items:baseline}
.wk>span{color:var(--muted);font-size:11px;white-space:nowrap}
.wk>b{font-weight:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hintbtn{font-family:var(--font);font-size:12px;text-align:left;padding:4px 8px;background:#fff3c4;border:2px solid #e3a21a;border-radius:6px;color:var(--ink);cursor:pointer}
@media (max-width:520px){.wk{grid-template-columns:repeat(2,max-content minmax(0,1fr))}}
table{width:100%;border-collapse:collapse}
td{padding:4px 0;border-bottom:1px dashed var(--paper2)}
td:last-child{text-align:right}
tr.me td{color:var(--title);font-weight:700}
.bigemoji{font-size:44px;text-align:center;line-height:1.2}
.pick{display:flex;gap:10px;align-items:center;width:100%;text-align:left;font-family:var(--font);color:var(--ink);cursor:pointer;padding:6px 8px;background:#fff;border:2px solid var(--paper2);border-radius:4px}
.pick:hover{border-color:var(--title)}
#info{position:absolute;top:8px;width:min(230px,62%);line-height:1.4;z-index:2;font-size:13px}
#info.left{left:8px}#info.right{right:8px}
#info .bd{padding:8px 10px;display:flex;flex-direction:column;gap:5px}
#info .tt{display:flex;justify-content:space-between;align-items:center}
#info .x{font-family:var(--font);background:none;border:0;color:#fff;font-size:16px;cursor:pointer;padding:0 2px}
#info td{padding:2px 0;font-size:12px}
#battle{padding:0;display:block;background:var(--navy)}
#battle .win{max-width:none;width:100%;height:100%;max-height:none;border:0;border-radius:0;box-shadow:none;display:flex;flex-direction:column;overflow:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#battle .bfull{flex:1;min-height:0;display:flex;flex-direction:row;gap:0;padding:0}
#battle .bside{width:min(300px,34%);flex:none;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:6px;border-right:3px solid var(--navy);font-size:13px}
#battle .bside .chip,#battle .bside .btn{font-size:12px}
#battle .bmain{flex:1;min-width:0;display:flex;flex-direction:column}
#battle .bhud{padding:3px 8px;background:var(--paper2);border-bottom:2px solid var(--navy);flex:none}
#battle .bbox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#5d6b4f}
.bstage{position:relative;line-height:0;overflow:hidden;flex:none}
#bResult:empty,#bAdvice:empty,#bHelp:empty,#bSpecials:empty,#bBtns:empty{display:none}
@media (orientation:portrait){#battle .bfull{flex-direction:column-reverse}#battle .bside{width:auto;max-height:45%;border-right:0;border-top:3px solid var(--navy)}}
#bcv{width:100%;height:100%;image-rendering:pixelated;display:block;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#bfx{position:absolute;inset:0;pointer-events:none;line-height:1.2;overflow:hidden}
#bbanner{position:absolute;left:0;right:0;top:38%;text-align:center;font-size:26px;line-height:1.2;color:#fff;pointer-events:none;opacity:0;transition:opacity .25s;
  text-shadow:2px 2px 0 #253561,-2px 2px 0 #253561,2px -2px 0 #253561,-2px -2px 0 #253561,0 3px 0 #253561}
#bbanner.show{opacity:1}
.pop.dmg{color:#fff;font-size:12px;text-shadow:1px 1px 0 #253561,-1px 1px 0 #253561,1px -1px 0 #253561,-1px -1px 0 #253561}
.pop.crit{color:#ffe14a;font-size:16px;text-shadow:1px 1px 0 #a8325a,-1px 1px 0 #a8325a,1px -1px 0 #a8325a,-1px -1px 0 #a8325a}
.pop.stun{color:#ffd54a;font-size:11px;text-shadow:1px 1px 0 #253561,-1px 1px 0 #253561,1px -1px 0 #253561,-1px -1px 0 #253561}
.bhud{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:14px}
.chip.placed{background:var(--paper2)}
.mats{display:flex;flex-wrap:wrap;gap:6px}
.mat{font-size:13px;background:#fff;border:2px solid var(--paper2);border-radius:4px;padding:2px 8px}
.bar.safe>i{background:var(--good)}.bar.warn>i{background:var(--gold)}.bar.danger>i{background:var(--bad)}
.tag.town{background:#dff3e3}.tag.town.bad{background:#ffd9d4}
.rk{display:inline-block;font-size:11px;line-height:1;padding:2px 4px;border-radius:3px;margin-right:4px;vertical-align:1px;color:#fff;letter-spacing:-1px}
.rk.r1{background:#9a948c}.rk.r2{background:#3c9a5f}.rk.r3{background:#3d6fd1}.rk.r4{background:#9152c9}.rk.r5{background:linear-gradient(90deg,#e3a21a,#ff7aa2,#e3a21a)}
.twostat{display:flex;gap:6px;flex-wrap:wrap}
.st2{display:inline-flex;align-items:baseline;gap:4px;border-radius:4px;padding:2px 8px;font-size:13px}
.st2 b{font-size:17px}
.st2.heal{background:#ffe3ec;color:#a8325a}.st2.pow{background:#e1e9ff;color:#2f4fa8}
details.more{font-size:12px}
details.more summary{cursor:pointer;color:var(--title)}
details.more table td{font-size:12px;padding:2px 0}
.sp-btn{font-family:var(--font);font-size:12px;padding:4px 8px;border:2px solid var(--navy);border-radius:6px;background:#eee;color:var(--ink);cursor:pointer;position:relative;overflow:hidden;min-width:96px;text-align:left}
.sp-btn i{position:absolute;left:0;top:0;bottom:0;background:rgba(255,213,74,.55);z-index:0}
.sp-btn span{position:relative;z-index:1}
.sp-btn[aria-disabled]{cursor:default}
.sp-btn .sp-desc{font-size:11px;opacity:.85}
.sp-btn:hover,.sp-btn:focus-visible{outline:3px solid var(--pink);outline-offset:1px}
.sp-btn.ready{background:linear-gradient(90deg,#ff7aa2,#ffd54a);color:#fff;text-shadow:1px 1px 0 #a8325a;animation:pulse .8s infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.05)}}
#bAdvice .adv{border:2px solid var(--navy);border-radius:6px;padding:6px 10px;font-size:13px;line-height:1.5;background:#fff}
#bAdvice .adv b{font-size:15px}
#bAdvice .adv.g1{background:#e3f6e8}#bAdvice .adv.g2{background:#eef8e0}#bAdvice .adv.g3{background:#fff6d6}#bAdvice .adv.g4{background:#ffe7d6}#bAdvice .adv.g5{background:#ffdcdc}
[hidden]{display:none!important}
@media (max-width:760px),(max-height:520px){
  .hud .t{display:none}
  .hud{gap:4px 12px;font-size:13px}
  .hud .lb{font-size:10px}
  .hud .btn{padding:3px 8px;font-size:12px}
  .tag{font-size:11px}
  .drawer{width:min(320px,52%)}
  .btn{padding:6px 10px}
  .chip{padding:6px 9px}
  select{padding:5px 4px;font-size:16px}
  #info{width:min(230px,60%);max-height:calc(100% - 16px);overflow:auto}
  .modal{padding:8px}
  .modal .win{max-height:calc(100dvh - 16px)}
  .drawer h3{font-size:13px}
  #panel{gap:6px;padding:6px}
}
/* 項目の中は、カイロソフト風に短く：説明は「ℹ️ くわしく」を押したときだけ */
#panel>.note,.drawer .grp>.note{display:none}   /* 説明の文は出さない（くわしくは「説明」タブ） */
.drawer .grp:not(.showx) .more{display:none}

.row1{display:flex;align-items:center;gap:6px;width:100%;text-align:left;cursor:pointer;font-family:var(--font);font-size:13px;white-space:nowrap;overflow:hidden;padding:6px 8px}
.row1 .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.row1 .s{font-size:11px;color:var(--muted)}
.row1 .go{color:var(--title);flex:none}
.xbtn{display:inline-block;align-self:flex-start;font-family:var(--font);font-size:11px;background:#e3f0ff;border:2px solid var(--navy);border-radius:10px;padding:1px 8px;cursor:pointer}
.more-help{font-family:var(--font);font-size:11px;background:#fff3c4;border:2px solid #e3a21a;border-radius:10px;padding:1px 8px;cursor:pointer;margin-left:4px}
@media (max-height:420px){
  .side .tab span{font-size:9px}
  .side .tab i{font-size:14px}
  #ticker{font-size:11px}
}
@media (prefers-reduced-motion:reduce){.pop{animation-duration:.01s}}

/* ===== 項目の画面：カイロソフト風にぎゅっと（1行・小さめのボタン・中身に合わせた幅） ===== */
.drawer{width:max-content;min-width:200px;max-width:min(440px,66%);bottom:auto;max-height:100%}
.drawer #panel{flex:0 1 auto}
.pager{display:flex;align-items:center;justify-content:center;gap:10px;font-size:12px;flex:none;grid-column:1/-1}
.pager .btn{padding:1px 14px}
#panel.cols2,#panel.cols3{display:grid;grid-template-columns:repeat(2,minmax(0,max-content));align-content:start}
#panel.cols3{grid-template-columns:repeat(3,minmax(0,max-content))}
#panel.cols2>.mats,#panel.cols3>.mats{grid-column:1/-1}
.drawer .grp:not(.closed):has(>.swapbox){width:min(560px,calc(100vw - 130px))}
.drawer:has(.grp:not(.closed)>.swapbox){max-width:calc(100% - 4px)}
.drawer .swapbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:3px;padding:4px;min-height:40px}
.drawer .row .catpic{width:22px!important;height:24px!important}
.drawer td small.note,.drawer .line small.note{display:inline}
.rankbox{display:flex;flex-direction:column;gap:1px;padding:3px 6px;background:#fff;border:1px solid var(--paper2);border-radius:4px;font-size:12px}
.drawer .row .nm .s{font-size:11px;color:var(--muted)}
.drawer .swapcat{padding:1px 4px;font-size:11px;line-height:1.4;white-space:nowrap;display:flex;gap:2px;min-width:0}
.drawer .swapcat .n{overflow:hidden;text-overflow:ellipsis;min-width:1.5em;flex:0 1 auto}
.drawer .swapcat small{flex:none;font-size:9px;letter-spacing:-.3px}
.drawer .swaplb{grid-column:1/-1;font-size:11px}
#navMini{display:none}
/* 高さが足りない画面（スマホの横向きなど）：左の列は2列に並べて、スクロールしないで全部押せるように */
@media (max-height:560px){
  .side{display:grid;grid-template-columns:repeat(2,60px);grid-template-rows:repeat(6,minmax(32px,1fr)) auto;gap:3px;overflow:hidden;height:100%}
  .side .tab,.sidebtn{height:auto;min-height:0;min-width:0;width:60px}
  .side .tab span,.sidebtn span{font-size:11px}
  .side .tab i,.sidebtn i{font-size:18px}
  .matside{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;column-gap:4px}
  #navMini{display:flex;background:#7a86a8}
  /* 細くしたとき：1列・絵だけ（素材は隠す） */
  .side.mini{grid-template-columns:30px;grid-template-rows:none;grid-auto-rows:minmax(0,1fr)}
  .side.mini .tab,.side.mini .sidebtn{width:30px;height:auto;min-height:0;padding:0;overflow:hidden}
  .side.mini .tab i,.side.mini .sidebtn i{font-size:15px}
  .side.mini .tab span,.side.mini .sidebtn span,.side.mini .matside{display:none}
}
#panel{gap:4px;padding:5px 6px}
.drawer .grp{gap:2px}
.drawer .grp.acc>h3{padding:2px 8px;font-size:12px;line-height:1.5}
.drawer .grp.acc{border-width:2px;border-radius:5px}
.drawer .grp.acc:not(.closed){gap:3px;padding-bottom:4px}
.drawer .grp.acc:not(.closed)>:not(h3){margin:0 4px}
.drawer .row{flex-wrap:nowrap;padding:1px 6px;gap:6px;min-height:0;border-width:1px}
.drawer .row .nm{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drawer .row>select,.drawer .row>.btn,.drawer .row>.line{flex:none}
.drawer .row .nm small{display:none}
.drawer .row:has(.nm small) .nm{cursor:pointer}
.drawer .row:has(.nm small) .nm::after{content:" ›";color:var(--title)}
.drawer .rowdetail{flex-direction:column;align-items:stretch;padding:6px 8px}
.drawer .pricetag{flex:none;font-size:12px;color:var(--ink);margin-left:auto}
.drawer .row .pricetag+.btn{margin-left:6px}
.drawer .needs{font-size:13px;margin:4px 0}
.drawer .rowdetail .nm{white-space:normal;cursor:default;font-size:14px}
.drawer .rowdetail .nm::after{content:""}
.drawer .rowdetail .nm small{display:block;margin:3px 0 0;white-space:normal;font-size:12px}
.drawer .btn small{white-space:nowrap}
.drawer .row .nm.wrap,.drawer .row .nm.wrap small{white-space:normal}
.drawer .nm.wrap,.drawer .rowdetail .nm,.drawer .rowdetail small,.drawer .note,.drawer .grp.showall .row .nm,.drawer .help li,.drawer .help p{text-wrap:balance;word-break:auto-phrase}
/* ボタンがない見出し（見るだけのページ）や、行が1つだけのページは、説明をはじめから全部出す */
.drawer .grp.showall .row .nm{white-space:normal;cursor:default}
.drawer .grp.showall .row .nm::after{content:""}
.drawer .grp.showall .row .nm small{display:block;white-space:normal;margin:2px 0 0}
.drawer .btn{padding:1px 7px;font-size:12px;line-height:1.4;box-shadow:0 1px 0 var(--navy)}
.drawer .btn br{display:none}
.drawer .btn small{display:inline;margin-left:4px;font-size:10px}
.drawer select{padding:1px 2px;font-size:12px}
.drawer .row1{padding:3px 8px}
.drawer .catcard,.drawer .row[style*="column"]{white-space:normal}
.drawer .row[style*="column"] .nm{white-space:normal}
</style>
</head>
<body>
<div class="app" id="app">
  <nav class="side" id="side" aria-label="メニュー">

    <button class="sidebtn" id="navMini" title="左の列を細くする"><i>◀</i><span>細くする</span></button>

  </nav>
  <div class="main">
    <div class="win hud">
      <div><div class="lb">カレンダー</div><div id="day"></div></div>

      <div><div class="lb">人気 <span id="popNum"></span></div><div class="stars" id="stars"></div></div>
      <div><div class="lb">ブーム</div><div id="boomTop"></div></div>
      <div><div class="lb">天気（→来週）</div><div id="wxTop"></div></div>

      <canvas id="bgc" width="1" height="1" aria-hidden="true"></canvas>
      <div class="stage" id="stage"><canvas id="cv" width="256" height="196"></canvas><div id="fx"></div><div id="ticker"></div><button class="btn" id="modeBtn" hidden></button><div id="info" class="win" hidden></div></div>
      <div class="drawer win" id="drawer" hidden>
        <div class="tt"><span><span id="drawerTitle"></span></span><button class="x" id="drawerClose" aria-label="閉じる">×</button></div>
        <div class="subnav" id="subnav" hidden></div>
        <div id="panel"></div>
        <div id="logPane" hidden><ul class="log" id="log"></ul></div>
        <div id="sysPane" hidden>
          <div class="grp"><h3>⏩ ゲームの速さ</h3>
            <select id="speedSel" aria-label="ゲームの速さ" style="font-size:16px"><option value="0.5">ゆっくり ×0.5</option><option value="1" selected>ふつう ×1</option><option value="2">はやい ×2</option><option value="3">とてもはやい ×3</option></select>
            <div class="note">1週間はふつうで約1分です。一時停止は上のボタンでできます。</div></div>
          <div class="grp"><h3>💾 セーブ・ロード</h3>

          <div class="grp"><h3>🔄 最初からやり直す</h3>
            <div><button class="btn off" id="reset">最初からやり直す</button></div>
            <div class="note">今のお店は消えてしまいます（セーブのスロットに残しておくと安心です）。</div></div>
        </div>

  </div>
</div>

</div></div></div>

<script>
// =====================================================================
//  ★ 設定 ★  ここの数字を変えると、遊び心地が変わります
// =====================================================================
const CONFIG = {
  startMoney: 15000,       // 最初のお金
  startSeats: 2,           // 最初の席の数
  seatCost: 2000,          // 席を1つ増やす値段（最初）
  seatCostGrowth: 1.5,     // 席を増やすたびに値段が何倍になるか
  expandCosts: [40000, 150000, 500000, 1000000], // 増築の値段（2〜5段階目）
  expandMats: [                                  // 増築に必要な素材（2〜5段階目）
    { wood: 8, cloth: 5 },
    { wood: 15, cloth: 10, bell: 5 },
    { wood: 25, cloth: 15, bell: 10, feather: 6 },
    { wood: 40, cloth: 25, bell: 15, feather: 10, charm: 8 },
  ],

  tickMs: 1000,            // 1コマの長さ（ミリ秒）。小さくすると時間が早く進む
  minutesPerTick: 10,      // 1コマでゲーム内の何分が進むか（10分ずつ。1日＝1週を、ゆっくり進める）
  openHour: 10,            // 開店時間
  closeHour: 22,           // 閉店時間（お客さんが残っていたら、全員帰るまで時計は止まる）
  nightSpeed: 6,           // 閉店から次の開店までは、この倍の速さで時間が進む
  closeSpeed: 2,           // 閉店後、残ったお客さんを待つあいだの速さ
  lastOrder: 21,           // この時間からは新しいお客さんが来ない（ラストオーダー）
  weekScale: 1,            // 家賃・ご飯代・今年の挑戦の数の倍率（1日＝1週なので、もとの数のまま）
  weeksPerMonth: 4,        // 1か月の週の数（1週 = 開店から閉店まで1回）
  weekendBonus: 0.03,       // 土日にお客さんが来やすくなる量
  startMonth: 4,           // 何月から始まるか

  customerChance: 0.04,    // お客さんが来る確率（1コマごと）
  sizeGuestMul: [1, 1, 1.05, 1.2, 1.4],   // お店の広さ（1〜5段階目）ごとの、お客さんの来やすさの倍率（広いお店ほど人が入る）
  popularityBonus: 0.0045,  // 人気1につき、来る確率がどれだけ上がるか
  stayMin: 5,              // お客さんが座っているコマ数（最小）
  stayMax: 9,              // お客さんが座っているコマ数（最大）
  greatScore: 14,          // 満足度がこの数を超えると「最高！」（人気+2）
  goodScore: 6,            // 満足度がこの数を超えると「また来たい」（人気+1）
  likeBonus: 3,            // 好物を食べたときの満足ボーナス
  fanNeed: 50,             // このファン数で新しいお客さんを紹介してくれる
  fanSatNeed: 70,          // さらに、そのお客さんの満足度がこの%以上ないと紹介してくれない
  goodFanChance: 0.3,      // 「また来たい」でファンになってくれる確率（「最高！」なら必ずファン+1）
  turnAwayPenalty: 0.25,   // 満席で帰ったお客さんが、人気を1下げる確率

  catMaxEnergy: 12,        // 猫の元気の最大値
  catRecover: 1,
  playChance: 0.08,        // ヒマな猫同士がじゃれ合いを始める確率（1コマごと）
  playHeal: 1,
  zoneBonus: 3,            // 好きな雰囲気の床の席に座ったときの満足ボーナス
  zoneSeatChance: 0.8,     // 好きな雰囲気の席が空いていたら、そこを選ぶ確率
  group2Chance: 0.3,       // テーブルが丸ごと空いていたら、2人組で来る確率（カップルはもっと）
  furnPlayChance: 0.08,    // ヒマな猫が家具で遊び始める確率（1コマごと。遊ぶ家具でアップ）
  popSlowZone: 12,         // 人気が上限のこの数手前から、お客さんで上がる人気がだんだん上がりにくくなる
  popWeekMax: 6,           // お客さん・看板猫で上がる人気は、1週にこの数まで（評判は少しずつ広まる）
  popGain: 0.5,            // 「最高！」で上がる人気の倍率（小さいほど人気が上がりにくい）
  goodPopChance: 0.35,     // 「また来たい」で人気+1になる確率             // じゃれ合いを見たお客さんの満足が増える量（1コマごと）           // お昼寝中、1コマで回復する元気
  foodCostPerCat: 400,     // 猫1匹あたりの1週のごはん代（Lv1のとき）
  foodPerLevel: 0.2,       // レベルが1上がるごとに、ごはん代が何割増えるか
  foodRank: { 1: 1, 2: 1.6, 3: 2.5, 4: 4, 5: 6 },   // レア度（★の数）ごとのごはん代の倍率
  rent: [500, 1500, 25000, 45000, 120000], // 1週の家賃のもと（お店の広さごと）
  rentPerItem: 200,        // 置いている家具1つごとに家賃がこれだけ上がる
  rentPerCat: 400,         // 飼っている猫1匹ごとに家賃がこれだけ上がる
  expPerLevel: 15,         // 猫のレベルアップに必要な経験（レベル×この数）

  menuPriceMul: 1.0,       // メニューの値段の倍率（大きいほど1杯あたりの売上が増える）
  devCost: 1500,           // メニュー開発1回の費用
  devCost3: 3000,          // 3つの食材で開発するときの費用
  devCostGrowth: 0.5,      // メニューが1品増えるごとに、開発費が何割高くなるか
  devTicks: 10,             // メニュー開発にかかるコマ数

  startPopularity: 10,     // 最初の人気
  goalPopularity: 100,
  lateHard: 0.4,           // 人気50から先は、「満足」「最高！」に必要な点数がだんだん上がる（人気100で1.4倍）
  catWalkSpeed: 24,        // お店の猫の歩く速さ（小さいほどゆっくり）
  catChaseSpeed: 38,       // 荒らしを追いかけるときの速さ
  catSleepySpeed: 16,      // 眠くて寝床へ向かうときの速さ
  idleTire: 12,            // お店に出ている猫は、このコマ数ごとに元気が1へる（接客しなくても少しずつつかれる）
  tiredRate: 0.2,          // 元気がこの割合まで減ると、猫は寝床へ行ってお昼寝する
  finalUnlockLv: 7,        // 神社をこのレベルにすると、ラスボスの城が現れる     // 目標の人気（ここに届くとクリア）
  safetyStart: 60,         // 街の安全度の最初の値
  quickPatrolRate: 0.6,    // 見回り（簡易パトロール）で上がる安全度：クリアしたレベルで勝ったときの何倍か
  safetyMin: 20,           // 街の安全度は、毎週の低下や台風ではこれより下がらない
  patrolLvCap: [3, 5, 7, 9, 10],   // お店の広さ（1〜5段階目）ごとに、パトロールで挑戦できるレベルの上限
  safetyDecay: 8,          // 1週（1日）ごとに下がる街の安全度
  earlyDecayWeeks: 24,     // 序盤はこの週数をかけて、安全度の下がり方がだんだん本来の速さになる（最初は1/4）
  earlyGuestBoost: 0.8,    // 人気が低いうちは、お客さんがこれだけ多く来る（人気10で+80%、人気40で+0%）
  priceGrowth: 0.5,        // 人気100のとき、ショップの値段がこれだけ高くなる（+50%）
  priceGrowthExpand: 0.1,  // お店を1段階広げるごとに、ショップの値段がこれだけ高くなる（+10%）
  houseHp: 16,
  bossHp: 2.0,             // ボスの体力の倍率（ふつうの敵と比べて）
  enemyHpMul: 1.5,         // パトロールの敵の体力の倍率
  enemyHpArea: 0.5,        // 地区が1つ先になるごとに、敵の体力がこれだけ増える
  enemyHpLv: 0.3,          // レベルが1つ上がるごとに、敵の体力がこれだけ増える
  bUpAtk: 0.3,             // 強化1回で攻撃が何割増えるか
  bUpRange: 2,             // 強化1回で射程がどれだけ増えるか
  nibosiStart: 40,         // 🐟 パトロール開始時のにぼし（猫を置く・強化するのに使う）
  nibosiStartLv: 10,       // レベルが1つ上がるごとに、最初のにぼしがこれだけ増える
  nibosiStartArea: 15,     // 地区が1つ先になるごとに、最初のにぼしがこれだけ増える
  nibosiPerXp: 1.0,        // 敵をたおしたときのにぼし（敵の経験値×これ）
  nibosiWave: 10,          // 波が来るたびにもらえるにぼし
  bCatCost: [0, 20, 25, 30, 40, 50],   // 猫を置くのに使うにぼし（★の数ごと）
  bUpMax: 2,               // パトロール中の強化の回数
  slotStep: 30,            // 置き台を道にそって並べる間かく
  slotGap: 18,             // 置き台どうしの最低の間かく
  dropChance: 1.0,         // パトロールで素材が手に入る確率（素材の種類ごと）
  dropAmount: 0.85,        // パトロールで手に入る素材の量の倍率
  areaUnlockLv: 3,         // ひとつ前の地区をこのレベルにすると、次の地区が解放される             // パトロールで守る「おうち」の体力
  raidSafety: 50,          // 街の安全度がこれより低いと、お店が荒らされることがある
  raidRate: 0.0006,        // 荒らしの起こりやすさ（安全度が低いほど起こりやすい）
  raidMax: 3,              // 1週に来る荒らしの最大数
  raidTicks: 8,
  raidScareMax: 10,        // 荒らしがいる間、座っているお客さんの満足が1コマごとに-1（最大でこの数まで）
  raidFleeGrow: 0.3,       // 荒らしが1コマ長くいるごとに、お客さんが逃げて帰る確率がこれだけ増える            // 荒らしがお店で暴れる時間（コマ）

function homeTraining() {
  const gain = homeExp();
  if (!gain) return [];
  const ups = [];
  S.cats.filter(c => !c.duty && c.lv < Math.min(HOME_LV_CAP, maxLv(c))).forEach(c => {
    c.exp += gain;
    while (c.lv < Math.min(HOME_LV_CAP, maxLv(c)) && c.exp >= c.lv * CONFIG.expPerLevel) { c.exp -= c.lv * CONFIG.expPerLevel; c.lv++; ups.push(`${nameOf(c.id)}がLv${c.lv}に`); }
    if (c.lv >= Math.min(HOME_LV_CAP, maxLv(c))) c.exp = Math.min(c.exp, c.lv * CONFIG.expPerLevel);
  });
  if (ups.length) addLog(`🏡 おうちで遊んで、${ups.join("・")}なった！`);
  return ups;
}                  // 飼える猫の数（出勤していない猫はおうちで休む）

function makeForecast() {   // 天気は［今週, 来週］。週が変わると来週の天気が今週になる
  const tbl = WEATHER_TABLE[seasonOf(month())], total = Object.values(tbl).reduce((a, b) => a + b, 0);
  const roll = () => { let r = Math.random() * total; for (const [k, v] of Object.entries(tbl)) { if ((r -= v) <= 0) return k; } return "cloudy"; };
  S.weather = [S.weather && S.weather.length === 2 ? S.weather[1] : roll(), roll()];
  const se = seasonOf(month()), key = `${year()}-${se}`, big = BIG_WEATHER[se];

const YEAR_PRIZES = [{ money: 100000, pop: 5 }, { money: 50000, pop: 3 }, { money: 20000, pop: 1 }];
const weeksPerYear = () => CONFIG.weeksPerMonth * 12;

const yearProgress = () => (((S.day - 1) % weeksPerYear()) + weekday() / 7) / weeksPerYear();
function yearRanking(key, progress) {
  const g = (1 + CONFIG.yearRivalGrowth * yearIdx() * CONFIG.rivalGrowth) * loopMul(CONFIG.ngRival);
  let seed = yearIdx() * 31 + (key === "heal" ? 7 : 13);
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pool = rivalCatsFor(YEAR_RIVALS.map(r => ({ name: r.name, shop: r.shop, y: [r.heal, r.kill] })));
  const rivals = pool.map(r => ({ name: r.name, shop: r.shop, v: Math.round(r.y[key === "heal" ? 0 : 1] * g * (0.85 + rnd() * 0.3) * progress) }));
  const mine = S.cats.map(c => ({ id: c.id, name: nameOf(c.id), shop: "うちの店", v: Math.round(key === "heal" ? c.yHeal || 0 : c.yKills || 0), me: true }));
  return [...mine, ...rivals].sort((a, b) => b.v - a.v);
}

}

const patrolMoneyMul = ids => 1 + ids.reduce((n, id) => n + ((catData(id).patrolMoney || 1) - 1), 0);

const quickNeed = id => { const a = areaData(id), lv = Math.max(1, quickLv(id)); return 14 * (1 + 0.3 * (a.level - 1) + 0.2 * (lv - 1)) * (a.hpBoost || 1) * loopMul(CONFIG.ngEnemy); };

// おまかせで行く猫：おうちで休んでいる猫 → 弱い猫の順（強い猫はパトロール用に残す）

}

// =====================================================================
//  1コマ進める（ゲームの中心）
// =====================================================================
function tick() {
  if (paused || layoutMode || paintStyle || !$("modal").hidden || !$("saveModal").hidden || !S.cats.length || BT) return;
  if (S.today.popStart === null) S.today.popStart = S.pop;
  S.tick++;
  if (phase() === "night") return nightTick();

  // 1. 座っているお客さんの時間を進める
  guests.forEach(g => { if (g.state === "seated" && --g.left <= 0) leave(g); });
  // 満足ゲージが満タンになったら、追加注文かチップ（1人1回）
  guests.filter(g => g.state === "seated" && !g.bonus && score(g) >= greatOf(g.type)).forEach(g => {
    g.bonus = true;
    let p, msg;
    if (Math.random() < 0.5) {
      const onSale = Object.keys(S.menus).filter(id => S.menus[id].on), liked = onSale.filter(id => typeData(g.type).likes.includes(id));
      const m = liked.length ? pick(liked) : pick(onSale);
      p = Math.round(menuPrice(m) * typeData(g.type).pay / 10) * 10; msg = `追加注文！${menuData(m).name} ${yen(p)}`;
      S.today.visitors += 0; addStat("extraOrders");
    } else {
      p = Math.round(guestPrice(g) * (0.3 + Math.random() * 0.3) / 10) * 10; msg = `チップ ${yen(p)}`;
      addStat("tips");
    }
    if (dutyCats().some(c => !c.sleeping && c.skills.includes("chip"))) { p = Math.round(p * 1.5 / 10) * 10; msg = msg.replace(/¥[\d,]+/, yen(p)); }   // チップ名人
    S.money += p; S.today.sales += p; S.monthSales += p;
    fx(g.x, g.y - 18, msg, "money");
  });

  // 2. 新しいお客さん
  const maneki = dutyCats().filter(c => !c.sleeping && c.skills.includes("maneki")).length;
  const crown = dutyCats().reduce((s, c) => s + (c.acc ? accData(c.acc).chance || 0 : 0) + (c.sleeping ? 0 : catData(c.id).chance || 0), 0);
  const chance = CONFIG.customerChance + S.pop * CONFIG.popularityBonus + eff("chance") + maneki * 0.05 + crown
    + (event().chance || 0) + (adData()?.chance || 0)
    ;
  const early = 1 + CONFIG.earlyGuestBoost * Math.max(0, Math.min(1, (40 - S.pop) / 30));   // 序盤はお客さんが多め
  const size = CONFIG.sizeGuestMul[S.expand - 1] || 1;   // 広いお店ほど、通りがかりの人も入ってくる
  // 1コマに来る人数の期待値（1をこえたら、1コマに2組以上来ることもある。広いお店ほど人の出入りが多い）
  if (phase() === "open" && hourNow() < CONFIG.lastOrder) for (let n = chance * early * size * safetyFactor() * avgSatFactor() * todayWeather().mult * OPEN_SCALE; n > 0; n--) if (Math.random() < Math.min(0.95, n)) arrive();

  // 3. 荒らし（街の安全度が低いと来る）
  const avg = townAvg();
  if (!raider && phase() === "open" && hourNow() < CONFIG.closeHour - 2 && (S.today.raids || 0) < CONFIG.raidMax && avg < CONFIG.raidSafety
      && Math.random() < (CONFIG.raidSafety - avg) * CONFIG.raidRate) startRaid();
  if (raider) raidTick();

  // 4. 猫たち
  dutyCats().forEach(catTick);
  // お店に出ているだけでも、少しずつつかれる（起きている猫は CONFIG.idleTire コマごとに元気-1）
  if (S.tick % CONFIG.idleTire === 0) dutyCats().filter(c => !c.sleeping).forEach(c => { c.energy = Math.max(0, c.energy - 1); if (c.energy <= Math.floor(catMax(c) * CONFIG.tiredRate)) { c.sleeping = true; c.target = null; c.play = null; c.fplay = null; c.eat = null; } });
  startPlay();
  startFurnPlay();
  // おやすみ中の猫はおうちで回復
  S.cats.filter(c => !c.duty).forEach(c => { c.energy = Math.min(catMax(c), c.energy + 2); if (c.energy >= catMax(c)) c.sleeping = false; });

  // 5. メニュー開発
  if (S.dev && --S.dev.left <= 0) finishDev();

  // 6. 時計：営業中は30分ずつ。22時になったら閉店（お客さんが全員帰るまで時計は止まる）→ 夜は早送り
  if (phase() === "open") { S.hour = (S.hour ?? CONFIG.openHour) + CONFIG.minutesPerTick / 60; if (S.hour >= CONFIG.closeHour) { S.hour = CONFIG.closeHour; S.phase = "close"; setSpeed(gameSpeed); } }
  if (phase() === "close" && !guests.length && !raider) { S.phase = "night"; setSpeed(gameSpeed); }
  checkNewCats();
  checkNewAreas();
  checkGuestArrivals();
  checkClear();
  checkAchievements();
  checkCollections();
  renderHud(); renderPanel(); renderInfo();
}

// 🌙 夜（閉店〜次の開店）：お客さんは来ない。猫はのんびり休む。時間は早送り
function nightTick() {
  S.hour += 1;
  // 夜は、寝床で寝ている猫だけが回復（起きている猫は回復しない。つかれは次の日に持ちこす）
  dutyCats().forEach(c => { c.target = null; if (c.sleeping && inBed(c)) { c.energy = Math.min(catMax(c), c.energy + catRecover(c)); if (c.energy >= catMax(c)) c.sleeping = false; } });
  S.cats.filter(c => !c.duty).forEach(c => { c.energy = Math.min(catMax(c), c.energy + 2); });
  if (S.dev && --S.dev.left <= 0) finishDev();
  if (S.hour >= 24 + CONFIG.openHour) startNextDay();
  renderHud(); renderPanel(); renderInfo();
}
// 街の安全度は、1週（1日）ごとに下がる（CONFIG.safetyDecay。序盤はゆっくり。下限より下がらない）
function weekDecay() {
  const n = Math.max(1, Math.round((CONFIG.safetyDecay - eff("safety")) * Math.min(1, 0.25 + 0.75 * S.day / CONFIG.earlyDecayWeeks)));
  S.areas.forEach(id => { S.town[id] = Math.max(Math.min(S.town[id], CONFIG.safetyMin), S.town[id] - n); });
}
// 夜が明けて10時になったら、次の週（1日＝1週）
function startNextDay() {
  weekDecay();
  S.hour = CONFIG.openHour; S.phase = "open";
  endDay();
  setSpeed(gameSpeed);
  // 台風の週は、街が荒れて安全度が下がる（その朝に1回）
  if ((S.weather || [])[0] === "typhoon") {
    S.areas.forEach(id => S.town[id] = Math.max(Math.min(S.town[id], CONFIG.safetyMin), S.town[id] - 5));
    addLog("🌀 台風で街が荒れた…。すべての地区の安全度-5");
  }
}
function pickType() {
  const boost = { ...(event().boost || {}) };
  const ad = adData();
  if (ad && ad.boost) Object.entries(ad.boost).forEach(([k, v]) => boost[k] = (boost[k] || 1) * v);
  const list = S.known.map(id => ({ id, w: typeData(id).weight * (boost[id] || 1) * typeFactor(id) * satFactor(id) }));
  let r = Math.random() * list.reduce((s, x) => s + x.w, 0);
  for (const x of list) { if ((r -= x.w) <= 0) return x.id; }
  return list[0].id;
}

// 組で来たぶん、次のお客さんを少しお休み（来るお客さんの合計人数は、今までとほぼ同じ）
let groupDebt = 0;
function arrive() {
  if (groupDebt > 0) { groupDebt--; return; }
  const taken = guests.filter(g => g.seat !== null).map(g => g.seat);
  const free = openSeats().filter(i => !taken.includes(i));
  if (!free.length) {
    S.today.turnedAway++;
    const penalty = Math.random() < CONFIG.turnAwayPenalty;
    if (guests.filter(g => g.seat === null).length >= 4) { if (penalty) S.pop = Math.max(0, S.pop - 1); return; }   // 入口が混みすぎないように
    // 入口まで来て、中をのぞいて引き返す（人気が下がるのは、のぞいたとき）
    const T = typeData(pickType());
    guests.push({ id: ++guestId, seat: null, type: T.id, state: "peek", menu: "coffee", penalty, heal: 0, stay: 0, left: 0,
      x: DOOR.x, y: DOOR.y, path: [{ x: DOOR.x + rand(-6, 6), y: H - rand(20, 26) }],
      look: { hair: pick(T.look.hair), shirt: pick(T.look.shirt), skin: pick(["#f6d7bd", "#ecc3a0", "#d9a77f"]) } });
    return;
  }
  // 荒らしがいる間は、入口で引き返すお客さんも
  if (raider && raider.state !== "out" && Math.random() < 0.6) { fx(DOOR.x, DOOR.y - 14, "荒らしがいる…", "bad"); S.today.fled = (S.today.fled || 0) + 1; return; }
  // お客さんの種類を決めて、好きな雰囲気の床の席があればそこに座りたがる
  const preType = pickType();
  const zone = typeData(preType).zone;
  const zonePick = list => { const z = list.filter(i => seatZone(i) === zone); return z.length && Math.random() < CONFIG.zoneSeatChance ? pick(z) : pick(list); };
  // 何人で来るか：テーブルが丸ごと空いていれば、2人組で来ることも
  const empty = TABLES.map((_, t) => t).filter(t => { const ss = seatsOfTable(t); return ss.length >= 2 && ss.every(i => free.includes(i)); });
  const seats = empty.length && Math.random() < (preType === "couple" ? 0.9 : CONFIG.group2Chance)
    ? seatsOfTable(SEATS[zonePick(empty.map(t => seatsOfTable(t)[0]))].table)
    : [zonePick(free)];
  const type = preType, T = typeData(type), grp = seats.length > 1 ? guestId + 1 : 0;
  const onSale = Object.keys(S.menus).filter(id => S.menus[id].on);
  const liked = onSale.filter(id => T.likes.includes(id));
  seats.forEach((seat, k) => {
    let menu;
    if (S.boom && onSale.includes(S.boom) && Math.random() < 0.4) menu = S.boom;
    else if (liked.length && Math.random() < 0.9) menu = pick(liked);
    else menu = pick(onSale);
    const s = SEATS[seat];
    guests.push({
      id: ++guestId, seat, type, state: "in", menu, grp,
      liked: T.likes.includes(menu), boom: menu === S.boom,
      stay: 0, left: 0, heal: 0, extra: false, fed: false,
      x: DOOR.x, y: DOOR.y + k * 7, path: [{ x: DOOR.x, y: s.y + 14 }, { x: s.x, y: s.y + 14 }, { x: s.x, y: s.y }],
      look: { hair: pick(T.look.hair), shirt: pick(T.look.shirt), skin: pick(["#f6d7bd", "#ecc3a0", "#d9a77f"]) },
    });
  });
  if (grp) { fx(DOOR.x, DOOR.y - 14, "2人組さん！", "like"); groupDebt += seats.length - 1; }
}

function guestPrice(g) {
  return Math.round(menuPrice(g.menu) * typeData(g.type).pay * (g.boom ? 1.5 : 1) * (1 + (event().sales || 0) + eff("sales")) / 10) * 10;
}

function sitDown(g) {
  g.state = "seated";
  if (g.type === "vet") dutyCats().filter(c => c.sleeping && inBed(c)).forEach(c => { c.energy = Math.min(catMax(c), c.energy + 3); if (c.energy >= catMax(c)) c.sleeping = false; });   // 寝ている猫をみてくれる
  const ch = chairOf(g.seat);
  g.chairSat = chairSat(g);
  g.stay = g.left = Math.max(2, rand(CONFIG.stayMin, CONFIG.stayMax) + typeData(g.type).stay + eff("stay") + (ch ? ch.stay : -1) + todayWeather().stay);
  const mate = g.grp && guests.find(x => x !== g && x.grp === g.grp && x.state === "seated");
  if (mate) { g.stay = mate.stay; g.left = mate.left; }
  const p = guestPrice(g);
  S.money += p; S.today.visitors++; S.today.sales += p; S.monthSales += p; S.totalGuests++;
  fx(g.x, g.y - 12, yen(p), "money");
  if (g.liked) setTimeout(() => fx(g.x, g.y - 18, "好物！", "like"), 300);
}

function leave(g) {
  const total = score(g), T = typeData(g.type);
  let delta, msg, fan = 0;
  if (g.heal === 0)                { delta = S.pop < 15 ? 0 : -1; msg = "猫に会えなかった…"; S.today.noCat = (S.today.noCat || 0) + 1; addStat("nocat"); }   // 開店したて（人気15まで）は人気が下がらない
  else if (total >= greatOf(g.type)) {
    delta = Math.max(1, Math.round((T.popGreat || 2) * CONFIG.popGain)); msg = "最高に癒やされた！"; fan = 1; addStat("great");
  }
  else if (total >= goodOf()) { delta = Math.random() < CONFIG.goodPopChance ? 1 : 0; msg = "また来たいな"; fan = Math.random() < CONFIG.goodFanChance ? 1 : 0; }
  else                             { delta = 0; msg = "もっと猫と遊びたかった"; }
  const before = S.pop; addPop(delta, true);
  if (delta > 0 && S.pop === before) { if (S.pop >= popCap() && Math.random() < 0.3) fx(g.x, g.y - 14, "人気が上限", "like"); }
  else if (delta > 0) fx(g.x, g.y - 14, "人気+" + (S.pop - before), "heart");
  if (delta < 0) fx(g.x, g.y - 14, "人気-1", "bad");
  if (delta >= 5) addLog(`${T.name}さんが大絶賛！ 人気+${delta}`);
  else if (delta !== 0 && Math.random() < 0.4) addLog(`${T.name}さん「${msg}」`);
  if (S.pop >= CONFIG.goalPopularity) S.cleared = true;
  if (fan) addFan(g.type, fan);
  // お客さんの種類ごとの満足度（よかったら上がり、残念だと下がる）
  const ts = { ...(S.typeSat || {}) };
  const cur = ts[g.type] ?? 50;
  let next = Math.max(0, Math.min(100, cur + (g.heal === 0 ? -8 : total >= greatOf(g.type) ? 6 : total >= goodOf() ? 2 : -3)));
  // 紹介ライン（fanSatNeed）から上は、好きなメニューを出したときしか上がらない
  if (next > cur && !g.liked && next >= CONFIG.fanSatNeed) {
    next = Math.max(cur, CONFIG.fanSatNeed - 1);
    if (cur >= CONFIG.fanSatNeed - 1 && Math.random() < 0.3) fx(g.x, g.y - 20, "好物が食べたかったな", "like");
  }
  ts[g.type] = next;
  S.typeSat = ts;

  const s = SEATS[g.seat];
  g.state = "out"; g.seat = null;
  g.path = [{ x: s.x, y: s.y + 14 }, { x: DOOR.x, y: s.y + 14 }, { x: DOOR.x, y: DOOR.y }];
}

// 地区の解放・季節のステージ・人気でやって来るお客さん
const arriveOk = t => { const a = t.arrive; return a.area ? S.areas.includes(a.area) : a.season ? (S.seasonWins || []).includes(a.season) : a.pop ? S.pop >= a.pop : false; };
const arriveText = a => a.area ? `${areaData(a.area).name}が解放されると来るらしい` : a.season ? `${areaData(a.season).name}（${areaData(a.season).months}）のパトロールで勝つと来るらしい` : `人気${a.pop}のお店になると来るらしい`;
function checkGuestArrivals() {
  GUEST_TYPES.filter(t => t.arrive && !S.known.includes(t.id) && arriveOk(t)).forEach(t => {
    S.known.push(t.id);
    addLog(`新しいお客さん「${t.name}」が来るようになった！`);
    queueModal("🙋 新しいお客さん！", `<div class="bigemoji">🎉</div>
      <div><b>${t.name}</b>さんが来るようになりました！</div>
      <table><tr><td>特徴</td><td>${t.desc}</td></tr><tr><td>好きなメニュー</td><td>${t.likes.map(id => S.menus[id] ? menuData(id).name : "？？？").join("・")}</td></tr>
      ${t.special ? `<tr><td>とくべつ</td><td>${t.special}</td></tr>` : ""}</table>`);
  });
}
// ファンが増えると、新しいお客さんを紹介してくれる
function addFan(type, n) {
  S.fans[type] = (S.fans[type] || 0) + n;
  if (S.fans[type] < CONFIG.fanNeed || typeSat(type) < CONFIG.fanSatNeed) return;
  GUEST_TYPES.filter(t => t.from === type && !S.known.includes(t.id)).forEach(t => {
    S.known.push(t.id);
    const from = typeData(type).name;
    addLog(`${from}さんが${t.name}さんを紹介してくれた！`);
    queueModal("🤝 紹介！", `
      <div class="bigemoji">🎉</div>
      <div>常連の<b>${from}</b>さんが、知り合いの<b>${t.name}</b>さんを連れてきてくれた！</div>
      <table><tr><td>特徴</td><td>${t.desc}</td></tr>
      <tr><td>好きなメニュー</td><td>${t.likes.map(id => S.menus[id] ? menuData(id).name : "？？？").join("・")}</td></tr>
      ${t.special ? `<tr><td>とくべつ</td><td>${t.special}</td></tr>` : ""}</table>
      <div class="note">「情報」タブのお客さん図鑑で確認できます。</div>`);
  });
}

// ---------- お店の荒らし ----------
function startRaid() {
  const avg = townAvg();
  const type = avg < 20 ? pick(["dog", "crow"]) : avg < 35 ? pick(["rat", "crow"]) : "rat";
  const maxY = areaMaxY();
  const rhp = Math.round(RAIDS[type].hp * loopMul(CONFIG.ngEnemy));
  raider = { type, hp: rhp, max: rhp, state: "in", left: CONFIG.raidTicks,
             x: DOOR.x, y: DOOR.y, tx: rand(36, areaMaxX()), ty: rand(40, maxY) };
  raider.wp = [doorIn()];   // 入口から入ってくる
  S.today.raids = (S.today.raids || 0) + 1;
  addLog(`⚠️ ${ENEMIES[type].name}がお店に入ってきた！ 猫たちが追い払いに向かう！`);
  fx(DOOR.x, H - 14, `${ENEMIES[type].name}が侵入！`, "bad");
}
const chasers = () => dutyCats().filter(c => !c.sleeping && c.x !== undefined).sort((a, b) =>
  Math.hypot(a.x - raider.x, a.y - raider.y) - Math.hypot(b.x - raider.x, b.y - raider.y)).slice(0, 2);
function raidTick() {
  if (raider.state === "out") return;
  raider.t = (raider.t || 0) + 1;   // 入ってきてからの時間（長いほど被害が大きい）
  // お客さんがこわがる（荒らしが長くいるほど、満足がどんどん下がる）
  guests.forEach(g => {
    if (g.state !== "seated" || (g.scared || 0) >= CONFIG.raidScareMax) return;
    g.scared = (g.scared || 0) + 1;
    if (g.scared === 1) fx(g.x, g.y - 14, "こわい…", "bad");
    else if (g.scared % 3 === 0) fx(g.x, g.y - 14, "満足-" + g.scared, "bad");
  });
  // 長くいるほど、逃げて帰るお客さんが増える
  const fleeRate = RAIDS[raider.type].flee * (raider.state === "raid" ? 1 : 0.5) * (1 + CONFIG.raidFleeGrow * raider.t);
  guests.filter(g => g.state === "seated").forEach(g => {
    if (Math.random() >= fleeRate) return;
    fx(g.x, g.y - 16, "もう帰る！", "bad");
    g.heal = 0; g.scared = CONFIG.raidScareMax; leave(g);   // 猫に会えなかった扱いで帰る（人気-1）
    const ts = { ...(S.typeSat || {}) }; ts[g.type] = Math.max(0, (ts[g.type] ?? 50) - 4); S.typeSat = ts;   // そのお客さんの満足度もさらに下がる
    S.today.fled = (S.today.fled || 0) + 1;
  });
  // 近くの猫が攻撃
  chasers().forEach(c => {
    if (Math.hypot(c.x - raider.x, c.y - raider.y) > 9) return;
    raider.hp -= battleStats(c).atk; (raider.hitters = raider.hitters || []).includes(c.id) || raider.hitters.push(c.id); c.energy = Math.max(0, c.energy - 1);
    fx(raider.x, raider.y - 8, "ﾈｺﾊﾟﾝﾁ!", "lv");
    if (c.energy <= 0) { c.sleeping = true; c.target = null; }
  });
  if (raider.hp <= 0) {
    addPop(1); S.today.repelled++; addStat("repelled");
    (raider.hitters || []).forEach(id => { const c = S.cats.find(x => x.id === id); if (c) { c.repels = (c.repels || 0) + 1; gainBxp(c, 3); } });
    addLog(`猫たちが${ENEMIES[raider.type].name}を追い払った！ 人気+1`);
    fx(raider.x, raider.y - 12, "追い払った！", "heart");
    return raidLeave();
  }
  if (raider.state === "raid" && --raider.left <= 0) {
    const R = RAIDS[raider.type], name = ENEMIES[raider.type].name, cost = Math.round(R.repair * (1 + 0.5 * (S.expand - 1)));
    S.money -= cost; S.today.repair += cost;
    S.pop = Math.max(0, S.pop - R.pop);
    addLog(`${name}にお店を荒らされた…。修理費${yen(cost)}・人気-${R.pop}`);
    fx(raider.x, raider.y - 12, `修理費 ${yen(cost)}`, "bad");
    // 家具を壊す
    const ok = S.items.filter(id => !S.broken.includes(id));
    if (ok.length && Math.random() < R.breaks) {
      const id = pick(ok); S.broken.push(id);
      addLog(`${name}に${itemData(id).name}を壊された！ その家具をタップするか「お店」タブで修理できます。`);
      (S.today.brokeList = S.today.brokeList || []).push(itemData(id).name);
    }
    // 素材を盗む
    const have = Object.keys(S.mats).filter(k => S.mats[k] > 0);
    if (have.length && R.steal) {
      const k = pick(have), n = Math.min(S.mats[k], rand(1, R.steal));
      S.mats[k] -= n; addLog(`${name}に${MATERIALS[k]}を${n}個盗まれた…`);
      (S.today.stolen = S.today.stolen || []).push(`${MATERIALS[k]}${n}`);
    }
    raidLeave();
  }
}
// 荒らしは入口を通って出入りする（壁や外を通りぬけない）
const doorIn = () => ({ x: DOOR.x, y: Math.min(shopBottom(), H) - 6 });
function raidLeave() { raider.state = "out"; raider.wp = [doorIn(), { x: DOOR.x, y: DOOR.y }]; raider.tx = raider.x; raider.ty = raider.y; }

// ---------- 猫同士のじゃれ合い ----------
// 🐾 まじめさ（★1〜5）：高いほど、お客さんが待っていると遊びをやめて接客に行く。Lv10・Lv20で+1
const CAT_DIL = { goro: 1, yoga: 5, daifuku: 2, kuro: 5, mike: 3, tora: 2, tama: 1, mugi: 2, kiji: 4, saba: 2, hachi: 4, shiro: 3, munchkin: 1, ofuku: 5, persian: 2, ragdoll: 3, captain: 5, mamoru: 5, chef: 5, tetsu: 4, gonta: 2, momo: 5, hime: 1, niko: 3, nyanta: 4, milk: 5, raiga: 3, arcana: 5 };
const dilBase = id => CAT_DIL[id] ?? 1 + [...id].reduce((n, ch) => n + ch.charCodeAt(0) * 7, 0) % 5;
const dilOf = c => Math.min(5, dilBase(c.id) + (c.lv >= 10 ? 1 : 0) + (c.lv >= 20 ? 1 : 0));
const dilStars = c => "★".repeat(dilOf(c)) + "☆".repeat(5 - dilOf(c));
// 同じ組で座っている人たち（ひとりなら自分だけ）。2人組は猫1匹で2人とも接客できる
const matesOf = g => g.grp ? guests.filter(x => x.grp === g.grp && x.state === "seated") : [g];
const servedIds = () => dutyCats().flatMap(c => { const t = guests.find(x => x.id === c.target); return t ? matesOf(t).map(x => x.id) : []; });
const waitingGuests = () => { const sv = servedIds(); return guests.filter(g => g.state === "seated" && !sv.includes(g.id)).length; };
// お客さんが待っているのに遊ぶか（まじめなほど遊ばない）
const lazyOk = c => !waitingGuests() || Math.random() < (5 - dilOf(c)) * 0.2;
function startPlay() {
  if (raider || Math.random() > CONFIG.playChance) return;
  const idle = dutyCats().filter(c => !c.sleeping && !c.target && !c.play && c.energy > 3 && c.x !== undefined && lazyOk(c));
  if (idle.length < 2) return;
  const a = pick(idle), b = pick(idle.filter(c => c !== a));
  const mx = Math.max(30, Math.min(areaMaxX(), Math.round((a.x + b.x) / 2))), my = Math.max(44, Math.min(areaMaxY(), Math.round((a.y + b.y) / 2)));
  const until = S.tick + rand(3, 5);
  a.play = { partner: b.id, until, mx, my, side: -1 };
  b.play = { partner: a.id, until, mx, my, side: 1 };
}
// ---------- 家具で遊ぶ ----------
const furnSpot = id => { const [x, y] = furnPos(id), sp = FURN_PLAY[id].spot; return { x: x + sp[0], y: y + sp[1] }; };
const atFurnSpot = c => { if (!c.fplay) return false; const p = furnSpot(c.fplay.id); return Math.hypot(c.x - p.x, c.y - p.y) < 2; };
function startFurnPlay() {
  if (raider || Math.random() > CONFIG.furnPlayChance + eff("play")) return;
  const busy = dutyCats().filter(c => c.fplay).map(c => c.fplay.id);
  const toys = Object.keys(FURN_PLAY).filter(id => has(id) && !busy.includes(id) && furnSpot(id).x <= areaMaxX() + 8 && furnSpot(id).y <= areaMaxY() + 8);
  const idle = dutyCats().filter(c => !c.sleeping && !c.target && !c.play && !c.fplay && c.energy > 2 && c.x !== undefined && lazyOk(c));
  if (!toys.length || !idle.length) return;
  const id = pick(toys);
  pick(idle).fplay = { id, until: S.tick + rand(3, 6) };
}
// お客さんが待っていたら、まじめな猫は遊びをやめる
function backToWork(c) {
  if (!waitingGuests() || Math.random() >= dilOf(c) * 0.12) return false;
  fx(c.x, c.y - 12, "おしごと！", "lv");
  const p = c.play && S.cats.find(x => x.id === c.play.partner);
  if (p) p.play = null;
  c.play = null; c.fplay = null;
  return true;
}
function furnPlayTick(c) {
  if (S.tick >= c.fplay.until || !has(c.fplay.id) || backToWork(c)) { c.fplay = null; return false; }
  if (!atFurnSpot(c)) return true;
  const P = FURN_PLAY[c.fplay.id], p = furnSpot(c.fplay.id);
  c.exp += 0.5;
  if (Math.random() < 0.45) fx(p.x, p.y - 12, pick(P.words), "heart");
  guests.filter(g => g.state === "seated" && Math.hypot(g.x - p.x, g.y - p.y) < 40).forEach(g => {
    if (Math.random() < 0.5) { g.heal += CONFIG.playHeal; if (Math.random() < 0.3) fx(g.x, g.y - 16, "かわいい…", "heart"); }
  });
  return true;
}
const atPlaySpot = c => c.play && Math.hypot(c.x - (c.play.mx + c.play.side * 5), c.y - c.play.my) < 2;
function playTick(c) {
  const p = S.cats.find(x => x.id === c.play.partner);
  if (S.tick >= c.play.until || !p || !p.duty || p.sleeping || !p.play || backToWork(c)) { c.play = null; return false; }
  if (!atPlaySpot(c) || !atPlaySpot(p) || c.play.side > 0) return true;   // 片方の猫だけが演出を担当
  const { mx, my } = c.play;
  fx(mx, my - 12, pick(["にゃっ", "にゃにゃ！", "ぺしぺし", "ころころ", "ふにゃ〜"]), "heart");
  c.exp += 1; p.exp += 1;
  // 近くのお客さんがほっこり
  guests.filter(g => g.state === "seated" && Math.hypot(g.x - mx, g.y - my) < 36).forEach(g => {
    g.heal += CONFIG.playHeal;
    if (Math.random() < 0.4) fx(g.x, g.y - 16, "かわいい…", "heart");
  });
  return true;
}

// 寝床の場所と、寝床に着いているか
// 🍚 寝床のとなりのごはん皿（右はしの寝床は左がわ）
const bowlOf = c => { const b = bedOf(c); return { x: b.x + (b.x > shopRight() - 24 ? -13 : 13), y: b.y + 2 }; };
const atBowl = c => c.x !== undefined && Math.hypot(c.x - bowlOf(c).x, c.y - bowlOf(c).y) < 3;
// 🛏️ 寝床の形：猫ごとにお気に入りがある（どれも中はピンクのクッション＝ここで回復）
const BED_STYLE_OF = { nabe: "pot", daifuku: "pot", chashu: "box", goro: "box", uchu: "dome", persian: "dome", ragdoll: "dome", tama: "basket", yoga: "basket" };
const BED_STYLES = ["cushion", "basket", "box", "pot", "dome"];
const bedStyleOf = id => BED_STYLE_OF[id] || BED_STYLES[[...id].reduce((n, ch) => n + ch.charCodeAt(0) * 3, 0) % BED_STYLES.length];
// ✨ レベルが上がると寝床が豪華になる（Lv10 リボン、Lv20 金のふち、Lv30 天がい＋きらきら）
const bedTier = c => c.lv >= 30 ? 3 : c.lv >= 20 ? 2 : c.lv >= 10 ? 1 : 0;
// ふわふわのクッション：角を丸く、上のふちをもこもこに、つやと影をつける
function fluffy(x0, y0, w, h, base = "#f7c3d3", light = "#fff0f5", shade = "#e98aa6") {
  rect(x0 + 1, y0, w - 2, h, base); rect(x0, y0 + 1, w, h - 2, base);
  for (let i = x0 + 1; i < x0 + w - 1; i += 2) rect(i, y0 - 1, 1, 1, base);   // もこもこのふち
  rect(x0 + 2, y0 + 1, w - 4, 1, light); rect(x0 + 2, y0 + 2, 1, 1, "#ffffff"); rect(x0 + w - 4, y0 + 1, 1, 1, "#ffffff");
  rect(x0 + 1, y0 + h - 1, w - 2, 1, shade);
}
function drawBed(style, x, y, tier = 0) {
  if (tier >= 3) {   // 天がい（レースのカーテン）
    rect(x - 9, y - 14, 18, 2, "#f2c230"); rect(x - 9, y - 12, 2, 10, "#fff6fa"); rect(x + 7, y - 12, 2, 10, "#fff6fa"); rect(x - 7, y - 12, 14, 1, "#ffd6e4");
  }
  if (style === "basket") {   // かご
    rect(x - 7, y - 3, 14, 8, "#b07a3e"); for (let i = -6; i < 7; i += 3) rect(x + i, y - 3, 1, 8, "#8a5a2a"); rect(x - 7, y + 1, 14, 1, "#8a5a2a");
    rect(x - 7, y - 4, 14, 1, "#c9944f"); fluffy(x - 5, y - 2, 10, 4);
  } else if (style === "box") {   // 段ボール箱
    rect(x - 7, y - 4, 14, 9, "#c9a06a"); rect(x - 9, y - 6, 4, 2, "#b88a55"); rect(x + 5, y - 6, 4, 2, "#b88a55");
    rect(x - 7, y + 4, 14, 1, "#a88050"); rect(x - 3, y + 2, 6, 1, "#a88050"); fluffy(x - 6, y - 3, 12, 4, "#f2a6be", "#fbd6e2", "#d9849e");
  } else if (style === "pot") {   // 土鍋
    rect(x - 7, y - 2, 14, 7, "#5a4a42"); rect(x - 8, y - 3, 16, 2, "#7a6a60"); rect(x - 9, y - 1, 2, 2, "#7a6a60"); rect(x + 7, y - 1, 2, 2, "#7a6a60");
    rect(x - 6, y + 2, 12, 1, "#e8d8c0"); fluffy(x - 6, y - 3, 12, 3);
  } else if (style === "dome") {   // ドーム型
    fluffy(x - 7, y - 7, 14, 12, "#e98aa6", "#f7c3d3", "#d0708e"); rect(x - 3, y - 2, 6, 6, "#8a3f5c"); rect(x - 2, y - 3, 4, 1, "#8a3f5c");   // 入口（丸い穴）
    rect(x - 3, y + 2, 6, 2, "#f7c3d3"); rect(x - 6, y - 9, 2, 2, "#e98aa6"); rect(x + 4, y - 9, 2, 2, "#e98aa6");   // 中のクッションと、ねこ耳
  } else { fluffy(x - 8, y - 3, 16, 9, "#e98aa6", "#f7c3d3", "#d0708e"); fluffy(x - 5, y - 1, 10, 5); }   // ふかふかクッション
  if (tier >= 1) { rect(x + 4, y - 4, 2, 2, "#e0473c"); rect(x + 6, y - 5, 2, 1, "#e0473c"); rect(x + 6, y - 3, 2, 1, "#e0473c"); }   // リボン
  if (tier >= 2) { rect(x - 8, y + 5, 16, 1, "#f2c230"); rect(x - 8, y - 3, 1, 8, "#f2c230"); rect(x + 7, y - 3, 1, 8, "#f2c230"); }   // 金のふち
  if (tier >= 3 && Math.floor(performance.now() / 400) % 2) { rect(x - 10, y - 8, 1, 1, "#fff6b0"); rect(x + 9, y - 4, 1, 1, "#ffffff"); rect(x - 3, y - 15, 1, 1, "#fff6b0"); }   // きらきら
}
function drawBowl(x, y) {
  rect(x - 3, y, 7, 2, "#4f7fd6"); rect(x - 2, y + 2, 5, 1, "#3a62b0");
  rect(x - 2, y - 1, 5, 1, "#c9824a"); rect(x - 1, y - 2, 1, 1, "#e0a060"); rect(x + 1, y - 2, 1, 1, "#b06a3a");
}
const bedOf = c => { const b = BEDS[Math.max(0, dutyCats().indexOf(c))]; return { x: b[0], y: b[1] + 1 }; };
const inBed = c => c.x !== undefined && Math.hypot(c.x - bedOf(c).x, c.y - bedOf(c).y) < 3;
function catTick(c) {
  if (c.sleeping) {
    if (!inBed(c)) { if (S.tick % 4 === 0) fx(c.x, c.y - 10, "ねむい…", "zz"); return; }   // 寝床に着くまで回復しない
    c.energy = Math.min(catMax(c), c.energy + catRecover(c));
    if (c.energy >= catMax(c)) { c.energy = catMax(c); c.sleeping = false; fx(c.x, c.y - 10, "元気いっぱい！", "lv"); }
    else if (S.tick % 3 === 0) fx(c.x, c.y - 8, "Zz", "zz");
    return;
  }
  if (raider && raider.state !== "out" && chasers().includes(c)) { c.target = null; c.play = null; c.fplay = null; c.eat = null; return; }   // 荒らしを追いかけ中
  if (c.eat) {   // 🍚 ごはん中（お客さんが待っていると、まじめな猫は食べるのをやめる）
    if (S.tick >= c.eat.until || !lazyOk(c)) c.eat = null;
    else { if (atBowl(c) && Math.random() < 0.7) fx(c.x, c.y - 10, pick(["もぐもぐ", "カリカリ", "おいしい♪", "ぺろり"]), "heart"); return; }
  }
  if (c.play && playTick(c)) return;   // じゃれ合い中
  if (c.fplay && furnPlayTick(c)) return;   // 家具で遊び中
  let g = guests.find(x => x.id === c.target && x.state === "seated");
  if (!g || c.serve >= 2) {   // 1人を2回なでたら、次のお客さんへ（みんなに会えるように）
    c.target = null; c.serve = 0;
    const busy = servedIds();
    const fav = catData(c.id).fav;
    g = guests.filter(x => x.state === "seated" && !busy.includes(x.id))
      .sort((a, b) => (a.type === fav ? -3 : 0) + a.heal - ((b.type === fav ? -3 : 0) + b.heal))[0];
    if (g) c.target = g.id;
  }
  if (!g) {
    if (!c.play && !c.fplay && Math.random() < 0.03) { c.eat = { until: S.tick + 3 }; return; }   // ヒマなときは、たまにごはん
    if (c.skills.includes("kanban") && Math.random() < 0.02) {
      addPop(1, true);
      fx(c.x, c.y - 10, "看板猫！人気+1", "heart");
    }
    return;
  }
  const p = servePos(g.seat);
  if (Math.hypot(c.x - p.x, c.y - p.y) > 3) return;   // まだ歩いている途中

  // お客さんを癒やす
  let h = catHeal(c);
  if (catData(c.id).fav === g.type) { h += 2; if (Math.random() < 0.4) fx(c.x, c.y - 10, "お気に入り♥", "heart"); }
  else if (Math.random() < 0.5) fx(c.x, c.y - 8, "♥", "heart");
  if (g.type === "maniac") h += c.skills.length;
  const party = matesOf(g);   // 2人組なら、となりの人もいっしょに癒やされる（元気は1回分だけ）
  party.forEach(m => { m.heal += h; });
  if (party.length > 1 && Math.random() < 0.3) fx(c.x, c.y - 14, "2人まとめて♥", "heart");
  c.healCount = (c.healCount || 0) + 1;
  c.yHeal = (c.yHeal || 0) + h * party.length;   // 今年かせいだ満足
  c.serve++; c.energy--;
  c.exp += (catData(c.id).growth || 1) * (c.acc ? accData(c.acc).exp || 1 : 1);
  party.filter(m => menuData(m.menu).forCat && !m.fed).forEach(m => {
    m.fed = true; m.heal += 2;
    fx(c.x, c.y - 10, "おやつ！", "heart");
  });
  if (c.skills.includes("beg") && !g.extra && Math.random() < 0.2) {
    g.extra = true;
    const p2 = guestPrice(g);
    S.money += p2; S.today.sales += p2; S.monthSales += p2;
    fx(g.x, g.y - 12, "おかわり " + yen(p2), "money");
  }
  if (c.lv >= maxLv(c)) c.exp = Math.min(c.exp, c.lv * CONFIG.expPerLevel);   // MAXならもう上がらない
  else if (c.exp >= c.lv * CONFIG.expPerLevel) {
    c.exp = 0; c.lv++;
    fx(c.x, c.y - 12, "Lv UP!", "lv");
    addLog(`${nameOf(c.id)}がLv${c.lv}になった！`);
  }
  if (c.energy <= Math.floor(catMax(c) * CONFIG.tiredRate)) { c.sleeping = true; c.target = null; c.play = null; c.fplay = null; c.eat = null; }
}

// ---------- 1週・1か月の終わり ----------
function endDay() {
  guests = []; raider = null;
  const food = S.cats.reduce((sum, c) => sum + foodCost(c), 0);
  const rentFree = S.day <= CONFIG.weeksPerMonth;   // 最初の1か月は、大家さんからの開店祝いで家賃なし
  const rentFull = rentFree ? 0 : rentOf(), rentWait = S.money < 0 && rentFull > 0;
  if (rentFree) addLog(`🏠 大家さん「開店おめでとう！ 最初の1か月は家賃いらないよ」（あと${CONFIG.weeksPerMonth - S.day}週）`);   // お金がマイナスの週は、大家さんが家賃を待ってくれる
  const rent = rentWait ? 0 : rentFull;
  if (rentWait) addLog(`🏠 大家さん「大変そうだね。今週の家賃（${yen(rentFull)}）はいいよ。がんばって！」`);
  S.money -= food + rent;
  homeTraining();
  S.cats.forEach(c => { c.energy = catMax(c); c.sleeping = false; c.target = null; });
  const t = S.today, diff = S.pop - (t.popStart ?? S.pop), hs = hints();
  const net = t.sales - food - rent - (t.repair || 0), it = (k, v, cls = "") => `<span>${k}</span><b class="${cls}">${v}</b>`;
  if (t.turnedAway >= 3) hs.unshift({ go: "shop:seat", text: `🪑 満席で${t.turnedAway}人帰った → 席を増やす` });
  queueModal(`🌙 ${month()}月 第${weekOfMonth()}週 おつかれさま`, `
    <div class="wk">
      ${it("収支", `${net >= 0 ? "+" : "-"}${yen(Math.abs(net))}`, net >= 0 ? "plus" : "minus")}
      ${it("売上", "+" + yen(t.sales), "plus")}
      ${it("来客", t.visitors + "人")}
      ${it("ごはん代", "-" + yen(food), "minus")}
      ${it("家賃", rentWait ? "0（待ってくれた）" : "-" + yen(rent), "minus")}
      ${t.repair ? it("修理費", "-" + yen(t.repair), "minus") : ""}
      ${it("人気", `${diff >= 0 ? "+" : ""}${diff}`, diff >= 0 ? "plus" : "minus")}
      ${it("街の安全", townAvg() + "%")}
      ${t.turnedAway ? it("満席で帰宅", t.turnedAway + "人", "minus") : ""}
      ${t.raids ? it("荒らし", `${t.raids}回（撃退${t.repelled || 0}）`) : ""}
      ${t.fled ? it("逃げた客", t.fled + "人", "minus") : ""}
      ${t.brokeList ? it("壊れた家具", t.brokeList.join("・"), "minus") : ""}
      ${t.stolen ? it("盗まれた", t.stolen.join("・"), "minus") : ""}
    </div>
    ${hs.map(h => `<button class="hintbtn" data-hint="${h.go}">💡 ${h.text} ▶</button>`).join("")}`);

  if (S.ad && --S.ad.days <= 0) { addLog(`${adData().name}の効果が終わった。`); S.ad = null; }
  // 街の安全度が下がる
  S.areas.forEach(id => {   // 安全度は weekDecay で下がる。ここでは荒れている地区のチェックだけ
    if (S.town[id] < 20) { S.pop = Math.max(0, S.pop - 2); addLog(`${areaData(id).name}が荒らされている…。人気-2`); }
  });
  const monthEnd = weekOfMonth() === CONFIG.weeksPerMonth;
  if (monthEnd) monthRanking();
  if (monthEnd && month() === ((CONFIG.startMonth + 10) % 12) + 1) yearAward();   // 1年の最後の月の終わり
  addStat("sales", S.today.sales || 0); S.lastNoCat = (S.today.noCat || 0) >= 3 && (S.today.noCat || 0) / Math.max(1, S.today.visitors) >= 0.2 ? S.today.noCat : 0;   // 先週たくさん会えなかったときだけ
  S.day++; S.tick = 0; S.wd = 0; S.hour = CONFIG.openHour; S.phase = "open"; S.today = newDayStats();
  makeForecast();
  if (monthEnd) startMonth(true);
  save();
}

// 街のねこランキング（うちの猫＋ライバル店の看板猫）
function townCatRanking() {
  const mi = monthIndex(), g = CONFIG.rivalGrowth, L = loopMul(CONFIG.ngRival);
  const rivals = rivalCatsFor(RIVAL_CATS).map(r => ({ name: r.name, shop: r.shop, heal: Math.round((r.heal + 0.5 * mi * g) * L), pow: Math.round((r.pow + 1.5 * mi * g) * L), lv: Math.round((r.lv + 0.8 * mi * g) * L) }));
  const mine = S.cats.map(c => ({ id: c.id, name: nameOf(c.id), shop: "うちの店", heal: catHeal(c), pow: battlePower(c), lv: c.lv, me: true }));
  const all = [...mine, ...rivals];
  return [["💗 癒し部門", "heal"], ["💪 戦闘力部門", "pow"], ["⭐ レベル部門", "lv"]].map(([title, key]) => ({ title, key, list: [...all].sort((a, b) => b[key] - a[key] || (b.me ? 1 : 0) - (a.me ? 1 : 0)) }));
}

function monthRanking() {
  // 猫の部門で1位ならごほうび
  const awards = townCatRanking().filter(r => r.list[0].me);
  awards.forEach(() => { S.money += CAT_AWARD.money; addPop(CAT_AWARD.pop); });
  if (awards.length) {
    addLog(`ねこアワード：${awards.map(r => `${r.title}で${r.list[0].name}が1位！`).join(" ")}`);
    queueModal(`🐾 ${month()}月 ねこアワード`, `
      <div>街のねこランキングで、うちの猫が1位をとりました！</div>
      <table>${awards.map(r => `<tr><td>${r.title}</td><td>${r.list[0].name}</td></tr>`).join("")}</table>
      <div>ごほうび：1部門につき <b>${yen(CAT_AWARD.money)}</b>・人気+${CAT_AWARD.pop}</div>`);
  }
  const mi = monthIndex();
  const me = { name: "うちのお店", score: Math.round(S.monthSales / 1000) + S.pop, me: true };
  const list = ALL_SHOPS.map(r => ({ name: r.name, score: Math.round((r.base + r.grow * CONFIG.rivalGrowth * mi) * loopMul(CONFIG.ngRival) * (0.9 + Math.random() * 0.2)) }));
  list.push(me);
  list.sort((a, b) => b.score - a.score);
  const place = list.indexOf(me) + 1;
  S.bestPlace = S.bestPlace === null ? place : Math.min(S.bestPlace, place);
  const prize = PRIZES[place - 1];
  if (prize) { S.money += prize.money; addPop(prize.pop); }
  if (place === 1) gainLimitItem(1, "グランプリ1位のごほうび");
  S.lastRank = { label: `${year()}年目 ${month()}月`, list, place };
  addLog(`${month()}月のねこカフェグランプリは${place}位！`);
  queueModal(`🏆 ${month()}月 ねこカフェグランプリ`, `
    <div class="note">今月の売上と人気で、街のねこカフェが競います。</div>
    ${rankRows(list, x => x.score, "点")}
    <div>${prize ? `賞金 <b>${yen(prize.money)}</b>・人気+${prize.pop} をもらった！` : "3位以内で賞金がもらえます。来月もがんばろう！"}</div>`);
  if (S.pop >= CONFIG.goalPopularity) S.cleared = true;
}

function startMonth(show) {
  S.monthSales = 0;
  S.boom = pick(MENUS.filter(m => m.id !== "coffee")).id;
  const ev = event();
  if (ev.gift) S.money += ev.gift;
  if (!show) return;
  const bm = menuData(S.boom);
  queueModal(`📅 ${year()}年目 ${month()}月`, `
    ${ev.name ? `<div><b>🎊 ${ev.name}</b><br>${ev.desc}</div>` : `<div>今月は特別なイベントはありません。</div>`}
    ${CATS.filter(d => seasonal(d) && catCond(d) && !S.cats.some(c => c.id === d.id)).map(d => `<div><b>🐾 季節の猫</b><br>${d.name}が保護猫センターに来ています（今月だけ）。</div>`).join("")}
    <div><b>📈 ${bm.name}ブーム！</b><br>販売中なら注文が増えて、値段1.5倍・満足+2。${S.menus[S.boom] ? "" : "<br><span class=\"note\">まだ開発していないメニューです。開発のチャンス！</span>"}</div>`);
}

  { id: "guests", text: n => `お客さんを${n.toLocaleString()}人むかえる`,      base: 500,    get: () => S.totalGuests },
  { id: "great",  text: n => `「最高！」を${n}回もらう`,                      base: 200,    get: () => statOf("great") },

];
const yearTasks = y => [0, 1, 2].map(k => YEAR_TASKS[(y * 2 + k * 3) % YEAR_TASKS.length]);   // 年ごとに組み合わせが変わる
const yearNeed = (t, y) => { const n = t.base * (["guests", "great", "sales", "tips"].includes(t.id) ? CONFIG.weekScale : 1) * (1 + 0.3 * (y - 1)) * loopMul(0.3); const r = n >= 100000 ? 10000 : n >= 100 ? 10 : 1; return Math.round(n / r) * r; };
const yearReward = y => 10000 + 10000 * y;   // 1年目2万・2年目3万…（月のグランプリ1位と同じくらい）
function checkCollections() {
  // 年が変わったら、今年の挑戦を始める（いまの記録からの増えた分で数える）
  if (!S.yc || S.yc.year !== year()) S.yc = { year: year(), from: Object.fromEntries(YEAR_TASKS.map(t => [t.id, t.get()])), done: [] };
  yearTasks(S.yc.year).forEach(t => {
    if (S.yc.done.includes(t.id) || t.get() - S.yc.from[t.id] < yearNeed(t, S.yc.year)) return;
    S.yc.done.push(t.id); S.money += yearReward(S.yc.year);
    addLog(`🗓️ 今年の挑戦「${t.text(yearNeed(t, S.yc.year))}」達成！ ${yen(yearReward(S.yc.year))}`);
    telop("🗓️ 今年の挑戦 達成！", `${t.text(yearNeed(t, S.yc.year))}・${yen(yearReward(S.yc.year))}`, true);
    if (S.yc.done.length === 3) gainLimitItem(1, `${S.yc.year}年目の挑戦をぜんぶ達成`);
  });
  COLLECTIONS.forEach(cl => {
    const [v, max] = cl.prog();
    if ((S.coll || []).includes(cl.id) || v < max) return;
    S.coll = [...(S.coll || []), cl.id]; S.money += cl.money;
    addLog(`📚 コレクション「${cl.name}」コンプリート！ ${yen(cl.money)}`);
    telop("📚 コンプリート！", `${cl.name}・${yen(cl.money)}・限界突破の鈴×${cl.bell}`, true);
    gainLimitItem(cl.bell, `${cl.name}コンプリート`);
  });
}

function act(kind, id) {
  const pay = (cost, mat) => payAll(cost, mat);
  if (kind === "ngplus") {
    if (!S.endingShown) return;
    if (!ngArmed) { ngArmed = true; setTimeout(() => { ngArmed = false; renderPanel(true); }, 4000); return renderPanel(true); }
    ngArmed = false;
    return startNewGamePlus(($("ngPartner") || {}).value);
  }
  if (kind === "catFocusOff") { catFocus = null; renderPanel(true); return; }
  if (kind === "catOpen") { catFocus = id; renderPanel(true); $("panel").scrollTop = 0; return; }
  if (kind === "goShop") {   // ショップの、その見出しを開く
    const tb = id === SHOP_SECS.cat ? "cats" : "store";   // 保護猫センターは猫の項目
    if ($("drawer").hidden || tab !== tb) openDrawer(tb);
    subSel[tb] = id; renderPanel(true); $("panel").scrollTop = 0;
    return;
  }
  if (kind === "shopBack") { subSel.store = null; applySub(); fitPanel(); $("panel").scrollTop = 0; return; }
  if (kind === "counter") {
    if ((S.counter || 0) >= counterCap() || !pay(counterPrice())) return;

function moveTo(o, tx, ty, speed, dt) {
  const dx = tx - o.x, dy = ty - o.y, d = Math.hypot(dx, dy);
  if (d < 0.5) { o.x = tx; o.y = ty; return true; }
  const step = Math.min(d, speed * dt);
  o.x += dx / d * step; o.y += dy / d * step;
  return false;
}

function update(dt) {
  guests.forEach(g => {
    if (g.wait > 0) { g.wait -= dt; return; }   // 立ち止まっている
    if (!g.path.length) return;
    if (moveTo(g, g.path[0].x, g.path[0].y, 34, dt)) {
      g.path.shift();
      if (!g.path.length && g.state === "in") sitDown(g);
      if (!g.path.length && g.state === "peek") {   // 満席：入口でのぞいて、引き返す
        fx(g.x, g.y - 16, pick(["満席だ…", "いっぱいだ…", "また今度にしよう…", "座れないや…"]), "bad");
        if (g.penalty) { S.pop = Math.max(0, S.pop - 1); setTimeout(() => fx(g.x, g.y - 22, "人気-1", "bad"), 400); }
        g.state = "out"; g.wait = 0.8; g.path = [{ x: DOOR.x, y: DOOR.y }];
      }
    }
  });
  guests = guests.filter(g => !(g.state === "out" && !g.path.length));

  if (raider && raider.wp && raider.wp.length) {   // まず入口を通る
    const w = raider.wp[0];
    if (moveTo(raider, w.x, w.y, raider.state === "out" ? 42 : 30, dt)) raider.wp.shift();
    if (raider.state === "out" && !raider.wp.length) raider = null;
  } else if (raider) {
    const arrived = moveTo(raider, raider.tx, raider.ty, raider.state === "out" ? 42 : 30, dt);
    if (arrived && raider.state === "in") raider.state = "raid";
    if (arrived && raider.state === "raid" && Math.random() < dt) { raider.tx = Math.max(30, Math.min(areaMaxX(), raider.x + rand(-20, 20))); raider.ty = Math.max(40, Math.min(areaMaxY(), raider.y + rand(-12, 12))); }
    if (arrived && raider.state === "out") raider = null;
  }
  const chasing = raider && raider.state !== "out" && raider.y < shopBottom() ? chasers() : [];   // お店の中に入ってから追いかける
  const maxY = areaMaxY(), maxX = areaMaxX();
  dutyCats().forEach((c, i) => {
    if (c.x === undefined) { c.x = rand(30, maxX); c.y = rand(44, maxY); }
    let t;
    if (c.sleeping) t = { x: BEDS[i][0], y: BEDS[i][1] + 1 };
    else if (chasing.includes(c)) t = { x: raider.x + (c.x < raider.x ? -6 : 6), y: raider.y };
    else if (c.play) t = { x: c.play.mx + c.play.side * 5, y: c.play.my };
    else if (c.fplay) t = furnSpot(c.fplay.id);
    else if (c.eat) t = bowlOf(c);
    else {
      const g = guests.find(x => x.id === c.target && x.state === "seated");
      if (g) t = servePos(g.seat);
      else {
        if (!c.wander || performance.now() > c.wanderUntil) { c.wander = { x: rand(24, maxX), y: rand(44, maxY) }; c.wanderUntil = performance.now() + rand(2000, 5000); }
        t = c.wander;
      }
    }
    const px = c.x;
    c.moving = !moveTo(c, t.x, t.y, (c.sleeping ? CONFIG.catSleepySpeed : (chasing.includes(c) ? CONFIG.catChaseSpeed : CONFIG.catWalkSpeed) + eff("catSpeed") * 0.4 + (c.skills.includes("fast") ? 10 : 0)), dt);
    if (Math.abs(c.x - px) > 0.05) c.dir = c.x < px ? -1 : 1;
  });

    p.y += p.v * dt; p.x += Math.sin(performance.now() / 600 + p.p) * 6 * dt;
    if (p.y > H) { p.y = -2; p.x = Math.random() * W; }

}

function hints() {
  const nowNo = (S.today.noCat || 0) >= 3 && (S.today.noCat || 0) / Math.max(1, S.today.visitors) >= 0.2 ? S.today.noCat : 0;   // 2割以上が猫に会えないときだけ
  const out = [], noCat = Math.max(nowNo, S.lastNoCat || 0), free = catCap() - dutyCats().length, home = S.cats.filter(c => !c.duty);
  if (noCat >= 2) {
    const head = `😿 猫不足（会えずに帰った${noCat}人）→ `;
    if (free > 0 && home.length) out.push({ go: "cats", text: head + `おうちの猫を出勤（あと${free}匹）` });
    else if (free > 0) out.push({ go: "shop:cat", text: head + `新しい猫を迎える` });
    else out.push({ go: "shop:place", text: head + "増築する（出勤枠がいっぱい）" });
  }
  const stuck = S.known.filter(id => { const v = typeSat(id); return v >= CONFIG.fanSatNeed - 1 && v < CONFIG.fanSatNeed && !typeData(id).likes.some(m => S.menus[m] && S.menus[m].on); });
  if (stuck.length) {

    out.push({ go: "menu", text: `🍰 ${t.name}の満足度が${CONFIG.fanSatNeed - 1}%止まり → ${have.length ? `好物（${have.map(m => menuData(m).name).join("・")}）を出す` : "好物を開発"}${stuck.length > 1 ? `（ほか${stuck.length - 1}種類）` : ""}` });

function selectedEntity() {
  if (!selected) return null;
  if (selected.kind === "furn") return S.items.includes(selected.id) ? { id: selected.id } : null;
  if (selected.kind === "table") return tableUsed(selected.id) ? { id: selected.id } : null;
  if (selected.kind === "hcat") return homeCats().find(c => c.id === selected.id) || null;
  return selected.kind === "cat" ? dutyCats().find(c => c.id === selected.id) : guests.find(g => g.id === selected.id);
}
function canvasPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H, scale: r.width / W };
}
// 指でも押しやすいように、一番近い猫・お客さんを選ぶ
function hitTest(p) {
  const reach = Math.max(7, 22 / p.scale);
  let best = null, bestD = reach;
  dutyCats().forEach(c => {
    if (c.x === undefined) return;
    const d = Math.hypot(p.x - c.x, p.y - (c.y - 4));
    if (d < bestD) { bestD = d; best = { kind: "cat", id: c.id }; }
  });
  guests.forEach(g => {
    const d = Math.hypot(p.x - g.x, p.y - (g.y - 5));
    if (d < bestD) { bestD = d; best = { kind: "guest", id: g.id }; }
  });
  return best || furnAt(p) || (t => t >= 0 ? { kind: "table", id: t } : null)(tableAt(p));
}
// その場所にある家具（上に描かれているものから）
function furnAt(p) {
  const id = Object.keys(FURN).filter(id => S.items.includes(id)).reverse().find(id => { const [x, y] = furnPos(id), f = FURN[id]; return p.x >= x - 1 && p.x <= x + f.w + 1 && p.y >= y - 1 && p.y <= y + f.h + 1; });
  return id ? { kind: "furn", id } : null;
}

    <div class="swapbox" data-zone="home"><b class="swaplb">🏡 おうち</b>${S.cats.filter(c => !c.duty).map(card).join("") || `<span class="note">いません</span>`}</div>
  </div>`;

let swapDrag = null;
// 落とした場所で、出勤・おやすみ・交代
function dropSwap(id, zone, targetId) {
  const c = S.cats.find(x => x.id === id), t = targetId && targetId !== id ? S.cats.find(x => x.id === targetId) : null;
  if (!c) return;
  if (t && t.duty !== c.duty) { act("duty", (c.duty ? c : t).id); act("duty", (c.duty ? t : c).id); addLog(`${nameOf(c.id)}と${nameOf(t.id)}が交代した。`); return; }   // 交代（先にお店の猫を帰す）
  if (zone === "home" && c.duty) act("duty", id);
  else if (zone === "shop" && !c.duty) {
    if (dutyCats().length < catCap()) act("duty", id);
    else addLog(`お店がいっぱい（${catCap()}匹まで）。お店の猫の上に落とすと交代できます。`);
  }
}
$("panel").addEventListener("pointerdown", e => {
  const el = e.target.closest("[data-swap]");
  if (!el) return;
  e.preventDefault();
  const ghost = el.cloneNode(true); ghost.classList.add("ghost"); document.body.appendChild(ghost);
  swapDrag = { id: el.dataset.swap, el, ghost };
  el.style.opacity = ".3"; moveSwap(e);
});
function moveSwap(e) {
  const g = swapDrag.ghost; g.style.left = (e.clientX - g.offsetWidth / 2) + "px"; g.style.top = (e.clientY - g.offsetHeight / 2) + "px";
  const hit = document.elementFromPoint(e.clientX, e.clientY), z = hit && hit.closest(".swapbox");
  document.querySelectorAll(".swapbox").forEach(x => x.classList.toggle("over", x === z));
}
window.addEventListener("pointermove", e => { if (swapDrag) { e.preventDefault(); moveSwap(e); } });
window.addEventListener("pointerup", e => {
  if (!swapDrag) return;
  const d = swapDrag; swapDrag = null; d.ghost.remove(); d.el.style.opacity = "";
  const hit = document.elementFromPoint(e.clientX, e.clientY), zone = hit && hit.closest(".swapbox"), on = hit && hit.closest("[data-swap]");
  if (zone) dropSwap(d.id, zone.dataset.zone, on && on.dataset.swap);
  save(); renderAll(); renderPanel(true);
});
window.addEventListener("pointercancel", () => { if (swapDrag) { swapDrag.ghost.remove(); swapDrag.el.style.opacity = ""; swapDrag = null; renderPanel(true); } });
