// 1行のボタン（一覧の1項目。押すとその項目だけのページへ）
const row1 = (kind, id, main, sub = "", style = "") => `<button class="row row1" data-kind="${kind}" data-id="${id}" style="${style}"><span class="t">${main} <span class="s">${sub}</span></span><span class="go">▶</span></button>`;
// 🛡️ パトロール：まず場所の一覧 → 場所を押すと、その場所だけのページ（説明と出動）
let townSel = null;   // 開いている場所（null なら一覧）
const areaStatus = a => { const v = S.town[a.id] ?? 0; return `<span class="${v >= 60 ? "" : "minus"}" style="font-size:12px;white-space:nowrap">🛡️${v}%</span>`; };
function panelTown() {
  const ready = readyCats(), done = !ready.length;
  const all = [...AREAS, ...(S.areas.includes("park") ? SEASON_AREAS : []), ...(finalOpen() ? [FINAL_AREA] : [])];
  const sel = townSel && all.find(a => a.id === townSel && (a.final || a.season ? true : S.areas.includes(a.id)) && (!a.season || seasonOpen(a)));
  if (!sel) { townSel = null; return townList(ready, done); }
  return townPage(sel, ready, done);
}
// 場所の一覧（名前・安全度・もらえる素材だけ）
function townList(ready, done) {
  const btn = (a, label, extra = "", style = "") => row1("townSel", a.id, `<b>${label}</b> ${extra}`, matIcons(a, Math.min(S.townLv[a.id] || 1, areaSel[a.id] || S.townLv[a.id] || 1)), style);
  return `<div class="grp"><h3>🛡️ パトロール（安全度${townAvg()}%・出動できる猫${ready.length}匹）</h3>
    <div class="row"><div class="nm">🚶 見回り<small>戦わずに安全度だけ上げる（強い猫ほど多い）</small></div>
      ${B("quickAll", "", "おまかせで見回り", 0, done || !S.areas.some(x => quickLv(x) >= 1 && (S.town[x] ?? 0) < 100))}</div>
    ${AREAS.map(a => {
      if (!S.areas.includes(a.id)) {
        const prev = AREAS[AREAS.indexOf(a) - 1];
        return `<div class="row locked"><div class="nm">？？？<small>${S.areas.includes(prev.id) ? `${prev.name}をLv${CONFIG.areaUnlockLv}にする（いまLv${S.townLv[prev.id] || 1}）${areaExpandNeed(a) > 1 ? `＋${areaExpandNeed(a)}段階目まで増築する（いま${S.expand}段階目）` : ""}と解放` : "まだ手がかりがない"}</small></div></div>`;
      }
      return btn(a, `${a.name} <span style="font-size:12px;font-weight:normal">Lv${S.townLv[a.id] || 1}</span>`, areaStatus(a));
    }).join("")}
    ${S.areas.includes("park") ? SEASON_AREAS.map(a => seasonOpen(a) ? btn(a, `🗓️ ${a.name}`, `<span style="font-size:11px">（${a.months}だけ）</span>`, "border:2px solid #e0782a")
      : `<div class="row locked"><div class="nm">🗓️ ${a.name}<small>${a.months}だけパトロールできます</small></div></div>`).join("") : `<div class="row locked"><div class="nm">🗓️ 季節のステージ<small>公園が解放されると現れる</small></div></div>`}
    ${finalOpen() ? btn(FINAL_AREA, `🏰 ${FINAL_AREA.name}${(S.goals || {}).boss ? "（討伐ずみ）" : ""}`, "", "border:2px solid #7a2fa0")
      : `<div class="row locked"><div class="nm">🏰 ？？？<small>${S.areas.includes("shrine") ? `神社を育てると、なにかが見つかるかも…` : "街の奥に、何かがひそんでいるらしい…"}</small></div></div>`}
    <div class="row"><div class="nm">🪵 素材<small>${Object.entries(MATERIALS).filter(([k]) => matSeen(k)).map(([k, n]) => `${MAT_ICON[k] || ""}${n}${S.mats[k] || 0}`).join("　")}</small></div></div>
  </div>`;
}
// 場所のページ（説明とボタン。ほかの場所は出さない）
function townPage(a, ready, done) {
  const v = S.town[a.id] ?? 0, maxLv = S.townLv[a.id] || 1, lv = Math.min(maxLv, areaSel[a.id] || maxLv);
  const line = t => `<div class="row"><div class="nm wrap" style="font-size:12px">${t}</div></div>`;
  const lvSel = `<select data-alv="${a.id}" aria-label="${a.name}のレベル" style="flex:none">${Array.from({ length: maxLv }, (_, i) => i + 1).map(n => `<option value="${n}" ${n === lv ? "selected" : ""}>Lv${n}${!a.season && !a.final && n === maxLv && maxLv < MAX_AREA_LV ? "（挑戦中）" : ""}</option>`).join("")}</select>`;
  let body;
  if (a.final) {
    body = `<div class="line" style="flex-wrap:wrap;gap:4px">${B("patrol", a.id, done ? "出動できる猫がいない" : (S.goals || {}).boss ? "もう一度挑む" : "ラスボスに挑む", 0, done)}</div>
      ${line("👑 ラスボス「ネズミ大王」とその手下が攻めてきます。敵の体力は神社よりずっと多め。ボスにおうちを突破されると負けです。")}
      ${line(`敵：${enemyNames(a, 1)}`)}${line(`初めて倒すと：賞金${yen(FINAL_PRIZE.money)}・人気+${FINAL_PRIZE.pop}・限界突破の鈴`)}${line(`素材：${matIcons(a, 1)}`)}`;
  } else if (a.season) {
    body = `<div class="line" style="flex-wrap:wrap;gap:4px">${lvSel}${B("patrol", a.id, done ? "出動できる猫がいない" : "パトロール", 0, done)}</div>
      ${line(`🗓️ ${a.months}だけパトロールできる季節のステージ`)}${line(`敵：${enemyNames(a, lv)}`)}${line(`素材：${matIcons(a, lv)}`)}
      ${line(`ここだけのレア猫が、まれに見つかります（${CATS.filter(d => d.unlock && d.unlock.area === a.id).map(d => S.unlockedCats.includes(d.id) ? d.name : "？？？").join("・")}）`)}`;
  } else {
    const ts = GUEST_TYPES.filter(t => t.home === a.id);
    body = `<div class="line" style="flex-wrap:wrap;gap:4px">${lvSel}${B("patrol", a.id, done ? "出動できる猫がいない" : "パトロール", 0, done)}
        ${quickLv(a.id) >= 1 ? `<button class="btn ${quickOpen === a.id ? "off" : ""}" data-kind="quickOpen" data-id="${a.id}" ${done || v >= 100 ? "disabled" : ""}>${quickOpen === a.id ? "見回りをやめる" : "🚶 見回り"}</button>` : ""}</div>
      ${quickOpen === a.id && !done ? `<div class="note" style="display:block">🚶 見回りに行く猫を選んでね（強い順・強いほど安全度が上がる）</div>
        ${ready.slice().sort((x, y) => battlePower(y) - battlePower(x)).map(c => `<div class="row"><div class="nm">${c.duty ? "☕" : "🏡"} ${rankBadge(c.id)}${nameOf(c.id)}　⚔️${battlePower(c)}<small>${c.duty ? "<b>お店に出勤中</b>（行くとお店の元気が2減る）" : "おうちで休み中"}・元気${c.energy}/${catMax(c)}</small></div>
          <button class="btn" data-kind="quick" data-id="${a.id}:${c.id}">安全度 +${quickGain(a.id, c)}%<br><small>${v}% → ${Math.min(100, v + quickGain(a.id, c))}%・${yen(quickMoney(a.id))}・経験+${quickXp(a.id)}</small></button></div>`).join("")}` : ""}
      <div class="bar ${v >= 60 ? "safe" : v >= 35 ? "warn" : "danger"}"><i style="width:${v}%"></i></div>
      ${line(`来店 ×${safetyFactorOf(a.id).toFixed(2)}`)}
      ${line(`🛡️ 勝つと安全度 <b>+${safetyGain(lv)}</b>（${v}%→${Math.min(100, v + safetyGain(lv))}%）`)}
      ${line(`敵：${enemyNames(a, lv)}`)}
      ${line(`素材：${matIcons(a, lv)}`)}
      ${ts.length ? line(`住んでいるお客さん：${ts.map(t => S.known.includes(t.id) ? t.name : "？？？").join("・")}`) : ""}
      ${line(maxLv < patrolCap() ? `Lv${maxLv}で勝つとLv${maxLv + 1}に挑戦できる` : maxLv < MAX_AREA_LV ? `🏠 増築すると、もっと上のレベルに挑戦できる（いまはLv${patrolCap()}まで）` : "最高レベルまで来ました！")}`;
  }
  return `<button class="btn off" data-kind="townBack" data-id="" style="align-self:flex-start">◀ 場所の一覧</button>
  <div class="grp showx"><h3>${a.final ? "🏰 " : a.season ? "🗓️ " : ""}${a.name}${a.final || a.season ? "" : ` Lv${maxLv} ${areaStatus(a)}`}</h3>
    <div class="note" style="display:block">出動できる猫 ${ready.length}匹（1匹につき週1回）${helpLink("パトロールと街")}</div>
    ${body}
  </div>`;
}

function fitPage(box, key, shrink = 0) {
  box.querySelectorAll("[data-pg]").forEach(el => { el.style.display = ""; delete el.dataset.pg; });
  box.querySelector(":scope > .pager")?.remove();
  box.classList.remove("cols2", "cols3");
  if (box.hidden || box.scrollHeight <= box.clientHeight + 1) return;
  const shown = [...box.children].filter(el => el.style.display !== "none" && el.id !== "pageBack" && !el.classList.contains("mats"));
  if (box.id === "panel" && !subSel[tab] && !rowDetail && shown.some(el => el.classList.contains("closed"))) {   // 見出しの一覧
    box.classList.add("cols2");
    if (box.scrollHeight > box.clientHeight + 1) { box.classList.remove("cols2"); box.classList.add("cols3"); }
    return;
  }
  // ページに分ける単位：大きな入れ物（表・箇条書き・見出しのまとまり・大きな箱）は中身ごとに分ける
  const big = box.clientHeight * 0.5, units = [], add = el => {
    const atomic = el.matches(".row,.catcard,.swapbox,tr,li,button,canvas,select,.rowdetail") || (el.children.length < 2 && !el.matches("table,tbody,ul,ol")) || el.querySelector(":scope > .swapbox");
    if (!atomic && (el.matches("ul,ol,table,tbody,thead,.grp") || el.offsetHeight > big))
      [...el.children].forEach(c => { if (c.tagName !== "H3" && getComputedStyle(c).display !== "none") add(c); });
    else units.push(el);
  };
  shown.forEach(add);
  if (units.length < 2) return;
  const bt = box.getBoundingClientRect().top - box.scrollTop;
  const pos = units.map(u => { const r = u.getBoundingClientRect(); return [r.top - bt, r.bottom - bt]; });
  const cap = box.clientHeight - pos[0][0] - (box.scrollHeight - pos[pos.length - 1][1]) - 30 - shrink;
  const pages = [];
  for (let i = 0; i < units.length;) {
    let j = i + 1;
    while (j < units.length && pos[j][1] - pos[i][0] <= cap) j++;
    pages.push([i, j]); i = j;
  }
  if (pages.length < 2) return;
  const p = Math.min(pages.length - 1, pageOf[key] || 0);
  units.forEach((u, k) => { if (k < pages[p][0] || k >= pages[p][1]) { u.style.display = "none"; u.dataset.pg = "1"; } });
  const pg = document.createElement("div"); pg.className = "pager";
  pg.innerHTML = `<button class="btn off" data-pg-go="-1" ${p ? "" : "disabled"}>◀</button><span>${p + 1}/${pages.length}</span><button class="btn off" data-pg-go="1" ${p < pages.length - 1 ? "" : "disabled"}>▶</button>`;
  pg.onclick = e => { const b = e.target.closest("[data-pg-go]"); if (!b || b.disabled) return; pageOf[key] = p + +b.dataset.pgGo; fitPage(box, key); };
  box.append(pg);
  const over = box.scrollHeight - box.clientHeight;   // まだはみ出すなら、1ページを少し短くしてやり直す
  if (over > 1 && shrink < 200) fitPage(box, key, shrink + over + 2);
}

function queueModal(title, html) {
  modalQueue.push({ title, html });

}
function nextModal() {
  const m = modalQueue.shift();
  if (!m) { $("modal").hidden = true; renderAll(); return; }
  $("modalTitle").textContent = m.title;
  $("modalBody").innerHTML = m.html + `<button class="btn big" id="ok">${modalQueue.length ? "次へ" : "OK"}</button>`;
  $("modal").hidden = false;
  $("ok").onclick = () => { checkClear(); nextModal(); save(); };

const PATHS = Object.fromEntries(Object.entries(COURSES).map(([k, v]) => [k, v[0]]));   // 昔の名前（Lv1のコース）
let ROUTES = PATHS.shotengai;   // いま戦っている地区の道（1本か2本）
let BPATH = ROUTES[0];
const housePos = () => BPATH[BPATH.length - 1];
const allSegs = () => ROUTES.flatMap(r => r.slice(1).map((pt, k) => [r[k], pt]));
let BT = null;   // 戦闘中の状態

// 点と線の距離（道の上に猫を置けないようにするため）
function segDist(px, py, [x1, y1], [x2, y2]) {
  const dx = x2 - x1, dy = y2 - y1, l = dx * dx + dy * dy;
  const t = l ? Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / l)) : 0;
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}
// 🪨 置き台：猫はここにしか置けない。道にそって、入口の近くからおうちの近くまで交互に並べる
let BSLOTS = [];
function makeSlots() {
  const out = [], segs = allSegs(), [hx, hy] = housePos();
  const ok = (x, y) => x >= 8 && x <= BW - 8 && y >= 16 && y <= BH - 3
    && !(Math.abs(x - hx) < 15 && y > hy - 24 && y < hy + 16)
    && !segs.some(([a, b]) => segDist(x, y - 4, a, b) < 13)
    && !out.some(p => Math.hypot(p.x - x, p.y - y) < CONFIG.slotGap);
  ROUTES.forEach(route => {
    let side = 1;
    for (let i = 1; i < route.length; i++) {
      const [x1, y1] = route[i - 1], [x2, y2] = route[i], d = Math.hypot(x2 - x1, y2 - y1), dx = (x2 - x1) / d, dy = (y2 - y1) / d;
      for (let k = CONFIG.slotStep / 2; k < d; k += CONFIG.slotStep) {
        const px = x1 + dx * k, py = y1 + dy * k;
        if (px < 0 || px > BW || py < 0 || py > BH) continue;
        let done = false;
        for (const off of [15, 18, 21]) { for (const sd of [side, -side]) {
          const x = Math.round(px - dy * off * sd), y = Math.round(py + dx * off * sd + 4);
          if (ok(x, y)) { out.push({ x, y }); side = -sd; done = true; break; }
        } if (done) break; }
      }
    }
  });
  return out;
}
const slotAt = (x, y, r = 10) => BSLOTS.filter(p => Math.hypot(p.x - x, p.y - y) <= r).sort((a, b) => Math.hypot(a.x - x, a.y - y) - Math.hypot(b.x - x, b.y - y))[0];
const catOnSlot = p => BT.placed.find(q => q.x === p.x && q.y === p.y);
// 🐟 にぼし：猫を置く・強化するのに使う
const nibosiStart = (a, lv) => CONFIG.nibosiStart + CONFIG.nibosiStartLv * (lv - 1) + CONFIG.nibosiStartArea * (a.level - 1);
const bCatCost = id => CONFIG.bCatCost[rankOf(id)] || 50;
const bUpCost = q => Math.round(bCatCost(q.id) * (q.up ? 1.2 : 0.8) / 5) * 5;
// パトロール中の強さ（強化した分を足す）
function qStats(q) {
  const st = battleStats(S.cats.find(x => x.id === q.id)), up = q.up || 0;
  return { ...st, atk: Math.round(st.atk * (1 + CONFIG.bUpAtk * up)), range: st.range + CONFIG.bUpRange * up };
}

// 戦闘力（1秒あたりのダメージのめやす）
const battlePower = c => { const st = battleStats(c); return Math.round(st.atk * st.mult / st.cd); };
function atkParts(c) {
  const G = c.gear ? gearData(c.gear) : {};
  const K = (c.bskills || []).reduce((s, id) => s + (bskillData(id).atk || 0), 0);
  return [["猫の基本", baseAtk(c.id)], ["戦闘Lv", Math.round((c.bLv || 1) * 2.5)], ["レア猫ボーナス", catData(c.id).atk || 0], ["戦闘用装備", G.atk || 0], ["戦闘特技", K]].filter(p => p[1]);
}
// 戦闘の経験（パトロールと荒らし退治でだけ増える）
const bxpNeed = c => (c.bLv || 1) * 20;
function gainBxp(c, n, x, y, inBattle) {
  c.bLv = c.bLv || 1; c.bxp = (c.bxp || 0) + n;
  if (c.bLv >= maxBLv(c)) { c.bxp = 0; return; }   // MAXならもう上がらない
  while (c.bxp >= bxpNeed(c) && c.bLv < maxBLv(c)) {
    c.bxp -= bxpNeed(c); c.bLv++;
    addLog(`${nameOf(c.id)}の戦闘Lvが${c.bLv}に上がった！`);
    if (inBattle && x !== undefined) bfx(x, y, "戦闘Lv UP!", "crit"); else fx(c.x, c.y - 12, "戦闘Lv UP!", "lv");
  }
}

      ${(c.bskills || []).length ? `<tr><td>　戦闘スキル</td><td>${c.bskills.map(id => bskillData(id).name).join("・")}</td></tr>` : ""}
      <tr><td>　✨必殺技</td><td>${specialOf(c.id).name}<br><small>${specialText(specialOf(c.id))}</small></td></tr>
      ${extra.length ? `<tr><td>　とくべつ</td><td>${extra.join("・")}</td></tr>` : ""}

// パトロールでの猫の強さ
function battleStats(c) {

    atk: baseAtk(c.id) + Math.round((c.bLv || 1) * 2.5) + (catData(c.id).atk || 0) + (G.atk || 0) + sk("atk"),
    range: R.range + (G.range || 0) + sk("range"),
    cd: R.cd * Math.max(0.4, 1 - (G.haste || 0) - sk("haste")),
    mult: R.mult,
    slow: Math.max(R.slow || 0, G.slow || 0, sk("slow")),

    def: Math.min(0.9, (G.def || 0) + sk("def")),
  };
}

  H0(3, 37, 5, 5, "#ffe08a"); H0(5, 37, 1, 5, "#c9a77f"); H0(3, 39, 5, 1, "#c9a77f");
  H0(10, 39, 5, 11, "#8a5a3a"); H0(13, 44, 1, 1, "#f2c230");
  BSLOTS.forEach(({ x, y }) => {   // 置き台（まるい石の台）
    R(x - 6, y - 1, 13, 4, "rgba(0,0,0,.18)"); R(x - 5, y - 2, 11, 4, "#8f8678"); R(x - 6, y - 1, 13, 2, "#8f8678");
    R(x - 5, y - 2, 11, 2, "#d9cfb8"); R(x - 6, y - 1, 13, 1, "#d9cfb8"); R(x - 3, y - 2, 4, 1, "#f2ead8");
  });
  const vg = g.createRadialGradient(BW / 2, BH / 2, BH * 0.45, BW / 2, BH / 2, BW * 0.65);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, id === "maou" ? "rgba(20,0,30,.35)" : "rgba(30,30,50,.18)");
  g.fillStyle = vg; g.fillRect(0, 0, BW, BH);
  return cv2;
}

function bfx(x, y, text, cls) {

function banner(text) {

function burst(x, y, cols, n, speed) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = speed * (0.4 + Math.random() * 0.8);
    BT.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - speed * 0.5, life: 0.4 + Math.random() * 0.4, col: pick(cols) });
  }
}

function openBattle(areaId, lv) {
  const a = areaData(areaId);
  const hpMult = (1 + CONFIG.enemyHpArea * (a.level - 1) + CONFIG.enemyHpLv * (lv - 1)) * (a.hpBoost || 1) * loopMul(CONFIG.ngEnemy) * CONFIG.enemyHpMul;
  const pool = poolFor(a, lv), boss = bossFor(a, lv);
  // 敵の出てくる順番を作る（3つの波）
  const queue = []; let t = 1;
  for (let w = 0; w < 3; w++) {
    const n = 3 + a.level + w * 2 + Math.floor(lv / 3);
    for (let i = 0; i < n; i++) { queue.push({ t, type: pick(pool), wave: w + 1 }); t += Math.max(0.7, 1.1 - lv * 0.03); }
    if (w === 2 && boss) { queue.push({ t: t + 1, type: boss, wave: 3, boss: true }); t += 1; }
    t += 4;
  }
  BT = { area: a, lv, hpMult, queue, total: queue.length, enemies: [], fxs: [], parts: [], placed: [],
         selCat: (readyCats().find(c => c.id === patrolPick) || {}).id || null,   // 最初は何も持っていない（猫の画面から来たときだけ、その猫を持つ）
         hover: null, msg: "", t: 0, time: 0, running: false, speed: 1,   // いつもふつうの速さで始める
         house: CONFIG.houseHp, kills: 0, over: false, retreatArmed: false, cd: {}, shake: 0, flash: 0, wave: 0, nibosi: nibosiStart(a, lv), used: {},
         bg: makeBattleBG(a, lv) };
  $("bTitle").textContent = `🛡️ ${a.name}のパトロール（Lv${lv}）`;
  $("bResult").innerHTML = ""; $("bfx").innerHTML = "";
  // 前回の配置を思い出す（この地区の前回 → なければ最後のパトロール）
  const memo = (S.lastPlace || {})[areaId] || (S.lastPlace || {})._last || [];
  const ready = readyCats().map(c => c.id);
  memo.forEach(m => {   // 同じ置き台に、にぼしが足りるぶんだけ
    const p = slotAt(m.x, m.y, 2);
    if (!p || !ready.includes(m.id) || BT.placed.some(q => q.id === m.id) || catOnSlot(p) || BT.nibosi < bCatCost(m.id)) return;
    putCat(m.id, p);
  });
  patrolPick = null;
  if (BT.placed.length) {
    BT.msg = "前回の配置を思い出しました。そのまま開始するか、動かして調整してね。";
    BT.selCat = null;
  }
  $("battle").hidden = false;
  requestAnimationFrame(fitBattle);
  renderBattleUI();
  banner(`${a.name}をパトロール！`);
}

// ボタンにカーソルを合わせる（指で触る）と、どの猫が使うのか地図で光る

function useSpecial(id) {
  const q = BT && BT.placed.find(x => x.id === id), c = S.cats.find(x => x.id === id);
  if (!q || !c || BT.over || !BT.running) return;
  const sp = specialOf(id);
  if ((q.sp || 0) < sp.charge) return;
  q.sp = 0; q.stun = 0;
  const st = qStats(q);
  banner(`${nameOf(id)}の「${sp.name}」！`);
  BT.flash2 = 0.35; BT.flashCol = catData(id).colors.a;
  burst(q.x, q.y - 6, ["#ffd54a", "#ff7aa2", "#ffffff", catData(id).colors.c], 24, 70);
  sp.fx.forEach(([k, a, b]) => {
    if (k === "nuke") {
      const targets = BT.enemies.filter(en => !a || Math.hypot(en.x - q.x, en.y - q.y) <= a);
      const dmg = Math.round(st.atk * b);
      targets.forEach(en => { en.hp -= dmg; en.flash = 0.2; en.lastHit = id; bfx(en.x, en.y - 10, String(dmg), "crit"); });
      BT.fxs.push({ kind: "ring", x2: q.x, y2: q.y - 4, life: 0.5, max: 0.5, splash: a || 140 });
      BT.shake = 0.35;
    } else if (k === "pierce") {
      const t = [...BT.enemies].sort((x, y) => y.dist - x.dist)[0];
      if (t) { const dmg = Math.round(st.atk * a); t.hp -= dmg; t.flash = 0.3; t.lastHit = id; bfx(t.x, t.y - 12, `${dmg}!!`, "crit");
        BT.fxs.push({ kind: "beam", x1: q.x, y1: q.y - 5, x2: t.x, y2: t.y - 3, life: 0.4, max: 0.4 }); BT.shake = 0.25; }
    } else if (k === "heal") {
      BT.house = Math.min(CONFIG.houseHp, BT.house + a); bfx(housePos()[0] - 2, housePos()[1] - 14, `+${a}`, "heart"); burst(housePos()[0] - 2, housePos()[1], ["#5cc27a", "#ffffff"], 14, 40);
    } else if (k === "rapid") { q.rapid = a; q.rapidF = b; BT.cd[id] = 0;
    } else if (k === "buff") { BT.buff = a; BT.buffMult = b; BT.placed.forEach(p => burst(p.x, p.y - 6, ["#ff7aa2", "#ffd54a"], 5, 30));
    } else if (k === "slow") { BT.enemies.forEach(en => en.slow = Math.max(en.slow, a)); BT.tint = { col: "rgba(120,180,255,.18)", t: 0.6 };
    } else if (k === "stun") { BT.enemies.forEach(en => en.stun = Math.max(en.stun || 0, a)); BT.tint = { col: "rgba(255,255,200,.22)", t: 0.5 };
    } else if (k === "gold") { BT.gold = a; BT.tint = { col: "rgba(255,213,74,.2)", t: 0.6 }; }
  });
  addLog(`${nameOf(id)}の必殺技「${sp.name}」！`);
  renderSpecials();
}

const BATTLE_GROUND = { shotengai: "#c9c1b3", park: "#7cb87a", jutaku: "#86bf7f", port: "#c9a77f", shrine: "#d8d2c4", maou: "#5a4f66", s_spring: "#9fd08a", s_summer: "#e8d8a8", s_autumn: "#c9a86a", s_winter: "#eef3f8" };
function fitBattle() {
  if ($("battle").hidden) return;
  const box = $("bbox").getBoundingClientRect();
  if (!box.width || !box.height) return;
  const k = Math.min(box.width / BW, box.height / BH);
  $("bstage").style.width = Math.floor(BW * k) + "px";
  $("bstage").style.height = Math.floor(BH * k) + "px";
  if (BT) $("bbox").style.background = BATTLE_GROUND[BT.area.id] || "#5d6b4f";
}
window.addEventListener("resize", fitBattle);
if (window.ResizeObserver) new ResizeObserver(fitBattle).observe($("bbox"));
function bpos(e) {
  const r = bcv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * BW, y: (e.clientY - r.top) / r.height * BH, scale: r.width / BW };
}
// 置いた猫：タップで選ぶ → 別の場所をタップで置き直し。そのままドラッグして動かすこともできる
const catAtB = p => BT.placed.filter(q => Math.hypot(q.x - p.x, q.y - 4 - p.y) < Math.max(8, 22 / p.scale)).sort((a, b) => Math.hypot(a.x - p.x, a.y - 4 - p.y) - Math.hypot(b.x - p.x, b.y - 4 - p.y))[0];
let bDrag = null, bEat = false;
bcv.addEventListener("pointerdown", e => {
  if (!BT || BT.over) return;
  const hit = catAtB(bpos(e));
  if (hit) bDrag = { id: hit.id, x: e.clientX, y: e.clientY, moved: false };
});
bcv.addEventListener("pointermove", e => {
  if (!bDrag || !BT) return;
  if (!bDrag.moved && Math.hypot(e.clientX - bDrag.x, e.clientY - bDrag.y) > 8) { bDrag.moved = true; BT.selCat = bDrag.id; BT.msg = ""; renderBattleUI(); }
  if (bDrag.moved) { e.preventDefault(); const p = bpos(e); BT.hover = { x: Math.round(p.x), y: Math.round(p.y + 4) }; }
});
window.addEventListener("pointerup", e => {
  if (!bDrag) return;
  const d = bDrag; bDrag = null;
  if (!d.moved || !BT || BT.over) return;
  bEat = true; setTimeout(() => bEat = false, 400);
  const p = bpos(e); BT.hover = null;
  placeBattleCat(Math.round(p.x), Math.round(p.y + 4), Math.max(10, 24 / p.scale));
});
window.addEventListener("pointercancel", () => { bDrag = null; });
bcv.addEventListener("click", e => {
  if (bEat) { bEat = false; return; }
  if (!BT || BT.over) return;
  const p = bpos(e);
  const hit = catAtB(p);
  if (hit && hit.id !== BT.selCat) { BT.selCat = hit.id; BT.msg = ""; renderBattleUI(); return; }
  if (hit) { BT.selCat = null; BT.msg = ""; renderBattleUI(); return; }   // 持っている猫をもう一度タップ：持つのをやめる
  if (!BT.selCat) { BT.msg = "先に下の猫を押して、持ってから置いてね。"; renderBattleUI(); return; }
  placeBattleCat(Math.round(p.x), Math.round(p.y + 4), Math.max(10, 24 / p.scale));
});
// 外したときに戻るにぼし（始める前なら全部、戦っている途中なら半分）
const refundOf = q => { const n = bCatCost(q.id) + (q.spent || 0); return BT.running ? Math.floor(n / 2) : n; };
function putCat(id, p) {
  BT.nibosi -= bCatCost(id); BT.used[id] = true;
  BT.placed.push({ id, x: p.x, y: p.y, stun: 0, lunge: 0, lx: 0, ly: 0, ph: Math.random() * 2, sp: 0, rapid: 0, rapidF: 1, up: 0, spent: 0 });
  BT.cd[id] = 0;
}
function upCat(q) {
  if (!q || (q.up || 0) >= CONFIG.bUpMax || BT.nibosi < bUpCost(q)) return;
  const n = bUpCost(q); BT.nibosi -= n; q.spent = (q.spent || 0) + n; q.up = (q.up || 0) + 1;
  bfx(q.x, q.y - 14, `強化！${"★".repeat(q.up)}`, "crit"); burst(q.x, q.y - 6, ["#ffd54a", "#ffffff"], 10, 35);
  renderBattleUI();
}
function placeBattleCat(x, y, r = 10) {
  const p = slotAt(x, y, r);
  if (!p) { BT.msg = "光っている台の上に置いてね"; renderBattleUI(); return; }
  const cur = BT.placed.find(q => q.id === BT.selCat), other = catOnSlot(p);
  if (other && other === cur) { BT.selCat = null; renderBattleUI(); return; }
  if (other && !cur) { BT.msg = `そこには${nameOf(other.id)}がいます`; renderBattleUI(); return; }
  if (cur) {   // 置き直し（ほかの猫がいたら入れかえ）。戦闘中に動かすと少し休む
    if (other) { other.x = cur.x; other.y = cur.y; if (BT.running) BT.cd[other.id] = 1.5; }
    cur.x = p.x; cur.y = p.y; if (BT.running) BT.cd[cur.id] = 1.5;
  } else {
    if (BT.nibosi < bCatCost(BT.selCat)) { BT.msg = `にぼしが足りません（🐟${bCatCost(BT.selCat)}いる）。敵をたおすと増えます`; renderBattleUI(); return; }
    putCat(BT.selCat, p);
  }
  BT.selCat = null;   // 置いたら手ぶらに戻る
  burst(p.x, p.y - 2, ["#ffffff", "#fff6b0"], 6, 25);
  BT.msg = ""; renderBattleUI();
}
bcv.addEventListener("mousemove", e => { if (BT) { const p = bpos(e); BT.hover = { x: Math.round(p.x), y: Math.round(p.y + 4) }; } });
bcv.addEventListener("mouseleave", () => { if (BT) BT.hover = null; });

// 演出だけは戦闘前や終了後も動かす
function animBattle(dt) {
  BT.time += dt;
  BT.shake = Math.max(0, BT.shake - dt); BT.flash = Math.max(0, BT.flash - dt);
  BT.flash2 = Math.max(0, (BT.flash2 || 0) - dt); if (BT.tint) BT.tint.t -= dt;
  BT.fxs.forEach(f => f.life -= dt); BT.fxs = BT.fxs.filter(f => f.life > 0);
  BT.parts.forEach(q => { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 60 * dt; q.life -= dt; }); BT.parts = BT.parts.filter(q => q.life > 0);
  BT.placed.forEach(q => { q.lunge = Math.max(0, q.lunge - dt); });
  if (BT.running && !BT.over) {
    BT.placed.forEach(q => { q.sp = Math.min(specialOf(q.id).charge, (q.sp || 0) + dt); q.rapid = Math.max(0, (q.rapid || 0) - dt); });
    BT.buff = Math.max(0, (BT.buff || 0) - dt); BT.gold = Math.max(0, (BT.gold || 0) - dt);
  }
  BT.enemies.forEach(en => { en.flash = Math.max(0, (en.flash || 0) - dt); });
}

function updateBattle(dt) {
  if (BT.over) return;
  BT.t += dt;
  // 敵が出てくる
  while (BT.queue.length && BT.queue[0].t <= BT.t) {
    const q = BT.queue.shift(), E = ENEMIES[q.type];
    if (q.wave !== BT.wave) { BT.wave = q.wave; banner(`第${q.wave}波！`); if (q.wave > 1) { BT.nibosi += CONFIG.nibosiWave; renderBattleUI(); } }
    if (q.boss) { banner(`ボス出現！ ${E.name}`); BT.shake = 0.4; }
    const hp = Math.round(E.hp * BT.hpMult * (q.boss ? CONFIG.bossHp : 1));
    const route = q.boss ? ROUTES[0] : pick(ROUTES);
    BT.enemies.push({ route, type: q.type, hp, max: hp, x: route[0][0], y: route[0][1], seg: 1, dist: 0, slow: 0, acd: 1, boss: !!q.boss, ph: Math.random() * 2 });
  }
  // 敵が進む
  BT.enemies.forEach(en => {
    const E = ENEMIES[en.type];
    en.slow = Math.max(0, en.slow - dt);
    en.stun = Math.max(0, (en.stun || 0) - dt);
    let step = en.stun > 0 ? 0 : E.speed * (en.slow > 0 ? 0.5 : 1) * dt;
    const R0 = en.route || BPATH;
    while (step > 0 && en.seg < R0.length) {
      const [tx, ty] = R0[en.seg], d = Math.hypot(tx - en.x, ty - en.y);
      if (d <= step) { en.x = tx; en.y = ty; step -= d; en.dist += d; en.seg++; }
      else { en.x += (tx - en.x) / d * step; en.y += (ty - en.y) / d * step; en.dist += step; step = 0; }
    }
    if (en.seg >= R0.length) {
      en.reached = true; BT.house -= E.dmg; BT.shake = 0.3; BT.flash = 0.25;
      BT.leaks = (BT.leaks || 0) + 1;
      if (en.boss) BT.bossLeak = true;
      bfx(housePos()[0] - 2, housePos()[1] - 14, en.boss ? "突破された！" : `-${E.dmg}`, "bad"); burst(housePos()[0] - 2, housePos()[1], ["#e0473c", "#f6e7c8"], en.boss ? 20 : 8, 40);
    }
    // 近くの猫をひっかく（防御があると、ひるむ時間が短い）
    en.acd -= dt;
    if (en.acd <= 0) {
      const q = BT.placed.find(q => Math.hypot(q.x - en.x, q.y - 4 - en.y) < 14);
      if (q) {
        const c = S.cats.find(x => x.id === q.id);
        const stun = 1.2 * E.dmg * (1 - (c ? battleStats(c).def : 0));
        q.stun = Math.max(q.stun, stun); en.acd = 1.4;
        bfx(q.x, q.y - 12, "ひるんだ！", "stun"); burst(q.x, q.y - 4, ["#ffffff", "#ffd54a"], 4, 30);
      }
    }
  });
  BT.enemies = BT.enemies.filter(en => !en.reached);
  // 猫が攻撃する
  BT.placed.forEach(q => {
    const c = S.cats.find(x => x.id === q.id); if (!c) return;
    if (q.stun > 0) { q.stun -= dt; return; }
    const st = qStats(q);
    BT.cd[q.id] = (BT.cd[q.id] || 0) - dt;
    if (BT.cd[q.id] > 0) return;
    const inRange = BT.enemies.filter(en => Math.hypot(en.x - q.x, en.y - (q.y - 4)) <= st.range);
    if (!inRange.length) return;
    const target = inRange.sort((a, b) => b.dist - a.dist)[0];
    const crit = Math.random() < st.crit;
    const dmg = Math.max(1, Math.round(st.atk * st.mult * (crit ? 2 : 1) * (BT.buff > 0 ? BT.buffMult : 1)));
    q.sp = Math.min(specialOf(q.id).charge, (q.sp || 0) + 0.5);
    const hit = st.splash ? BT.enemies.filter(en => Math.hypot(en.x - target.x, en.y - target.y) <= st.splash) : [target];
    hit.forEach(en => { en.hp -= dmg; en.flash = 0.12; en.lastHit = q.id; if (st.slow) en.slow = Math.max(en.slow, st.slow); });
    const d = Math.hypot(target.x - q.x, target.y - q.y) || 1;
    q.lunge = 0.12; q.lx = (target.x - q.x) / d * 2; q.ly = (target.y - q.y) / d * 2;
    const kind = (c.bskills || []).includes("shot") ? "shot" : CAT_ROLES[q.id] || "claw";
    BT.fxs.push({ kind, col: catData(q.id).colors.a, x1: q.x, y1: q.y - 5, x2: target.x, y2: target.y - 3, life: kind === "area" ? 0.35 : 0.2, max: kind === "area" ? 0.35 : 0.2, splash: st.splash, crit });
    const h = ENEMIES[target.type].map.length;
    bfx(target.x, target.y - h - 2, crit ? `会心！${dmg}` : String(dmg), crit ? "crit" : "dmg");
    BT.cd[q.id] = st.cd / (q.rapid > 0 ? q.rapidF : 1);
    q.hits = (q.hits || 0) + 1;   // 疲れぐあいの計算用
  });
  // たおした敵
  BT.enemies.filter(en => en.hp <= 0).forEach(en => {
    burst(en.x, en.y - 3, ["#ffffff", "#d8d2c4", "#fff6b0"], en.boss ? 20 : 9, en.boss ? 60 : 40);
    BT.kills++; BT.nibosi += Math.max(2, Math.round((ENEMIES[en.type].xp || 2) * CONFIG.nibosiPerXp)); BT.nibChanged = true;
    if (en.boss) BT.bossKilled = true;
    const killer = S.cats.find(c => c.id === en.lastHit);
    if (killer) {
      killer.kills = (killer.kills || 0) + 1;
      BT.killsBy = { ...(BT.killsBy || {}), [killer.id]: ((BT.killsBy || {})[killer.id] || 0) + 1 };
      killer.yKills = (killer.yKills || 0) + 1;   // 今年の討伐数
      if (BT.gold > 0) { const g = 60 * BT.area.level; S.money += g; BT.goldGot = (BT.goldGot || 0) + g; bfx(en.x, en.y - 10, "+" + yen(g), "money"); }
      const q = BT.placed.find(x => x.id === killer.id);
      gainBxp(killer, ENEMIES[en.type].xp || 2, q && q.x, q && q.y - 14, true);
    }
  });
  BT.enemies = BT.enemies.filter(en => en.hp > 0);
  // 終わり
  if (BT.house <= 0 || BT.bossLeak) return finishBattle(false);
  if (!BT.queue.length && !BT.enemies.length) return finishBattle(true);
  if (BT.nibChanged) { BT.nibChanged = false; renderBattleUI(); }   // にぼしが増えたら、買えるボタンを更新
  else if (Math.floor(BT.t * 4) !== Math.floor((BT.t - dt) * 4)) renderBattleHud();
}

function finishBattle(win, retreat) {
  const a = BT.area, ratio = BT.kills / BT.total;
  BT.over = true; BT.running = false;
  banner(win ? "街を守った！" : retreat ? "撤退…" : BT.bossLeak ? "ボスに突破された！" : "守りきれなかった…");
  if (win) for (let i = 0; i < 4; i++) burst(rand(30, 160), rand(20, 90), ["#ffd54a", "#ff7aa2", "#9fd3ff", "#ffffff"], 10, 70);
  const got = {};
  if (!retreat) Object.entries(dropsFor(a, BT.lv)).forEach(([k, [lo, hi]]) => {
    if (Math.random() > CONFIG.dropChance) return;   // 素材ごとに、手に入らないこともある
    const n = Math.round(rand(lo, hi) * (0.5 + ratio) * (1 + 0.15 * (BT.lv - 1)) * (win ? 1 : 0.5) * CONFIG.dropAmount);
    if (n > 0) {
      if (RARE_MATS[k] && !(k in S.mats)) { addLog(`🔩 新しい素材「${MATERIALS[k]}」を手に入れた！ 作れる装備が増えた（パトロールの「戦闘用装備」・猫の「お店用装備」）`); }
      got[k] = n; S.mats[k] = (S.mats[k] || 0) + n;
    }
  });
  const koban = BT.placed.some(q => S.cats.find(c => c.id === q.id)?.gear === "koban") ? 1.5 : 1;
  const money = retreat ? 0 : Math.round(1500 * a.level * (1 + 0.2 * (BT.lv - 1)) * ratio * (win ? 1 : 0.5) * koban * patrolMoneyMul(Object.keys(BT.used)) / 10) * 10;
  S.money += money;
  // 最後まで来た敵の分だけ、お店に被害が出て安全度が下がる
  const leaks = BT.leaks || 0;
  const lost = !win && !retreat;
  const rmul = BT.lv * (1 + 0.3 * (a.level - 1));   // レベルと地区で修繕費が上がる（商店街Lv1がいちばん安い）
  const repair = Math.round((leaks * 120 * rmul + (lost ? 800 * rmul : 0)) / 100) * 100;
  S.money -= repair; S.today.repair = (S.today.repair || 0) + repair;
  const damage = lost ? damageShop(BT.bossLeak ? 0.8 : 0.5, BT.bossLeak ? 3 : 2) : [];
  if (repair) addLog(`敵がお店まで来てしまった…。修理費${yen(repair)}`);
  damage.forEach(d => addLog(d + "…"));
  const before = S.town[a.id] ?? 0;
  const change = win ? Math.max(5, safetyGain(BT.lv) - leaks * 3) : retreat ? -5 : -15 - leaks * 2;
  const noSafety = a.season || a.final;   // 季節のステージと城には安全度がない
  if (!noSafety) S.town[a.id] = Math.max(0, Math.min(100, before + change));
  // 勝ったら、まれに装備品やレア猫が見つかる
  let gearGot = null, rareCat = null, ingGot = null, newLv = false, bellGot = false, accGot = null;
  if (win) {
    if (a.final && !(S.goals || {}).boss) {
      S.goals = { ...(S.goals || {}), boss: true };
      S.money += FINAL_PRIZE.money; addPop(FINAL_PRIZE.pop);
      addLog(`👑 ネズミ大王を倒した！ 街に平和がもどった！ 賞金${yen(FINAL_PRIZE.money)}・人気+${FINAL_PRIZE.pop}`);
      queueModal("👑 ネズミ大王を倒した！", `<div class="bigemoji">🏰</div><div>街を荒らしていた黒幕「ネズミ大王」をやっつけました！</div><div>賞金${yen(FINAL_PRIZE.money)}・人気+${FINAL_PRIZE.pop}・限界突破の鈴×1</div>`);
      S.limitItems = (S.limitItems || 0) + 1;
    }
    if (!a.final && BT.lv === (S.townLv[a.id] || 1) && BT.lv < patrolCap()) { S.townLv[a.id] = BT.lv + 1; areaSel[a.id] = BT.lv + 1; newLv = true; }
    const chance = 0.12 + 0.03 * (BT.lv - 1);
    const rares = CATS.filter(d => d.unlock && d.unlock.type === "rescue" && d.unlock.area === a.id && !S.unlockedCats.includes(d.id))
      .filter(d => { const r = RESCUE_RATE[rankOf(d.id)] || RESCUE_RATE[4]; return BT.lv >= r.minLv && Math.random() < r.base + r.perLv * (BT.lv - 1); });
    // 限界突破の鈴：高いレベルとボス討伐でだけ、ごくまれに見つかる
    const bellChance = (BT.lv >= 5 ? 0.02 + 0.005 * (BT.lv - 5) : 0.005) + (BT.bossKilled ? 0.03 : 0);
    if (Math.random() < bellChance) { S.limitItems = (S.limitItems || 0) + 1; bellGot = true; addLog("🔔 限界突破の鈴を見つけた！ とても珍しい！"); }
    const ing = INGREDIENTS.find(i => i.patrol === a.id && !S.ingredients.includes(i.id));
    if (ing && Math.random() < 0.3 + 0.05 * (BT.lv - 1)) { S.ingredients.push(ing.id); ingGot = ing; addLog(`珍しい食材「${ing.name}」を見つけた！ 開発に使えるようになった。`); }
    if (rares.length) {
      rareCat = pick(rares); S.unlockedCats.push(rareCat.id);
      addLog(`迷い猫の${rareCat.name}を保護した！`);
    }
  }
  if (win && a.season && !(S.seasonWins || []).includes(a.id)) S.seasonWins = [...(S.seasonWins || []), a.id];
  checkGuestArrivals();
  // 実績用の記録（連続で無傷の勝利・たおした数）
  if (!retreat) {
    addStat("kills", BT.kills); if (BT.bossKilled) addStat("bosses"); if (win) addStat("wins");
    if (win && !leaks) { addStat("streak"); if (statOf("streak") > statOf("bestStreak")) S.stat.bestStreak = statOf("streak"); }
    else S.stat.streak = 0;
  }
  checkAchievements();
  const went = Object.keys(BT.used).map(id => BT.placed.find(q => q.id === id) || { id, hits: 0 });   // 途中で外した猫も出動した
  went.forEach(q => { const c = S.cats.find(x => x.id === q.id); if (c) markPatrol(c); });   // 今週の出動の回数
  // 出動した猫は疲れてお昼寝
  // 出動した猫は、活躍したぶんだけ疲れる（あまり動かなかった猫は、すぐお店で働ける）
  const tired = [];
  went.forEach(q => { const c = S.cats.find(x => x.id === q.id); if (!c) return;
    const k = (BT.killsBy || {})[c.id] || 0, cost = Math.min(catMax(c), Math.round(2 + k * 1.5 + (q.hits || 0) * 0.15));
    c.energy = Math.max(0, Math.min(c.energy, catMax(c)) - cost); c.target = null;
    c.sleeping = c.energy <= Math.floor(catMax(c) * CONFIG.tiredRate);
    tired.push(`${nameOf(c.id)} 元気-${cost}（たおした${k}体）${c.sleeping ? "💤" : "→ まだ働ける"}`);
    c.patrols = (c.patrols || 0) + 1; gainBxp(c, retreat ? 0 : win ? 5 + BT.lv : 2); });
  if (a.final && !win && !retreat) addLog("ネズミ大王は強すぎた…。猫を育てて再挑戦しよう！");
  addLog(`${a.name}のパトロール：${win ? "街を守った！" : retreat ? "撤退した…" : "おうちを守りきれなかった…"}`);
  $("bResult").innerHTML = `<div class="win" style="box-shadow:none"><div class="bd">
    <div style="font-size:18px">${win ? (leaks ? "🙂 なんとか守った" : "🎉 完璧に街を守った！") : retreat ? "🏳️ 撤退した" : BT.bossLeak ? "😿 ボスにおうちを突破された…" : "😿 守りきれなかった…"}</div>
    ${rareCat ? `<div class="row done"><div class="nm">✨ 迷い猫を保護した！<small>${rankBadge(rareCat.id)}${rareCat.name}（${rareCat.desc}）。保護猫センターから迎えられます（人気と素材が必要）。</small></div></div>` : ""}
    ${bellGot ? `<div class="row done"><div class="nm">🔔✨ 限界突破の鈴を見つけた！<small>とても珍しいアイテム。「猫」タブで使うと、その猫のLvの上限が+${LIMIT_STEP}されます。</small></div></div>` : ""}
    ${ingGot ? `<div class="row done"><div class="nm">✨ 珍しい食材を見つけた！<small>${ingGot.emoji} ${ingGot.name}（パトロールでしか手に入らない食材。開発に使えます）</small></div></div>` : ""}
    ${accGot ? `<div class="row done"><div class="nm">🎀 季節限定のお店用装備を見つけた！<small>${accGot.name}（${accGot.desc}）</small></div></div>` : ""}
    ${gearGot ? `<div class="row done"><div class="nm">✨ レア装備を見つけた！<small>${stars(gearGot.rare)} ${gearGot.name}（${gearGot.desc}）</small></div></div>` : ""}
    <table>
      <tr><td>たおした敵</td><td>${BT.kills}/${BT.total}</td></tr>
      <tr><td>🐾 疲れぐあい</td><td style="font-size:12px">${tired.join("<br>")}</td></tr>
      ${leaks ? `<tr><td>おうちまで来た敵</td><td class="minus">${leaks}体${BT.bossLeak ? "（ボスを含む）" : ""}</td></tr>` : ""}
      ${repair ? `<tr><td>お店の修理費</td><td class="minus">-${yen(repair)}</td></tr>` : ""}
      ${damage.length ? `<tr><td>お店の被害</td><td class="minus">${damage.join("・")}</td></tr>` : ""}
      ${noSafety ? "" : `<tr><td>${a.name}の安全度</td><td>${before}% → ${S.town[a.id]}%</td></tr>`}
      <tr><td>お礼のお金</td><td>${yen(money)}</td></tr>
      ${BT.goldGot ? `<tr><td>必殺技で手に入れたお金</td><td>${yen(BT.goldGot)}</td></tr>` : ""}
      <tr><td>手に入れた素材</td><td>${Object.keys(got).length ? matText(got) : "なし"}</td></tr>
      ${newLv ? `<tr><td>新しいレベル</td><td>Lv${S.townLv[a.id]}に挑戦できるようになった！（新しい敵や素材が出ることも）</td></tr>` : ""}
    </table>
    <div class="note">出動した猫たちは疲れてお昼寝しています。</div>
    <button class="btn big" id="bBack">お店に戻る</button></div></div>`;
  renderBattleUI();
  $("bBack").onclick = () => { BT = null; $("battle").hidden = true; save(); renderAll(); };
  save();
}

// 敵にお店まで来られたときの被害（家具を壊す・素材を盗む）
function damageShop(breakChance, stealMax) {
  const res = [];
  const ok = S.items.filter(id => !S.broken.includes(id));
  if (ok.length && Math.random() < breakChance) {
    const id = pick(ok); S.broken.push(id); res.push(`${itemData(id).name}が壊された`);
    (S.today.brokeList = S.today.brokeList || []).push(itemData(id).name);
  }
  const have = Object.keys(S.mats).filter(k => S.mats[k] > 0);
  if (have.length && stealMax) {
    const k = pick(have), n = Math.min(S.mats[k], rand(1, stealMax));
    S.mats[k] -= n; res.push(`${MATERIALS[k]}を${n}個盗まれた`);
    (S.today.stolen = S.today.stolen || []).push(`${MATERIALS[k]}${n}`);
  }
  return res;
}

function brect(x, y, w, h, col) { bctx.fillStyle = col; bctx.fillRect(Math.round(x), Math.round(y), w, h); }
const WHITE_PAL = new Proxy({}, { get: (t, k) => (k === "." || k === " ") ? undefined : "#ffffff" });
function drawBattle() {
  bctx.save();
  if (BT.shake > 0) bctx.translate(rand(-1, 1), rand(-1, 1));
  bctx.drawImage(BT.bg, 0, 0);
  const t = BT.time;
  // 配置中は、置いた猫みんなの射程をうっすら表示
  if (!BT.running && !BT.over) BT.placed.forEach(q => {
    if (q.id === BT.selCat) return;
    bctx.strokeStyle = "rgba(255,255,255,.35)"; bctx.lineWidth = 1;
    bctx.beginPath(); bctx.arc(q.x, q.y - 4, qStats(q).range, 0, Math.PI * 2); bctx.stroke();
  });
  // 猫を持っているときは、置ける台を光らせる
  if (BT.selCat && !BT.over) { const k = 0.45 + 0.35 * Math.sin(t * 6);
    BSLOTS.forEach(p => { if (catOnSlot(p)) return; bctx.strokeStyle = `rgba(255,236,120,${k})`; bctx.lineWidth = 1; bctx.strokeRect(p.x - 6.5, p.y - 3.5, 13, 6); }); }
  // 選んでいる猫の射程
  const sel = BT.placed.find(q => q.id === BT.selCat);
  if (sel && !BT.over) {
    const rg = qStats(sel).range;
    bctx.fillStyle = "rgba(255,255,255,.12)"; bctx.beginPath(); bctx.arc(sel.x, sel.y - 4, rg, 0, Math.PI * 2); bctx.fill();
    bctx.strokeStyle = "rgba(255,255,255,.8)"; bctx.lineWidth = 1; bctx.setLineDash([2, 2]);
    bctx.beginPath(); bctx.arc(sel.x, sel.y - 4, rg, 0, Math.PI * 2); bctx.stroke(); bctx.setLineDash([]);
  }
  // 置く場所の目安（マウスのとき）
  const hp = BT.hover && BT.selCat && !BT.over && slotAt(BT.hover.x, BT.hover.y, 12);   // 近くの台にすいつく
  if (hp) {
    const hq = BT.placed.find(q => q.id === BT.selCat) || { id: BT.selCat, up: 0 }, other = catOnSlot(hp);
    const ok = !other || (BT.placed.includes(hq) && other !== hq), rg = qStats(hq).range;
    bctx.fillStyle = ok ? "rgba(120,255,140,.12)" : "rgba(255,90,80,.10)"; bctx.beginPath(); bctx.arc(hp.x, hp.y - 4, rg, 0, Math.PI * 2); bctx.fill();
    bctx.strokeStyle = ok ? "rgba(120,255,140,.8)" : "rgba(255,90,80,.6)"; bctx.lineWidth = 1; bctx.setLineDash([2, 2]);
    bctx.beginPath(); bctx.arc(hp.x, hp.y - 4, rg, 0, Math.PI * 2); bctx.stroke(); bctx.setLineDash([]);
    if (!other) {
      bctx.globalAlpha = 0.55;
      const sh = catShape(BT.selCat);
      sprite(sh.map, { ...catData(BT.selCat).colors, p: "#ef8fa5" }, hp.x - 4, hp.y - 8 + sh.dy, bctx);
      bctx.globalAlpha = 1;
    }
  }
  // 猫と敵（奥から順に）
  const ents = [];
  BT.placed.forEach(q => ents.push({ y: q.y, f: () => {
    const sh = catShape(q.id), bob = Math.floor((t + q.ph) * 2) % 2;
    const lx = q.lunge > 0 ? q.lx : 0, ly = q.lunge > 0 ? q.ly : 0;
    if (q.id === BT.selCat && !BT.over) brect(q.x - 6, q.y + 1, 13, 2, "#ffd54a");
    else brect(q.x - 4, q.y + 1, 9, 1, "rgba(0,0,0,.25)");
    spriteO(sh.map, { ...catData(q.id).colors, p: "#ef8fa5" }, q.x - 4 + lx, q.y - 8 + sh.dy - (q.stun > 0 ? 0 : bob) + ly, bctx);
    const c = S.cats.find(x => x.id === q.id);
    if (c && c.acc) accData(c.acc).pix.forEach(([dx, dy, col]) => brect(q.x - 4 + lx + dx, q.y - 8 + ly - bob + dy, 1, 1, col));

}

cv.addEventListener("pointerdown", e => { if (!paintStyle) return; painting = true; paintAt(canvasPos(e)); renderHud(); });
cv.addEventListener("pointermove", e => { if (paintStyle && painting) { paintAt(canvasPos(e)); renderHud(); } });
window.addEventListener("pointerup", () => { if (painting) { painting = false; save(); renderAll(); } });
// 長押し（0.35秒）で家具・テーブルをつかんで、指を離したところに置く
let press = null, drag = null, eatClick = false;
cv.addEventListener("pointerdown", e => {
  if (paintStyle || view !== "shop" || BT) return;
  const p = canvasPos(e), f = furnAt(p), t = tableAt(p), hit = f ? f.id : t >= 0 ? "table:" + t : null;
  if (!hit) return;
  press = { x: e.clientX, y: e.clientY, timer: setTimeout(() => {
    if (!press) return;
    drag = { sel: hit, wasLayout: layoutMode, prevSel: layoutSel };
    layoutMode = true; layoutSel = hit; selected = null; renderAll(); renderInfo();
    if (navigator.vibrate) navigator.vibrate(20);
  }, 350) };
});
cv.addEventListener("pointermove", e => {
  if (press && !drag && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 10) { clearTimeout(press.timer); press = null; }
  if (!drag) return;
  e.preventDefault();
  const p = canvasPos(e);
  if (e.pointerType === "touch") p.y -= 8;   // 指で隠れないように少し上に
  placeSel(drag.sel, p);
});
const endPress = () => {
  if (press) { clearTimeout(press.timer); press = null; }
  if (!drag) return;
  layoutMode = drag.wasLayout; layoutSel = drag.wasLayout ? drag.prevSel : null;
  drag = null; eatClick = true; setTimeout(() => eatClick = false, 400);
  save(); renderAll();
};
window.addEventListener("pointerup", endPress);
window.addEventListener("pointercancel", endPress);
cv.addEventListener("contextmenu", e => e.preventDefault());
cv.addEventListener("click", e => {
  if (eatClick) { eatClick = false; return; }
  const p = canvasPos(e);
  if (view === "home") { selected = homeHit(p); $("info").className = "win " + (p.x < W / 2 ? "right" : "left"); renderInfo(); return; }
  if (paintStyle) return;
  if (layoutMode) return layoutClick(p);
  selected = hitTest(p);
  $("info").className = "win " + (p.x < W / 2 ? "right" : "left");
  renderInfo();
});
$("info").addEventListener("change", e => {
  if (e.target.dataset.equip) equip(e.target.dataset.equip, e.target.value);
  if (e.target.dataset.gear) { equipSlot("gear", S.gear, e.target.dataset.gear, e.target.value || null); save(); renderAll(); }
  if (e.target.dataset.chair !== undefined) { S.chairs = { ...(S.chairs || {}), [e.target.dataset.chair]: e.target.value }; addLog(`テーブル${+e.target.dataset.chair + 1}の椅子を「${chairData(e.target.value).name}」に入れかえた。`); save(); renderAll(); }
  $("info")._html = ""; renderInfo();
});
$("info").addEventListener("click", e => {
  const k = e.target.closest("[data-kind]");
  if (k && !k.disabled) { act(k.dataset.kind, k.dataset.id); $("info")._html = ""; renderInfo(); return; }
  const b = e.target.closest("[data-fact]");
  if (!b) return;
  if (b.dataset.fact === "patrol") {   // パトロールの項目を開く（この猫を最初に選んでおく）
    patrolPick = b.dataset.id;
    if ($("drawer").hidden || tab !== "town") openDrawer("town");
    return;
  }
  if (b.dataset.fact === "train") {   // 猫タブの、その猫のところを開く
    const id = b.dataset.id;
    if ($("drawer").hidden || tab !== "cats") openDrawer("cats");
    catFocus = id; subSel.cats = "🐈 うちの猫"; renderPanel(true); $("panel").scrollTop = 0;
    const card = document.getElementById("card-" + id);
    if (card) { card.scrollIntoView({ block: "start" }); card.style.outline = "3px solid var(--pink)"; setTimeout(() => card.style.outline = "", 1500); }
    return;
  }
  if (b.dataset.fact === "moveTable") {
    paintStyle = null; layoutMode = true; layoutSel = "table:" + b.dataset.id; selected = null; closeDrawer(); if (view !== "shop") setView("shop");
    save(); renderAll(); renderInfo(); return;
  }
  const id = b.dataset.id, it = itemData(id);
  if (b.dataset.fact === "move") {
    paintStyle = null; layoutMode = true; layoutSel = id; selected = null; closeDrawer(); if (view !== "shop") setView("shop");
  } else if (b.dataset.fact === "store") {
    S.items = S.items.filter(x => x !== id);
    S.stored = [...(S.stored || []), id];
    S.cats.forEach(c => { if (c.fplay && c.fplay.id === id) c.fplay = null; });
    selected = null;
    addLog(`${it.name}を倉庫にしまった。（「お店」タブから無料で出せます）`);
  } else if (b.dataset.fact === "repair") {
    if (!S.broken.includes(id) || !pay(repairCost(id))) return;
    S.broken = S.broken.filter(x => x !== id); addLog(`${it.name}を修理した！`);
  }
  save(); renderAll(); renderInfo();
});
cv.addEventListener("mousemove", e => { cv.style.cursor = view === "home" ? (homeHit(canvasPos(e)) ? "pointer" : "default") : layoutMode || paintStyle || hitTest(canvasPos(e)) ? "pointer" : "default"; });
$("reset").onclick = () => {
  if (!resetArmed) {
    resetArmed = true; $("reset").textContent = "本当にやり直す？（もう一度押す）";
    setTimeout(() => { resetArmed = false; $("reset").textContent = "最初からやり直す"; }, 3000);
    return;
  }
  S = newGame(); startMonth(false); guests = []; modalQueue = [];
  resetArmed = false; $("reset").textContent = "最初からやり直す";
  save(); renderAll(); chooseStarter();
};

// ---------- 古いセーブを今のゲームに合わせる ----------
function migrate() {
S.unlockedCats = S.unlockedCats || CATS.filter(c => c.starter).map(c => c.id);
S.met = S.met || S.cats.map(c => c.id);
if (S.bestPlace === undefined) S.bestPlace = S.lastRank ? S.lastRank.place : null;
S.cats = S.cats.filter(c => catData(c.id));
if (S.cats.length && !S.cats.some(c => "duty" in c)) S.cats.forEach((c, i) => c.duty = i < CAT_CAP[(S.expand || 1) - 1]);
{ // メニューが出せる数より多ければ、安いものからしまう
  const on = Object.keys(S.menus).filter(id => S.menus[id].on).sort((a, b) => menuData(b).price - menuData(a).price);
  on.slice(MENU_SLOTS[(S.expand || 1) - 1]).forEach(id => S.menus[id].on = false);
}
S.gear = S.gear || [];
S.broken = S.broken || [];
S.mats = S.mats || {}; S.areas = S.areas || ["shotengai"]; S.town = S.town || { shotengai: CONFIG.safetyStart };
S.cats.forEach(c => { c.bLv = Math.min(c.bLv || 1, maxBLv(c)); c.bxp = c.bxp || 0; c.lv = Math.min(c.lv, maxLv(c)); });
S.seasonWins = S.seasonWins || [];
if (!S.safetyFloorFix) { (S.areas || []).forEach(id => S.town[id] = Math.max(S.town[id] || 0, CONFIG.safetyMin)); S.safetyFloorFix = true; }   // 下限を入れたときに、一度だけ引き上げる
while (S.cats.length > catLimit() && homeLv() < HOME_CAP.length) S.homeLv = homeLv() + 1;   // 今いる猫が全員入るように
Object.values(S.menus || {}).forEach(m => m.on = true);   // 開発したメニューは全部お店に出す
S.cats.forEach(c => { applySkill(c); c.acc = null; c.gear = null; });   // 装備はなくなった   // 特訓で覚えた特技はやめて、猫ごとの固有スキル1つに
S.goals = S.goals || {}; S.stored = S.stored || []; S.ach = S.ach || []; S.home = S.home || [];
S.stat = S.stat || { kills: S.cats.reduce((n, c) => n + (c.kills || 0), 0) };
S.townLv = S.townLv || {}; S.patrolWeek = S.patrolWeek || 0;
if (S.wd === undefined) { S.wd = Math.min(6, Math.floor((S.tick || 0) / (60 / 7))); S.hour = CONFIG.openHour; S.phase = "open"; }   // 前の時計からの引っこし
if (S.phase === "close" || S.phase === "night") { S.phase = "night"; }   // 読みこんだときはお客さんがいないので、夜の続きから
if (S.dev && S.dev.left <= 0) S.dev.left = 1;
if (!S.weather || S.weather.length !== 2) { S.weather = null; makeForecast(); }
}

// ---------- スタート ----------
S = load();
if (!S) { S = newGame(); startMonth(false); }
migrate();
applyTablePos();
renderAll();
if (!S.cats.length) chooseStarter();
// ゲームの速さ（1コマの間かくと、動きの速さがいっしょに変わる）
let gameSpeed = 1, tickTimer = null;
function setSpeed(v) {
  gameSpeed = v; clearInterval(tickTimer); tickTimer = setInterval(tick, CONFIG.tickMs / v / (S && S.phase === "night" ? CONFIG.nightSpeed : S && S.phase === "close" ? CONFIG.closeSpeed : 1));   // 閉店後と夜は早送り
  S.gameSpeed = v; $("speedSel").value = String(v);
}
$("speedSel").onchange = e => { setSpeed(+e.target.value); save(); };
setSpeed(S.gameSpeed || 1);
requestAnimationFrame(frame);
</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
