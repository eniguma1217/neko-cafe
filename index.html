const BATTLE_GROUND = { shotengai: "#c9c1b3", park: "#7cb87a", jutaku: "#86bf7f", port: "#c9a77f", shrine: "#d8d2c4", maou: "#5a4f66", s_spring: "#9fd08a", s_summer: "#e8d8a8", s_autumn: "#c9a86a", s_winter: "#eef3f8" };
function fitBattle() {
  if ($("battle").hidden) return;
  const box = $("bbox").getBoundingClientRect();
  if (!box.width || !box.height) return;
  const k = Math.min(box.width / BW, box.height / BH);
  $("bstage").style.width = Math.floor(BW * k) + "px";
  $("bstage").style.height = Math.floor(BH * k) + "px";
  if (BT) $("bbox").style.background = BATTLE_GROUND[BT.area.id] || "#5d6b4f";
}
window.addEventListener("resize", fitBattle);
if (window.ResizeObserver) new ResizeObserver(fitBattle).observe($("bbox"));
function bpos(e) {
  const r = bcv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * BW, y: (e.clientY - r.top) / r.height * BH, scale: r.width / BW };
}
bcv.addEventListener("click", e => {
  if (!BT || BT.over) return;
  const p = bpos(e);
  const hit = BT.placed.find(q => Math.hypot(q.x - p.x, q.y - 4 - p.y) < Math.max(6, 16 / p.scale));
  if (hit && hit.id !== BT.selCat) { BT.selCat = hit.id; BT.msg = ""; renderBattleUI(); return; }
  if (!BT.selCat) return;
  const x = Math.round(p.x), y = Math.round(p.y + 4);
  const err = placeError(x, y, BT.selCat);
  if (err) { BT.msg = err; renderBattleUI(); return; }
  const cur = BT.placed.find(q => q.id === BT.selCat);
  if (cur) { cur.x = x; cur.y = y; if (BT.running) BT.cd[cur.id] = 1.5; }   // 戦闘中に動かすと少し休む
  else {
    BT.placed.push({ id: BT.selCat, x, y, stun: 0, lunge: 0, lx: 0, ly: 0, ph: Math.random() * 2, sp: 0, rapid: 0, rapidF: 1 });
    BT.cd[BT.selCat] = 0;
    const next = readyCats().find(c => !BT.placed.some(q => q.id === c.id));
    if (next) BT.selCat = next.id;
  }
  burst(x, y - 2, ["#ffffff", "#fff6b0"], 6, 25);
  BT.msg = ""; renderBattleUI();
});
bcv.addEventListener("mousemove", e => { if (BT) { const p = bpos(e); BT.hover = { x: Math.round(p.x), y: Math.round(p.y + 4) }; } });
bcv.addEventListener("mouseleave", () => { if (BT) BT.hover = null; });

// 演出だけは戦闘前や終了後も動かす
function animBattle(dt) {
  BT.time += dt;
  BT.shake = Math.max(0, BT.shake - dt); BT.flash = Math.max(0, BT.flash - dt);
  BT.flash2 = Math.max(0, (BT.flash2 || 0) - dt); if (BT.tint) BT.tint.t -= dt;
  BT.fxs.forEach(f => f.life -= dt); BT.fxs = BT.fxs.filter(f => f.life > 0);
  BT.parts.forEach(q => { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 60 * dt; q.life -= dt; }); BT.parts = BT.parts.filter(q => q.life > 0);
  BT.placed.forEach(q => { q.lunge = Math.max(0, q.lunge - dt); });
  if (BT.running && !BT.over) {
    BT.placed.forEach(q => { q.sp = Math.min(specialOf(q.id).charge, (q.sp || 0) + dt); q.rapid = Math.max(0, (q.rapid || 0) - dt); });
    BT.buff = Math.max(0, (BT.buff || 0) - dt); BT.gold = Math.max(0, (BT.gold || 0) - dt);
  }
  BT.enemies.forEach(en => { en.flash = Math.max(0, (en.flash || 0) - dt); });
}

function updateBattle(dt) {
  if (BT.over) return;
  BT.t += dt;
  // 敵が出てくる
  while (BT.queue.length && BT.queue[0].t <= BT.t) {
    const q = BT.queue.shift(), E = ENEMIES[q.type];
    if (q.wave !== BT.wave) { BT.wave = q.wave; banner(`第${q.wave}波！`); }
    if (q.boss) { banner(`ボス出現！ ${E.name}`); BT.shake = 0.4; }
    const hp = Math.round(E.hp * BT.hpMult * (q.boss ? CONFIG.bossHp : 1));
    const route = q.boss ? ROUTES[0] : pick(ROUTES);
    BT.enemies.push({ route, type: q.type, hp, max: hp, x: route[0][0], y: route[0][1], seg: 1, dist: 0, slow: 0, acd: 1, boss: !!q.boss, ph: Math.random() * 2 });
  }
  // 敵が進む
  BT.enemies.forEach(en => {
    const E = ENEMIES[en.type];
    en.slow = Math.max(0, en.slow - dt);
    en.stun = Math.max(0, (en.stun || 0) - dt);
    let step = en.stun > 0 ? 0 : E.speed * (en.slow > 0 ? 0.5 : 1) * dt;
    const R0 = en.route || BPATH;
    while (step > 0 && en.seg < R0.length) {
      const [tx, ty] = R0[en.seg], d = Math.hypot(tx - en.x, ty - en.y);
      if (d <= step) { en.x = tx; en.y = ty; step -= d; en.dist += d; en.seg++; }
      else { en.x += (tx - en.x) / d * step; en.y += (ty - en.y) / d * step; en.dist += step; step = 0; }
    }
    if (en.seg >= R0.length) {
      en.reached = true; BT.house -= E.dmg; BT.shake = 0.3; BT.flash = 0.25;
      BT.leaks = (BT.leaks || 0) + 1;
      if (en.boss) BT.bossLeak = true;
      bfx(housePos()[0] - 2, housePos()[1] - 14, en.boss ? "突破された！" : `-${E.dmg}`, "bad"); burst(housePos()[0] - 2, housePos()[1], ["#e0473c", "#f6e7c8"], en.boss ? 20 : 8, 40);
    }
    // 近くの猫をひっかく（防御があると、ひるむ時間が短い）
    en.acd -= dt;
    if (en.acd <= 0) {
      const q = BT.placed.find(q => Math.hypot(q.x - en.x, q.y - 4 - en.y) < 14);
      if (q) {
        const c = S.cats.find(x => x.id === q.id);
        const stun = 1.2 * E.dmg * (1 - (c ? battleStats(c).def : 0));
        q.stun = Math.max(q.stun, stun); en.acd = 1.4;
        bfx(q.x, q.y - 12, "ひるんだ！", "stun"); burst(q.x, q.y - 4, ["#ffffff", "#ffd54a"], 4, 30);
      }
    }
  });
  BT.enemies = BT.enemies.filter(en => !en.reached);
  // 猫が攻撃する
  BT.placed.forEach(q => {
    const c = S.cats.find(x => x.id === q.id); if (!c) return;
    if (q.stun > 0) { q.stun -= dt; return; }
    const st = battleStats(c);
    BT.cd[q.id] = (BT.cd[q.id] || 0) - dt;
    if (BT.cd[q.id] > 0) return;
    const inRange = BT.enemies.filter(en => Math.hypot(en.x - q.x, en.y - (q.y - 4)) <= st.range);
    if (!inRange.length) return;
    const target = inRange.sort((a, b) => b.dist - a.dist)[0];
    const crit = Math.random() < st.crit;
    const dmg = Math.max(1, Math.round(st.atk * st.mult * (crit ? 2 : 1) * (BT.buff > 0 ? BT.buffMult : 1)));
    q.sp = Math.min(specialOf(q.id).charge, (q.sp || 0) + 0.5);
    const hit = st.splash ? BT.enemies.filter(en => Math.hypot(en.x - target.x, en.y - target.y) <= st.splash) : [target];
    hit.forEach(en => { en.hp -= dmg; en.flash = 0.12; en.lastHit = q.id; if (st.slow) en.slow = Math.max(en.slow, st.slow); });
    const d = Math.hypot(target.x - q.x, target.y - q.y) || 1;
    q.lunge = 0.12; q.lx = (target.x - q.x) / d * 2; q.ly = (target.y - q.y) / d * 2;
    const kind = (c.bskills || []).includes("shot") ? "shot" : CAT_ROLES[q.id] || "claw";
    BT.fxs.push({ kind, col: catData(q.id).colors.a, x1: q.x, y1: q.y - 5, x2: target.x, y2: target.y - 3, life: kind === "area" ? 0.35 : 0.2, max: kind === "area" ? 0.35 : 0.2, splash: st.splash, crit });
    const h = ENEMIES[target.type].map.length;
    bfx(target.x, target.y - h - 2, crit ? `会心！${dmg}` : String(dmg), crit ? "crit" : "dmg");
    BT.cd[q.id] = st.cd / (q.rapid > 0 ? q.rapidF : 1);
  });
  // たおした敵
  BT.enemies.filter(en => en.hp <= 0).forEach(en => {
    burst(en.x, en.y - 3, ["#ffffff", "#d8d2c4", "#fff6b0"], en.boss ? 20 : 9, en.boss ? 60 : 40);
    BT.kills++;
    if (en.boss) BT.bossKilled = true;
    const killer = S.cats.find(c => c.id === en.lastHit);
    if (killer) {
      killer.kills = (killer.kills || 0) + 1;
      killer.yKills = (killer.yKills || 0) + 1;   // 今年の討伐数
      if (BT.gold > 0) { const g = 60 * BT.area.level; S.money += g; BT.goldGot = (BT.goldGot || 0) + g; bfx(en.x, en.y - 10, "+" + yen(g), "money"); }
      const q = BT.placed.find(x => x.id === killer.id);
      gainBxp(killer, ENEMIES[en.type].xp || 2, q && q.x, q && q.y - 14, true);
    }
  });
  BT.enemies = BT.enemies.filter(en => en.hp > 0);
  // 終わり
  if (BT.house <= 0 || BT.bossLeak) return finishBattle(false);
  if (!BT.queue.length && !BT.enemies.length) return finishBattle(true);
  if (Math.floor(BT.t * 4) !== Math.floor((BT.t - dt) * 4)) renderBattleHud();
}

function finishBattle(win, retreat) {
  const a = BT.area, ratio = BT.kills / BT.total;
  BT.over = true; BT.running = false;
  banner(win ? "街を守った！" : retreat ? "撤退…" : BT.bossLeak ? "ボスに突破された！" : "守りきれなかった…");
  if (win) for (let i = 0; i < 4; i++) burst(rand(30, 160), rand(20, 90), ["#ffd54a", "#ff7aa2", "#9fd3ff", "#ffffff"], 10, 70);
  const got = {};
  if (!retreat) Object.entries(dropsFor(a, BT.lv)).forEach(([k, [lo, hi]]) => {
    if (Math.random() > CONFIG.dropChance) return;   // 素材ごとに、手に入らないこともある
    const n = Math.round(rand(lo, hi) * (0.5 + ratio) * (1 + 0.15 * (BT.lv - 1)) * (win ? 1 : 0.5) * CONFIG.dropAmount);
    if (n > 0) { got[k] = n; S.mats[k] = (S.mats[k] || 0) + n; }
  });
  const koban = BT.placed.some(q => S.cats.find(c => c.id === q.id)?.gear === "koban") ? 1.5 : 1;
  const money = retreat ? 0 : Math.round(1000 * a.level * (1 + 0.2 * (BT.lv - 1)) * ratio * (win ? 1 : 0.5) * koban / 10) * 10;
  S.money += money;
  // 最後まで来た敵の分だけ、お店に被害が出て安全度が下がる
  const leaks = BT.leaks || 0;
  const lost = !win && !retreat;
  const repair = Math.round((leaks * 400 * a.level + (lost ? 3000 * a.level : 0)) / 100) * 100;
  S.money -= repair; S.today.repair = (S.today.repair || 0) + repair;
  const damage = lost ? damageShop(BT.bossLeak ? 0.8 : 0.5, BT.bossLeak ? 3 : 2) : [];
  if (repair) addLog(`敵がお店まで来てしまった…。修理費${yen(repair)}`);
  damage.forEach(d => addLog(d + "…"));
  const before = S.town[a.id] ?? 0;
  const change = win ? Math.max(5, safetyGain(BT.lv) - leaks * 3) : retreat ? -5 : -15 - leaks * 2;
  S.town[a.id] = Math.max(0, Math.min(100, before + change));
  // 勝ったら、まれに装備品やレア猫が見つかる
  let gearGot = null, rareCat = null, ingGot = null, newLv = false, bellGot = false, accGot = null;
  if (win) {
    if (a.final && !(S.goals || {}).boss) {
      S.goals = { ...(S.goals || {}), boss: true };
      S.money += FINAL_PRIZE.money; S.pop = Math.min(CONFIG.goalPopularity, S.pop + FINAL_PRIZE.pop);
      addLog(`👑 ネズミ大王を倒した！ 街に平和がもどった！ 賞金${yen(FINAL_PRIZE.money)}・人気+${FINAL_PRIZE.pop}`);
      queueModal("👑 ネズミ大王を倒した！", `<div class="bigemoji">🏰</div><div>街を荒らしていた黒幕「ネズミ大王」をやっつけました！</div><div>賞金${yen(FINAL_PRIZE.money)}・人気+${FINAL_PRIZE.pop}・限界突破の鈴×1</div>`);
      S.limitItems = (S.limitItems || 0) + 1;
    }
    if (!a.final && BT.lv === (S.townLv[a.id] || 1) && BT.lv < MAX_AREA_LV) { S.townLv[a.id] = BT.lv + 1; areaSel[a.id] = BT.lv + 1; newLv = true; }
    const chance = 0.12 + 0.03 * (BT.lv - 1);
    const g = GEAR.find(x => x.drop === a.id);
    if (g && Math.random() < chance * (S.gear.includes(g.id) ? 0.5 : 1)) { S.gear.push(g.id); gearGot = g; addLog(`レア装備「${g.name}」を手に入れた！`); }
    const sacc = ACCESSORIES.find(x => x.drop === a.id);
    if (sacc && Math.random() < chance * 0.8) { S.accs.push(sacc.id); accGot = sacc; addLog(`季節限定の「${sacc.name}」を見つけた！`); }
    const rares = CATS.filter(d => d.unlock && d.unlock.type === "rescue" && d.unlock.area === a.id && !S.unlockedCats.includes(d.id))
      .filter(d => { const r = RESCUE_RATE[rankOf(d.id)] || RESCUE_RATE[4]; return BT.lv >= r.minLv && Math.random() < r.base + r.perLv * (BT.lv - 1); });
    // 限界突破の鈴：高いレベルとボス討伐でだけ、ごくまれに見つかる
    const bellChance = (BT.lv >= 5 ? 0.02 + 0.005 * (BT.lv - 5) : 0.005) + (BT.bossKilled ? 0.03 : 0);
    if (Math.random() < bellChance) { S.limitItems = (S.limitItems || 0) + 1; bellGot = true; addLog("🔔 限界突破の鈴を見つけた！ とても珍しい！"); }
    const ing = INGREDIENTS.find(i => i.patrol === a.id && !S.ingredients.includes(i.id));
    if (ing && Math.random() < 0.3 + 0.05 * (BT.lv - 1)) { S.ingredients.push(ing.id); ingGot = ing; addLog(`珍しい食材「${ing.name}」を見つけた！ 開発に使えるようになった。`); }
    if (rares.length) {
      rareCat = pick(rares); S.unlockedCats.push(rareCat.id);
      addLog(`迷い猫の${rareCat.name}を保護した！`);
    }
  }
  if (win && a.season && !(S.seasonWins || []).includes(a.id)) S.seasonWins = [...(S.seasonWins || []), a.id];
  checkGuestArrivals();
  // 実績用の記録（連続で無傷の勝利・たおした数）
  if (!retreat) {
    addStat("kills", BT.kills); if (BT.bossKilled) addStat("bosses");
    if (win && !leaks) { addStat("streak"); if (statOf("streak") > statOf("bestStreak")) S.stat.bestStreak = statOf("streak"); }
    else S.stat.streak = 0;
  }
  checkAchievements();
  BT.placed.forEach(q => { const c = S.cats.find(x => x.id === q.id); if (c) c.patrolWeek = S.day; });   // 今週はもう出動できない
  // 出動した猫は疲れてお昼寝
  BT.placed.forEach(q => { const c = S.cats.find(x => x.id === q.id); if (c) { c.energy = 0; c.sleeping = true; c.target = null; c.patrols = (c.patrols || 0) + 1; gainBxp(c, retreat ? 0 : win ? 5 + BT.lv : 2); } });
  if (a.final && !win && !retreat) addLog("ネズミ大王は強すぎた…。猫を育てて、装備を整えて再挑戦しよう！");
  addLog(`${a.name}のパトロール：${win ? "街を守った！" : retreat ? "撤退した…" : "おうちを守りきれなかった…"}`);
  $("bResult").innerHTML = `<div class="win" style="box-shadow:none"><div class="bd">
    <div style="font-size:18px">${win ? (leaks ? "🙂 なんとか守った" : "🎉 完璧に街を守った！") : retreat ? "🏳️ 撤退した" : BT.bossLeak ? "😿 ボスにおうちを突破された…" : "😿 守りきれなかった…"}</div>
    ${rareCat ? `<div class="row done"><div class="nm">✨ 迷い猫を保護した！<small>${rankBadge(rareCat.id)}${rareCat.name}（${rareCat.desc}）。保護猫センターから迎えられます（人気と素材が必要）。</small></div></div>` : ""}
    ${bellGot ? `<div class="row done"><div class="nm">🔔✨ 限界突破の鈴を見つけた！<small>とても珍しいアイテム。猫タブで使うと、その猫のLvの上限が+${LIMIT_STEP}されます。</small></div></div>` : ""}
    ${ingGot ? `<div class="row done"><div class="nm">✨ 珍しい食材を見つけた！<small>${ingGot.emoji} ${ingGot.name}（パトロールでしか手に入らない食材。開発に使えます）</small></div></div>` : ""}
    ${accGot ? `<div class="row done"><div class="nm">🎀 季節限定のお店用装備を見つけた！<small>${accGot.name}（${accGot.desc}）</small></div></div>` : ""}
    ${gearGot ? `<div class="row done"><div class="nm">✨ レア装備を見つけた！<small>${stars(gearGot.rare)} ${gearGot.name}（${gearGot.desc}）</small></div></div>` : ""}
    <table>
      <tr><td>たおした敵</td><td>${BT.kills}/${BT.total}</td></tr>
      ${leaks ? `<tr><td>おうちまで来た敵</td><td class="minus">${leaks}体${BT.bossLeak ? "（ボスを含む）" : ""}</td></tr>` : ""}
      ${repair ? `<tr><td>お店の修理費</td><td class="minus">-${yen(repair)}</td></tr>` : ""}
      ${damage.length ? `<tr><td>お店の被害</td><td class="minus">${damage.join("・")}</td></tr>` : ""}
      <tr><td>${a.name}の安全度</td><td>${before}% → ${S.town[a.id]}%</td></tr>
      <tr><td>お礼のお金</td><td>${yen(money)}</td></tr>
      ${BT.goldGot ? `<tr><td>必殺技で手に入れたお金</td><td>${yen(BT.goldGot)}</td></tr>` : ""}
      <tr><td>手に入れた素材</td><td>${Object.keys(got).length ? matText(got) : "なし"}</td></tr>
      ${newLv ? `<tr><td>新しいレベル</td><td>Lv${S.townLv[a.id]}に挑戦できるようになった！（新しい敵や素材が出ることも）</td></tr>` : ""}
    </table>
    <div class="note">出動した猫たちは疲れてお昼寝しています。</div>
    <button class="btn big" id="bBack">お店に戻る</button></div></div>`;
  renderBattleUI();
  $("bBack").onclick = () => { BT = null; $("battle").hidden = true; save(); renderAll(); };
  save();
}

// 敵にお店まで来られたときの被害（家具を壊す・素材を盗む）
function damageShop(breakChance, stealMax) {
  const res = [];
  const ok = S.items.filter(id => !S.broken.includes(id));
  if (ok.length && Math.random() < breakChance) {
    const id = pick(ok); S.broken.push(id); res.push(`${itemData(id).name}が壊された`);
    (S.today.brokeList = S.today.brokeList || []).push(itemData(id).name);
  }
  const have = Object.keys(S.mats).filter(k => S.mats[k] > 0);
  if (have.length && stealMax) {
    const k = pick(have), n = Math.min(S.mats[k], rand(1, stealMax));
    S.mats[k] -= n; res.push(`${MATERIALS[k]}を${n}個盗まれた`);
    (S.today.stolen = S.today.stolen || []).push(`${MATERIALS[k]}${n}`);
  }
  return res;
}

function brect(x, y, w, h, col) { bctx.fillStyle = col; bctx.fillRect(Math.round(x), Math.round(y), w, h); }
const WHITE_PAL = new Proxy({}, { get: (t, k) => (k === "." || k === " ") ? undefined : "#ffffff" });
function drawBattle() {
  bctx.save();
  if (BT.shake > 0) bctx.translate(rand(-1, 1), rand(-1, 1));
  bctx.drawImage(BT.bg, 0, 0);
  const t = BT.time;
  // 配置中は、置いた猫みんなの射程をうっすら表示
  if (!BT.running && !BT.over) BT.placed.forEach(q => {
    if (q.id === BT.selCat) return;
    const c = S.cats.find(x => x.id === q.id);
    bctx.strokeStyle = "rgba(255,255,255,.35)"; bctx.lineWidth = 1;
    bctx.beginPath(); bctx.arc(q.x, q.y - 4, battleStats(c).range, 0, Math.PI * 2); bctx.stroke();
  });
  // 選んでいる猫の射程
  const sel = BT.placed.find(q => q.id === BT.selCat);
  if (sel && !BT.over) {
    const c = S.cats.find(x => x.id === sel.id);
    bctx.fillStyle = "rgba(255,255,255,.12)"; bctx.beginPath(); bctx.arc(sel.x, sel.y - 4, battleStats(c).range, 0, Math.PI * 2); bctx.fill();
    bctx.strokeStyle = "rgba(255,255,255,.8)"; bctx.lineWidth = 1; bctx.setLineDash([2, 2]);
    bctx.beginPath(); bctx.arc(sel.x, sel.y - 4, battleStats(c).range, 0, Math.PI * 2); bctx.stroke(); bctx.setLineDash([]);
  }
  // 置く場所の目安（マウスのとき）
  if (BT.hover && BT.selCat && !BT.over) {
    const ok = !placeError(BT.hover.x, BT.hover.y, BT.selCat);
    const hc = S.cats.find(x => x.id === BT.selCat);
    if (hc) {   // ここに置いたときの射程
      bctx.fillStyle = ok ? "rgba(120,255,140,.12)" : "rgba(255,90,80,.10)"; bctx.beginPath(); bctx.arc(BT.hover.x, BT.hover.y - 4, battleStats(hc).range, 0, Math.PI * 2); bctx.fill();
      bctx.strokeStyle = ok ? "rgba(120,255,140,.8)" : "rgba(255,90,80,.6)"; bctx.lineWidth = 1; bctx.setLineDash([2, 2]);
      bctx.beginPath(); bctx.arc(BT.hover.x, BT.hover.y - 4, battleStats(hc).range, 0, Math.PI * 2); bctx.stroke(); bctx.setLineDash([]);
    }
    bctx.globalAlpha = 0.55;
    const sh = catShape(BT.selCat);
    sprite(sh.map, ok ? { ...catData(BT.selCat).colors, p: "#ef8fa5" } : WHITE_PAL, BT.hover.x - 4, BT.hover.y - 8 + sh.dy, bctx);
    bctx.globalAlpha = 1;
    brect(BT.hover.x - 5, BT.hover.y + 1, 11, 1, ok ? "#78ff8c" : "#ff5a50");
  }
  // 猫と敵（奥から順に）
  const ents = [];
  BT.placed.forEach(q => ents.push({ y: q.y, f: () => {
    const sh = catShape(q.id), bob = Math.floor((t + q.ph) * 2) % 2;
    const lx = q.lunge > 0 ? q.lx : 0, ly = q.lunge > 0 ? q.ly : 0;
    if (q.id === BT.selCat && !BT.over) brect(q.x - 6, q.y + 1, 13, 2, "#ffd54a");
    else brect(q.x - 4, q.y + 1, 9, 1, "rgba(0,0,0,.25)");
    spriteO(sh.map, { ...catData(q.id).colors, p: "#ef8fa5" }, q.x - 4 + lx, q.y - 8 + sh.dy - (q.stun > 0 ? 0 : bob) + ly, bctx);
    const c = S.cats.find(x => x.id === q.id);
    if (c && c.acc) accData(c.acc).pix.forEach(([dx, dy, col]) => brect(q.x - 4 + lx + dx, q.y - 8 + ly - bob + dy, 1, 1, col));
    if (q.stun > 0) { const k = Math.floor(t * 8) % 3; [0, 1, 2].forEach(i => brect(q.x - 4 + ((i * 4 + k * 2) % 10), q.y - 12 - (i === k ? 1 : 0), 1, 1, "#ffd54a")); }
    if (rankOf(q.id) >= 4 && Math.floor(t * 3) % 3 === 0) brect(q.x + 5, q.y - 9, 1, 1, "#fff6b0");
  }}));
  BT.enemies.forEach(en => ents.push({ y: en.y, f: () => {
    const E = ENEMIES[en.type], w = E.map[0].length, h = E.map.length;
    const bob = Math.floor((t + en.ph) * (en.slow > 0 ? 3 : 6)) % 2;
    brect(en.x - w / 2, en.y, w, 1, "rgba(0,0,0,.25)");
    spriteO(E.map, en.flash > 0 ? WHITE_PAL : E.pal, en.x - w / 2, en.y - h - bob, bctx, en.boss ? "#e0473c" : "rgba(42,36,51,.85)");
    if (en.slow > 0) brect(en.x - w / 2, en.y - h - bob - 1, w, 1, "#9fd0ff");
    if (en.stun > 0) { const k = Math.floor(t * 8) % 3; [0, 1, 2].forEach(i => brect(en.x - 3 + i * 3, en.y - h - 7 - (i === k ? 1 : 0), 1, 1, "#ffd54a")); }
    const bw = en.boss ? 16 : 10;
    brect(en.x - bw / 2 - 1, en.y - h - 5, bw + 2, 4, "#253561");
    brect(en.x - bw / 2, en.y - h - 4, bw, 2, "#5a2a33");
    brect(en.x - bw / 2, en.y - h - 4, Math.max(1, Math.round(bw * en.hp / en.max)), 2, en.hp / en.max > 0.5 ? "#5cc27a" : en.hp / en.max > 0.25 ? "#f0b52a" : "#e0473c");
  }}));
  ents.sort((a, b) => a.y - b.y).forEach(e => e.f());
  // 攻撃の演出
  BT.fxs.forEach(f => {
    const k = 1 - f.life / f.max;
    if (f.kind === "ring") {          // 必殺技：大きな輪
      bctx.strokeStyle = `rgba(255,213,74,${1 - k})`; bctx.lineWidth = 3;
      bctx.beginPath(); bctx.arc(f.x2, f.y2, Math.max(2, f.splash * k), 0, Math.PI * 2); bctx.stroke();
      bctx.strokeStyle = `rgba(255,122,162,${1 - k})`; bctx.lineWidth = 1;
      bctx.beginPath(); bctx.arc(f.x2, f.y2, Math.max(1, f.splash * k * 0.7), 0, Math.PI * 2); bctx.stroke();
    } else if (f.kind === "beam") {   // 必殺技：光の一撃
      bctx.strokeStyle = `rgba(255,255,255,${1 - k})`; bctx.lineWidth = 4; bctx.beginPath(); bctx.moveTo(f.x1, f.y1); bctx.lineTo(f.x2, f.y2); bctx.stroke();
      bctx.strokeStyle = `rgba(255,95,151,${1 - k})`; bctx.lineWidth = 2; bctx.beginPath(); bctx.moveTo(f.x1, f.y1); bctx.lineTo(f.x2, f.y2); bctx.stroke();
    } else if (f.kind === "shot") {          // 毛玉ショット：毛玉が飛んでいく
      const x = f.x1 + (f.x2 - f.x1) * Math.min(1, k * 1.4), y = f.y1 + (f.y2 - f.y1) * Math.min(1, k * 1.4) - Math.sin(Math.min(1, k * 1.4) * Math.PI) * 6;
      brect(x - 1, y - 1, 3, 3, f.col || "#f7f2ea"); brect(x - 1, y - 1, 1, 1, "#ffffff");
      if (k > 0.7) { brect(f.x2 - 2, f.y2, 5, 1, "#fff6b0"); brect(f.x2, f.y2 - 2, 1, 5, "#fff6b0"); }
    } else if (f.kind === "claw") {          // ひっかき：3本の白い線
      for (let i = -1; i <= 1; i++) for (let j = 0; j < 6; j++) if (j / 6 <= k * 1.6) brect(f.x2 - 3 + i * 2 + j, f.y2 - 4 + j, 1, 1, f.crit ? "#ffe14a" : "#ffffff");
    } else if (f.kind === "rapid") {  // ねこパンチ：小さな星
      const r = 1 + Math.round(k * 3), c = f.crit ? "#ffe14a" : "#fff6b0";
      brect(f.x2 - r, f.y2, r * 2 + 1, 1, c); brect(f.x2, f.y2 - r, 1, r * 2 + 1, c); brect(f.x2 - 1, f.y2 - 1, 3, 3, "#ffffff");
    } else if (f.kind === "hiss") {   // 威嚇：青い音の波
      const a = Math.atan2(f.y2 - f.y1, f.x2 - f.x1), d = Math.hypot(f.x2 - f.x1, f.y2 - f.y1);
      bctx.strokeStyle = "rgba(159,208,255,.9)"; bctx.lineWidth = 1;
      [0.35, 0.65, 0.95].forEach(m => { bctx.beginPath(); bctx.arc(f.x1, f.y1, d * Math.min(1, m * (0.4 + k)), a - 0.45, a + 0.45); bctx.stroke(); });
    } else {                          // 体当たり：広がる輪
      bctx.strokeStyle = `rgba(255,246,176,${1 - k})`; bctx.lineWidth = 2;
      bctx.beginPath(); bctx.arc(f.x2, f.y2, Math.max(2, (f.splash || 10) * k), 0, Math.PI * 2); bctx.stroke();
    }
    if (f.crit && k < 0.5) { brect(f.x2 - 4, f.y2 - 4, 9, 1, "#ff5f97"); brect(f.x2, f.y2 - 8, 1, 9, "#ff5f97"); }
  });
  // 必殺技ボタンに合わせている猫を目立たせる（効果の範囲も）
  const hq = BT.spHover && BT.placed.find(q => q.id === BT.spHover);
  if (hq) {
    const k = Math.floor(t * 4) % 2;
    bctx.strokeStyle = "#ff7aa2"; bctx.lineWidth = 1;
    bctx.beginPath(); bctx.arc(hq.x, hq.y - 4, 8 + k, 0, Math.PI * 2); bctx.stroke();
    brect(hq.x - 2, hq.y - 20 + k, 5, 1, "#ff7aa2"); brect(hq.x - 1, hq.y - 19 + k, 3, 1, "#ff7aa2"); brect(hq.x, hq.y - 18 + k, 1, 1, "#ff7aa2");
    specialOf(hq.id).fx.forEach(([kind, a]) => {
      if (kind === "nuke" && a) { bctx.strokeStyle = "rgba(255,122,162,.7)"; bctx.setLineDash([3, 2]); bctx.beginPath(); bctx.arc(hq.x, hq.y - 4, a, 0, Math.PI * 2); bctx.stroke(); bctx.setLineDash([]); }
    });
  }
  // 必殺技の光
  if (BT.flash2 > 0) { bctx.fillStyle = `rgba(255,255,255,${BT.flash2})`; bctx.fillRect(-2, -2, BW + 4, BH + 4); }
  if (BT.tint && BT.tint.t > 0) { bctx.fillStyle = BT.tint.col; bctx.fillRect(-2, -2, BW + 4, BH + 4); }
  if (BT.buff > 0) BT.placed.forEach(q => { if (Math.floor(t * 6) % 2) brect(q.x - 1, q.y - 12, 3, 1, "#ff7aa2"); });
  // つぶ
  BT.parts.forEach(q => brect(q.x, q.y, 1, 1, q.col));
  bctx.restore();
  if (BT.flash > 0) { bctx.fillStyle = `rgba(224,71,60,${BT.flash})`; bctx.fillRect(0, 0, BW, BH); }
}

// ---------- セーブ ----------
function save() {
  try {
    const copy = JSON.parse(JSON.stringify(S));
    copy.cats.forEach(c => { delete c.x; delete c.y; delete c.target; delete c.wander; delete c.moving; delete c.play; delete c.fplay; });
    localStorage.setItem(SAVE_KEY, JSON.stringify(copy));
  } catch (e) {}
}
function load() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { return null; } }

// ---------- セーブ画面（スロット・書き出し・読み込み） ----------
const SLOTS = 3;
const slotKey = n => `nekocafe-slot-${n}`;
let saveArmed = null;   // 「本当に？」待ちのボタン
function snapshot() {
  const copy = JSON.parse(JSON.stringify(S));
  copy.cats.forEach(c => { delete c.x; delete c.y; delete c.target; delete c.wander; delete c.moving; delete c.play; delete c.fplay; });
  copy.savedAt = new Date().toLocaleString("ja-JP");
  return copy;
}
function readSlot(n) { try { return JSON.parse(localStorage.getItem(slotKey(n))); } catch (e) { return null; } }
const summary = d => `${Math.floor((CONFIG.startMonth - 1 + Math.floor((d.day - 1) / CONFIG.weeksPerMonth)) / 12) + 1}年目 ${((CONFIG.startMonth - 1 + Math.floor((d.day - 1) / CONFIG.weeksPerMonth)) % 12) + 1}月・${yen(d.money)}・人気${d.pop}・猫${d.cats.length}匹`;
const encodeSave = d => btoa(unescape(encodeURIComponent(JSON.stringify(d))));
function decodeSave(text) {
  const d = JSON.parse(decodeURIComponent(escape(atob(text.trim()))));
  if (!d || typeof d.day !== "number" || !Array.isArray(d.cats)) throw new Error("bad");
  return d;
}
function applySave(d) {
  S = d; guests = []; raider = null; BT = null; selected = null; modalQueue = [];
  migrate(); applyTablePos(); save();
  $("battle").hidden = true; $("modal").hidden = true; $("saveModal").hidden = true;
  renderAll();
  if (!S.cats.length) chooseStarter();
}
function openSave(msg) {
  const rows = Array.from({ length: SLOTS }, (_, i) => i + 1).map(n => {
    const d = readSlot(n);
    const arm = k => saveArmed === `${k}${n}`;
    return `<div class="row" style="flex-direction:column;align-items:stretch">
      <div><b>スロット${n}</b>　<span class="note">${d ? `${summary(d)}<br>保存：${d.savedAt || "—"}` : "空き"}</span></div>
      <div class="line" style="flex-wrap:wrap">
        <button class="btn" data-sv="save" data-n="${n}">${d ? (arm("save") ? "本当に上書きする？" : "ここにセーブ") : "ここにセーブ"}</button>
        ${d ? `<button class="btn" data-sv="load" data-n="${n}">${arm("load") ? "本当にロードする？" : "ロード"}</button>
        <button class="btn off" data-sv="del" data-n="${n}">${arm("del") ? "本当に消す？" : "消す"}</button>` : ""}
      </div></div>`;
  }).join("");
  $("saveBody").innerHTML = `
    ${msg ? `<div class="row done"><div class="nm">${msg}</div></div>` : ""}
    <div class="note">ふだんは自動でセーブされています。ここでは、別のスロットに残しておいたり、データを書き出して別の端末（PC ⇔ iPhone）に移したりできます。</div>
    ${rows}
    <div class="grp"><h3>■ セーブデータを書き出す</h3>
      <div class="note">下の文字をコピーして、メモなどに保存しておけます。</div>
      <textarea id="exportBox" readonly rows="3" style="width:100%;font-size:11px;font-family:monospace">${encodeSave(snapshot())}</textarea>
      <div><button class="btn" id="copyExport">コピーする</button></div>
    </div>
    <div class="grp"><h3>■ セーブデータを読み込む</h3>
      <textarea id="importBox" rows="3" placeholder="書き出した文字をここに貼りつけ" style="width:100%;font-size:11px;font-family:monospace"></textarea>
      <div><button class="btn" id="doImport">${saveArmed === "import" ? "本当に読み込む？（今のデータは消えます）" : "読み込む"}</button></div>
    </div>
    <button class="btn big" id="closeSave">閉じる</button>`;
  $("saveModal").hidden = false;
  $("saveBody").querySelectorAll("[data-sv]").forEach(b => b.onclick = () => slotAction(b.dataset.sv, +b.dataset.n));
  $("copyExport").onclick = () => {
    const box = $("exportBox"); box.select();
    try {
      navigator.clipboard.writeText(box.value).then(() => openSave("コピーしました！ メモなどに貼りつけて保存してね。"), () => {});
    } catch (e) { /* コピーできない環境では、選択された文字を自分でコピーしてもらう */ }
  };
  $("doImport").onclick = () => {
    const text = $("importBox").value;
    let d; try { d = decodeSave(text); } catch (e) { saveArmed = null; return openSave("⚠️ 読み込めませんでした。書き出した文字を全部そのまま貼りつけてね。"); }
    if (saveArmed !== "import") { saveArmed = "import"; openSave(); $("importBox").value = text; return; }
    saveArmed = null; applySave(d); addLog("セーブデータを読み込んだ！"); renderAll();
  };
  $("closeSave").onclick = () => { saveArmed = null; $("saveModal").hidden = true; };
}
function slotAction(kind, n) {
  const d = readSlot(n), key = `${kind}${n}`;
  if (d && saveArmed !== key) { saveArmed = key; return openSave(); }   // 中身があるときは2回押しで確認
  saveArmed = null;
  try {
    if (kind === "save") { localStorage.setItem(slotKey(n), JSON.stringify(snapshot())); return openSave(`スロット${n}にセーブしました！`); }
    if (kind === "load") { applySave(readSlot(n)); addLog(`スロット${n}をロードした！`); return renderAll(); }
    if (kind === "del") { localStorage.removeItem(slotKey(n)); return openSave(`スロット${n}を消しました。`); }
  } catch (e) { openSave("⚠️ うまく保存できませんでした（ブラウザの設定で保存が止められているかも）。下の「書き出す」で残しておいてね。"); }
}

// ---------- ボタン ----------
$("panel").addEventListener("click", e => {
  const b = e.target.closest("[data-kind]");
  if (b && !b.disabled) act(b.dataset.kind, b.dataset.id);
});
$("panel").addEventListener("toggle", e => {
  const id = e.target.dataset && e.target.dataset.det;
  if (!id) return;
  if (e.target.open) openDetails.add(id); else openDetails.delete(id);
  lastPanel = "";
}, true);
$("panel").addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id && e.target.id.startsWith("rn-")) act("renameSave", e.target.id.slice(3));
});
$("panel").addEventListener("change", e => {
  if (e.target.dataset.chair !== undefined) { S.chairs = { ...(S.chairs || {}), [e.target.dataset.chair]: e.target.value }; save(); renderPanel(true); }
  if (e.target.dataset.alv) { areaSel[e.target.dataset.alv] = +e.target.value; renderPanel(true); }
  if (e.target.dataset.train) { trainSel[e.target.dataset.train] = e.target.value; renderPanel(true); }
  if (e.target.dataset.btrain) { btrainSel[e.target.dataset.btrain] = e.target.value; renderPanel(true); }
  if (e.target.dataset.equip) equip(e.target.dataset.equip, e.target.value);
  if (e.target.dataset.gear) {
    equipSlot("gear", S.gear, e.target.dataset.gear, e.target.value || null);
    save(); renderAll();
  }
});
// 左の項目：押すとゲームの上に中身が開く。同じ項目をもう一度押すと閉じる
function openDrawer(name) {
  const dr = $("drawer"), same = !dr.hidden && tab === name;
  dr.hidden = same;
  if (!same) { tab = name; subSel[tab] = null; }
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", !dr.hidden && x.dataset.tab === tab));
  if (dr.hidden) return;
  const t = document.querySelector(`.tab[data-tab="${tab}"]`);
  $("drawerTitle").textContent = t ? t.title : "";
  $("panel").hidden = tab === "log" || tab === "sys"; $("logPane").hidden = tab !== "log"; $("sysPane").hidden = tab !== "sys"; if (tab === "log" || tab === "sys") $("subnav").hidden = true;
  renderPanel(true);
}
function closeDrawer() { if (!$("drawer").hidden) openDrawer(tab); }
document.querySelectorAll(".tab").forEach(t => t.onclick = () => openDrawer(t.dataset.tab));
$("drawerClose").onclick = closeDrawer;
$("modeBtn").onclick = () => { layoutMode = false; layoutSel = null; paintStyle = null; save(); renderAll(); };
// ◀ でたたむ・▶ でひらく
function setFold(on) {
  $("app").classList.toggle("folded", on);
  $("fold").textContent = on ? "▶" : "◀";
  $("fold").setAttribute("aria-label", on ? "メニューをひらく" : "メニューをたたむ");
  if (on) closeDrawer();
  try { localStorage.setItem("nekocafe-fold", on ? "1" : ""); } catch (e) {}
  requestAnimationFrame(fitStage);
}
$("fold").onclick = () => setFold(!$("app").classList.contains("folded"));
// ゲーム画面を、あいている場所いっぱいに（縦横の比率はそのまま）
function fitStage() {
  const box = $("stagebox").getBoundingClientRect();
  if (!box.width || !box.height) return;
  const nw = Math.max(BASE_W, Math.min(MAX_W, Math.floor(H * box.width / box.height)));
  if (nw !== W) {
    W = nw; cv.width = W; updateWindows(); applyTablePos();
    parts.forEach(p => { if (p.x > W) p.x = Math.random() * W; });
  }
  const k = Math.min(box.width / W, box.height / H);
  const sw = Math.round(W * k), sh = Math.round(H * k);
  $("stage").style.width = sw + "px";
  $("stage").style.height = sh + "px";
  drawBackdrop(box.width, box.height, k, (box.width - sw) / 2, (box.height - sh) / 2);
}
// ゲーム画面の外側に、床と壁の続きを描いて、すき間をなくす
function drawBackdrop(bw, bh, k, ox, oy) {
  const c = $("bgc"), cw = Math.ceil(bw / k) + 1, ch = Math.ceil(bh / k) + 1;
  c.width = cw; c.height = ch;
  c.style.width = cw * k + "px"; c.style.height = ch * k + "px";
  const g = c.getContext("2d"), gx = Math.round(ox / k), gy = Math.round(oy / k);
  const R = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
  // 床（ゲームと同じ模様・同じ位置でつながるように）
  const r0 = Math.floor((0 - gy - 32) / 8) - 1, r1 = Math.ceil((ch - gy - 32) / 8) + 1;
  for (let r = r0; r <= r1; r++) {
    const y = gy + 32 + r * 8, ry = 32 + r * 8, off = ((ry / 8) % 2 + 2) % 2 ? 12 : 0;
    for (let i = Math.floor(-gx / 24) - 2; i * 24 + gx < cw + 24; i++) {
      const rx = i * 24, x = gx + rx - off;
      R(x, y, 24, 8, ((((rx + off + ry) / 8) % 3) + 3) % 3 === 0 ? "#c99b6a" : "#d4a774");
      R(x, y + 7, 24, 1, "#b88a5c"); R(x + 23, y, 1, 8, "#b88a5c");
    }
  }
  // 壁（ゲームの壁と同じ高さでつながる）
  R(0, 0, cw, gy + 20, "#f1dfc3");
  for (let x = ((gx + 2) % 6 + 6) % 6; x < cw; x += 6) R(x, gy, 1, 12, "rgba(201,167,127,.25)");
  R(0, gy + 12, cw, 6, "#d9b98a"); R(0, gy + 12, cw, 1, "#b88a5c"); R(0, gy + 18, cw, 2, "#a8734d");
  R(0, gy + 20, cw, 12, "#e6cfa6"); R(0, gy + 30, cw, 2, "rgba(0,0,0,.12)");
  if (gy > 0) R(0, 0, cw, Math.min(gy, 4), "rgba(0,0,0,.08)");
}
window.addEventListener("resize", fitStage);
window.addEventListener("orientationchange", () => setTimeout(fitStage, 200));
if (window.ResizeObserver) new ResizeObserver(fitStage).observe($("stagebox"));
try { if (localStorage.getItem("nekocafe-fold")) setFold(true); } catch (e) {}
fitStage();
$("viewBtn").onclick = () => setView(view === "home" ? "shop" : "home");
$("saveBtn").onclick = () => { saveArmed = null; save(); openSave(); };
$("pause").onclick = () => { paused = !paused; renderHud(); };
// 床を張る（タップ・なぞる）
function paintAt(p) {
  const c = Math.floor(p.x / CELL), r = Math.floor((p.y - 32) / CELL);
  if (p.y < 32 || c < 0 || c * CELL >= W) return;
  const key = `${c},${r}`, cur = (S.floor || {})[key] || "wood";
  if (cur === paintStyle) return;
  if (inLocked(c * CELL, 32 + r * CELL, CELL, CELL)) return;
  const cost = FLOORS[paintStyle].tile;
  if (S.money < cost) { addLog("お金が足りなくて張れません。"); paintStyle = null; return renderAll(); }
  S.money -= cost;
  const fl = { ...(S.floor || {}) };
  if (paintStyle === "wood") delete fl[key]; else fl[key] = paintStyle;
  S.floor = fl;
}
let painting = false;
cv.addEventListener("pointerdown", e => { if (!paintStyle) return; painting = true; paintAt(canvasPos(e)); renderHud(); });
cv.addEventListener("pointermove", e => { if (paintStyle && painting) { paintAt(canvasPos(e)); renderHud(); } });
window.addEventListener("pointerup", () => { if (painting) { painting = false; save(); renderAll(); } });
cv.addEventListener("click", e => {
  const p = canvasPos(e);
  if (view === "home") { selected = homeHit(p); $("info").className = "win " + (p.x < W / 2 ? "right" : "left"); renderInfo(); return; }
  if (paintStyle) return;
  if (layoutMode) return layoutClick(p);
  selected = hitTest(p);
  $("info").className = "win " + (p.x < W / 2 ? "right" : "left");
  renderInfo();
});
$("info").addEventListener("change", e => {
  if (e.target.dataset.equip) equip(e.target.dataset.equip, e.target.value);
  if (e.target.dataset.gear) { equipSlot("gear", S.gear, e.target.dataset.gear, e.target.value || null); save(); renderAll(); }
  $("info")._html = ""; renderInfo();
});
$("info").addEventListener("click", e => {
  const k = e.target.closest("[data-kind]");
  if (k && !k.disabled) { act(k.dataset.kind, k.dataset.id); $("info")._html = ""; renderInfo(); return; }
  const b = e.target.closest("[data-fact]");
  if (!b) return;
  if (b.dataset.fact === "train") {   // 猫タブの、その猫のところを開く
    const id = b.dataset.id;
    if ($("drawer").hidden || tab !== "cats") openDrawer("cats");
    subSel.cats = "うちの猫"; applySub();
    const card = document.getElementById("card-" + id);
    if (card) { card.scrollIntoView({ block: "start" }); card.style.outline = "3px solid var(--pink)"; setTimeout(() => card.style.outline = "", 1500); }
    return;
  }
  const id = b.dataset.id, it = itemData(id);
  if (b.dataset.fact === "move") {
    paintStyle = null; layoutMode = true; layoutSel = id; selected = null; closeDrawer(); if (view !== "shop") setView("shop");
    addLog(`「${it.name}」を動かす：置きたい場所をタップしてね。終わったら「模様替えを終わる」。`);
  } else if (b.dataset.fact === "store") {
    S.items = S.items.filter(x => x !== id);
    S.stored = [...(S.stored || []), id];
    S.cats.forEach(c => { if (c.fplay && c.fplay.id === id) c.fplay = null; });
    selected = null;
    addLog(`${it.name}を倉庫にしまった。（「お店」タブから無料で出せます）`);
  } else if (b.dataset.fact === "repair") {
    if (!S.broken.includes(id) || !pay(repairCost(id))) return;
    S.broken = S.broken.filter(x => x !== id); addLog(`${it.name}を修理した！`);
  }
  save(); renderAll(); renderInfo();
});
cv.addEventListener("mousemove", e => { cv.style.cursor = view === "home" ? (homeHit(canvasPos(e)) ? "pointer" : "default") : layoutMode || paintStyle || hitTest(canvasPos(e)) ? "pointer" : "default"; });
$("reset").onclick = () => {
  if (!resetArmed) {
    resetArmed = true; $("reset").textContent = "本当にやり直す？（もう一度押す）";
    setTimeout(() => { resetArmed = false; $("reset").textContent = "最初からやり直す"; }, 3000);
    return;
  }
  S = newGame(); startMonth(false); guests = []; modalQueue = [];
  resetArmed = false; $("reset").textContent = "最初からやり直す";
  save(); renderAll(); chooseStarter();
};

// ---------- 古いセーブを今のゲームに合わせる ----------
function migrate() {
S.unlockedCats = S.unlockedCats || CATS.filter(c => c.starter).map(c => c.id);
S.met = S.met || S.cats.map(c => c.id);
if (S.bestPlace === undefined) S.bestPlace = S.lastRank ? S.lastRank.place : null;
S.cats = S.cats.filter(c => catData(c.id));
if (S.cats.length && !S.cats.some(c => "duty" in c)) S.cats.forEach((c, i) => c.duty = i < CAT_CAP[(S.expand || 1) - 1]);
{ // メニューが出せる数より多ければ、安いものからしまう
  const on = Object.keys(S.menus).filter(id => S.menus[id].on).sort((a, b) => menuData(b).price - menuData(a).price);
  on.slice(MENU_SLOTS[(S.expand || 1) - 1]).forEach(id => S.menus[id].on = false);
}
S.gear = S.gear || [];
S.broken = S.broken || [];
S.mats = S.mats || {}; S.areas = S.areas || ["shotengai"]; S.town = S.town || { shotengai: CONFIG.safetyStart };
S.cats.forEach(c => { c.bLv = Math.min(c.bLv || 1, maxBLv(c)); c.bxp = c.bxp || 0; c.lv = Math.min(c.lv, maxLv(c)); });
S.seasonWins = S.seasonWins || [];
S.goals = S.goals || {}; S.stored = S.stored || []; S.ach = S.ach || []; S.home = S.home || [];
S.stat = S.stat || { kills: S.cats.reduce((n, c) => n + (c.kills || 0), 0) };
S.townLv = S.townLv || {}; S.patrolWeek = S.patrolWeek || 0;
if (S.tick >= TICKS_PER_DAY) { S.day++; S.tick = 0; S.today = newDayStats(); }
if (S.dev && S.dev.left <= 0) S.dev.left = 1;
if (!S.weather) makeForecast();
}

// ---------- スタート ----------
S = load();
if (!S) { S = newGame(); startMonth(false); }
migrate();
applyTablePos();
renderAll();
if (!S.cats.length) chooseStarter();
// ゲームの速さ（1コマの間かくと、動きの速さがいっしょに変わる）
let gameSpeed = 1, tickTimer = null;
function setSpeed(v) {
  gameSpeed = v; clearInterval(tickTimer); tickTimer = setInterval(tick, CONFIG.tickMs / v);
  S.gameSpeed = v; $("speedSel").value = String(v);
}
$("speedSel").onchange = e => { setSpeed(+e.target.value); save(); };
setSpeed(S.gameSpeed || 1);
requestAnimationFrame(frame);
</script>
