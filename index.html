<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ねこカフェ">
<meta name="theme-color" content="#8cc7a1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>ねこカフェ物語</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
:root{
  --sky:#8cc7a1; --navy:#253561; --title:#4467c9; --paper:#fff8e6; --paper2:#f3e6c4;
  --ink:#2a2433; --muted:#7b6f63; --yellow:#ffd54a; --pink:#ff7aa2; --good:#2f9a4f; --bad:#d14b3f; --gold:#e3a21a;
  --font:"DotGothic16","Hiragino Sans","Yu Gothic",monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{height:100%;overflow:hidden}
body{touch-action:manipulation;-webkit-tap-highlight-color:transparent;margin:0;background:var(--sky);background-image:radial-gradient(rgba(255,255,255,.18) 1px,transparent 1px);background-size:12px 12px;color:var(--ink);font-family:var(--font);font-size:15px}
.app{position:fixed;inset:0;display:flex;gap:0;background:#d4a774;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.side{display:flex;flex-direction:column;gap:2px;padding:2px;width:64px;flex:none;overflow-y:auto;background:var(--navy)}
.side .tab{flex:1 1 0;min-height:30px;max-height:58px;padding:2px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;font-size:11px}
.side .tab i{font-style:normal;font-size:17px}
.fold{flex:none;font-family:var(--font);font-size:14px;padding:4px 0;border:3px solid var(--navy);border-radius:6px;background:#fff;color:var(--navy);cursor:pointer}
.app.folded .side{width:30px}
.app.folded .side .tab{display:none}
.app.folded .fold{flex:1}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:0}
.stagebox{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
#bgc{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;z-index:0}
.main>.chipsline{padding:4px 6px;background:var(--paper2);border-bottom:2px solid var(--navy)}
.drawer{position:absolute;left:0;top:0;bottom:0;width:min(340px,46%);font-size:13px;display:flex;flex-direction:column;z-index:6;border-width:0 3px 0 0;border-radius:0;box-shadow:4px 0 0 rgba(37,53,97,.35)}
.drawer>.tt{display:flex;justify-content:space-between;align-items:center}
.drawer .x{font-family:var(--font);background:none;border:0;color:#fff;font-size:18px;cursor:pointer;padding:0 4px}
.subnav{display:flex;flex-wrap:wrap;gap:4px;padding:6px 8px;border-bottom:3px solid var(--navy);background:var(--paper2);flex:none}
.sub{font-family:var(--font);font-size:12px;padding:4px 8px;border:2px solid var(--navy);border-radius:12px;background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap}
.sub.on{background:var(--yellow)}
.catpic{image-rendering:pixelated;flex:none;background:#fff8e6;border:2px solid var(--navy);border-radius:6px;vertical-align:middle}
.catcard .hd{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.grp.acc{gap:0;border:2px solid var(--navy);border-radius:6px;background:var(--paper);overflow:hidden;flex:none}
.grp.acc>h3{cursor:pointer;padding:9px 10px;background:#fff;color:var(--ink);font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:6px;-webkit-user-select:none;user-select:none}
.grp.acc>h3::after{content:"▼";font-size:11px;color:var(--title);flex:none}
.grp.acc.closed>h3::after{content:"▶"}
.grp.acc:not(.closed)>h3{background:var(--yellow);border-bottom:2px solid var(--navy)}
.grp.acc:not(.closed){display:flex;flex-direction:column;gap:6px;padding-bottom:6px}
.grp.acc:not(.closed)>:not(h3){margin:0 6px}
.grp.acc.closed>:not(h3){display:none!important}
#sysPane{flex:1;min-height:0;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:14px}
#logPane{flex:1;min-height:0;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:12px}
#ticker{position:absolute;left:6px;right:6px;bottom:4px;font-size:12px;line-height:1.35;background:rgba(255,248,230,.88);border:2px solid var(--navy);border-radius:4px;padding:1px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#ticker:empty{display:none}
#modeBtn{position:absolute;right:6px;top:6px;z-index:3;line-height:1.2}
.win{background:var(--paper);border:3px solid var(--navy);border-radius:6px;box-shadow:0 4px 0 rgba(37,53,97,.35)}
.win>.tt{background:var(--title);color:#fff;padding:3px 10px;font-size:14px;border-bottom:3px solid var(--navy)}
.win>.bd{padding:10px 12px}
.hud{display:flex;flex-wrap:nowrap;gap:6px 16px;align-items:center;padding:3px 10px;overflow-x:auto;flex:none;white-space:nowrap;border-width:0 0 3px 0;border-radius:0;box-shadow:none}
.hud .t{font-size:17px}
.hud .lb{font-size:12px;color:var(--muted)}
.hud .sp{flex:1}
.chipsline{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;flex:none;white-space:nowrap;scrollbar-width:none}
.chipsline::-webkit-scrollbar{display:none}
.chipsline:empty{display:none}
.tag{font-size:12px;background:#fff;border:2px solid var(--navy);border-radius:12px;padding:1px 8px}
.tag.ev{background:#ffe0ec}.tag.boom{background:#fff1b8}.tag.ad{background:#d9ecff}
.stars{color:var(--gold);letter-spacing:1px}
.stage{position:relative;line-height:0;overflow:hidden;flex:none;z-index:1}
canvas{-webkit-user-select:none;user-select:none;width:100%;height:auto;image-rendering:pixelated;display:block}
#cv{height:100%}
#fx{position:absolute;inset:0;pointer-events:none;line-height:1.2}
.pop{position:absolute;transform:translate(-50%,-100%);font-size:13px;font-weight:700;white-space:nowrap;text-shadow:1px 1px 0 #fff,-1px 1px 0 #fff,1px -1px 0 #fff,-1px -1px 0 #fff;animation:up 1.2s ease-out forwards}
.pop.money{color:#b07400}.pop.heart{color:var(--pink)}.pop.zz{color:#5a6bb0}.pop.lv{color:var(--good);font-size:15px}.pop.bad{color:var(--bad)}.pop.like{color:#d05a00}
@keyframes up{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-26px}}
.tab{font-family:var(--font);font-size:14px;padding:5px 0;border:3px solid var(--navy);border-radius:6px;background:var(--paper2);color:var(--ink);cursor:pointer}
.tab.on{background:var(--yellow)}
#panel{flex:1;min-height:0;padding:8px 8px;overflow:auto;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.drawer .row{padding:5px 6px;gap:6px}
.drawer .row .nm{flex:1 1 130px}
.drawer .btn{font-size:12px;padding:4px 8px}
.drawer .note{font-size:12px}
.more-help{font-size:11px;color:var(--title)}
.help p{margin:0;font-size:13px;line-height:1.6}
.help ul{margin:0;padding-left:18px;font-size:13px;line-height:1.6}
h3{margin:0;font-size:14px;color:var(--title);font-weight:400}
.grp{display:flex;flex-direction:column;gap:6px}
.row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px;background:#fff;border:2px solid var(--paper2);border-radius:4px}
.row .nm{min-width:0;flex:1 1 170px}
.row .btn small{white-space:normal}
.row small{display:block;color:var(--muted);font-size:12px}
.row.done{border-color:#bfe3c8;background:#f2fbf4}
.row.locked{background:#f1ede4;color:var(--muted)}
.btn{font-family:var(--font);font-size:13px;padding:5px 10px;border:2px solid var(--navy);border-radius:4px;background:var(--yellow);color:var(--ink);cursor:pointer;white-space:nowrap;box-shadow:0 2px 0 var(--navy)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.off{background:#ddd}
.btn.big{font-size:16px;padding:8px 18px}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,select:focus-visible,.pick:focus-visible{outline:3px solid var(--pink);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--font);font-size:13px;padding:4px 8px;border:2px solid var(--navy);border-radius:14px;background:#fff;color:var(--ink);cursor:pointer}
.chip:disabled{opacity:.45;cursor:not-allowed;background:#eee}
.chip.sel{background:var(--pink);color:#fff}
.bar{height:8px;background:#e6dcc4;border:1px solid var(--navy);border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--title)}
.bar.fan>i{background:var(--pink)}
.catcard{background:#fff;border:2px solid var(--paper2);border-radius:4px;padding:8px;display:flex;flex-direction:column;gap:5px}
.catcard .hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sk{display:inline-block;font-size:12px;background:var(--paper2);border-radius:3px;padding:1px 6px;margin:0 4px 2px 0}
.line{display:flex;gap:6px;align-items:center}
select{font-family:var(--font);font-size:13px;padding:3px;border:2px solid var(--navy);border-radius:4px;background:#fff;color:var(--ink);min-width:0;flex:1}
.note{font-size:12px;color:var(--muted)}
.log{list-style:none;margin:0;padding:0;font-size:13px;display:flex;flex-direction:column;gap:2px}
.log li{color:var(--muted)}.log li:first-child{color:var(--ink)}
.plus{color:var(--good)}.minus{color:var(--bad)}
.modal{position:fixed;inset:0;background:rgba(20,25,50,.55);display:grid;place-items:center;padding:16px;z-index:10}
.modal .win{max-width:400px;width:100%;max-height:90vh;overflow:auto}
.modal .bd{display:flex;flex-direction:column;gap:10px}
table{width:100%;border-collapse:collapse}
td{padding:4px 0;border-bottom:1px dashed var(--paper2)}
td:last-child{text-align:right}
tr.me td{color:var(--title);font-weight:700}
.bigemoji{font-size:44px;text-align:center;line-height:1.2}
.pick{display:flex;gap:10px;align-items:center;width:100%;text-align:left;font-family:var(--font);color:var(--ink);cursor:pointer;padding:6px 8px;background:#fff;border:2px solid var(--paper2);border-radius:4px}
.pick:hover{border-color:var(--title)}
#info{position:absolute;top:8px;width:min(230px,62%);line-height:1.4;z-index:2;font-size:13px}
#info.left{left:8px}#info.right{right:8px}
#info .bd{padding:8px 10px;display:flex;flex-direction:column;gap:5px}
#info .tt{display:flex;justify-content:space-between;align-items:center}
#info .x{font-family:var(--font);background:none;border:0;color:#fff;font-size:16px;cursor:pointer;padding:0 2px}
#info td{padding:2px 0;font-size:12px}
#battle{padding:0;display:block;background:var(--navy)}
#battle .win{max-width:none;width:100%;height:100%;max-height:none;border:0;border-radius:0;box-shadow:none;display:flex;flex-direction:column;overflow:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#battle .bfull{flex:1;min-height:0;display:flex;flex-direction:row;gap:0;padding:0}
#battle .bside{width:min(300px,34%);flex:none;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:6px;border-right:3px solid var(--navy);font-size:13px}
#battle .bside .chip,#battle .bside .btn{font-size:12px}
#battle .bmain{flex:1;min-width:0;display:flex;flex-direction:column}
#battle .bhud{padding:3px 8px;background:var(--paper2);border-bottom:2px solid var(--navy);flex:none}
#battle .bbox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#5d6b4f}
.bstage{position:relative;line-height:0;overflow:hidden;flex:none}
#bResult:empty,#bAdvice:empty,#bHelp:empty,#bSpecials:empty,#bBtns:empty{display:none}
@media (orientation:portrait){#battle .bfull{flex-direction:column-reverse}#battle .bside{width:auto;max-height:45%;border-right:0;border-top:3px solid var(--navy)}}
#bcv{width:100%;height:100%;image-rendering:pixelated;display:block;-webkit-user-select:none;user-select:none}
#bfx{position:absolute;inset:0;pointer-events:none;line-height:1.2;overflow:hidden}
#bbanner{position:absolute;left:0;right:0;top:38%;text-align:center;font-size:26px;line-height:1.2;color:#fff;pointer-events:none;opacity:0;transition:opacity .25s;
  text-shadow:2px 2px 0 #253561,-2px 2px 0 #253561,2px -2px 0 #253561,-2px -2px 0 #253561,0 3px 0 #253561}
#bbanner.show{opacity:1}
.pop.dmg{color:#fff;font-size:12px;text-shadow:1px 1px 0 #253561,-1px 1px 0 #253561,1px -1px 0 #253561,-1px -1px 0 #253561}
.pop.crit{color:#ffe14a;font-size:16px;text-shadow:1px 1px 0 #a8325a,-1px 1px 0 #a8325a,1px -1px 0 #a8325a,-1px -1px 0 #a8325a}
.pop.stun{color:#ffd54a;font-size:11px;text-shadow:1px 1px 0 #253561,-1px 1px 0 #253561,1px -1px 0 #253561,-1px -1px 0 #253561}
.bhud{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:14px}
.chip.placed{background:var(--paper2)}
.mats{display:flex;flex-wrap:wrap;gap:6px}
.mat{font-size:13px;background:#fff;border:2px solid var(--paper2);border-radius:4px;padding:2px 8px}
.bar.safe>i{background:var(--good)}.bar.warn>i{background:var(--gold)}.bar.danger>i{background:var(--bad)}
.tag.town{background:#dff3e3}.tag.town.bad{background:#ffd9d4}
.rk{display:inline-block;font-size:11px;line-height:1;padding:2px 4px;border-radius:3px;margin-right:4px;vertical-align:1px;color:#fff;letter-spacing:-1px}
.rk.r1{background:#9a948c}.rk.r2{background:#3c9a5f}.rk.r3{background:#3d6fd1}.rk.r4{background:#9152c9}.rk.r5{background:linear-gradient(90deg,#e3a21a,#ff7aa2,#e3a21a)}
.twostat{display:flex;gap:6px;flex-wrap:wrap}
.st2{display:inline-flex;align-items:baseline;gap:4px;border-radius:4px;padding:2px 8px;font-size:13px}
.st2 b{font-size:17px}
.st2.heal{background:#ffe3ec;color:#a8325a}.st2.pow{background:#e1e9ff;color:#2f4fa8}
details.more{font-size:12px}
details.more summary{cursor:pointer;color:var(--title)}
details.more table td{font-size:12px;padding:2px 0}
.sp-btn{font-family:var(--font);font-size:12px;padding:4px 8px;border:2px solid var(--navy);border-radius:6px;background:#eee;color:var(--ink);cursor:pointer;position:relative;overflow:hidden;min-width:96px;text-align:left}
.sp-btn i{position:absolute;left:0;top:0;bottom:0;background:rgba(255,213,74,.55);z-index:0}
.sp-btn span{position:relative;z-index:1}
.sp-btn[aria-disabled]{cursor:default}
.sp-btn .sp-desc{font-size:11px;opacity:.85}
.sp-btn:hover,.sp-btn:focus-visible{outline:3px solid var(--pink);outline-offset:1px}
.sp-btn.ready{background:linear-gradient(90deg,#ff7aa2,#ffd54a);color:#fff;text-shadow:1px 1px 0 #a8325a;animation:pulse .8s infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.05)}}
#bAdvice .adv{border:2px solid var(--navy);border-radius:6px;padding:6px 10px;font-size:13px;line-height:1.5;background:#fff}
#bAdvice .adv b{font-size:15px}
#bAdvice .adv.g1{background:#e3f6e8}#bAdvice .adv.g2{background:#eef8e0}#bAdvice .adv.g3{background:#fff6d6}#bAdvice .adv.g4{background:#ffe7d6}#bAdvice .adv.g5{background:#ffdcdc}
[hidden]{display:none!important}
@media (max-width:760px),(max-height:520px){
  .hud .t{display:none}
  .hud{gap:4px 12px;font-size:13px}
  .hud .lb{font-size:10px}
  .hud .btn{padding:3px 8px;font-size:12px}
  .tag{font-size:11px}
  .drawer{width:min(320px,52%)}
  .btn{padding:6px 10px}
  .chip{padding:6px 9px}
  select{padding:5px 4px;font-size:16px}
  #info{width:min(230px,60%);max-height:calc(100% - 16px);overflow:auto}
  .modal{padding:8px}
  .modal .win{max-height:calc(100dvh - 16px)}
}
@media (max-height:420px){
  .side .tab span{font-size:9px}
  .side .tab i{font-size:14px}
  #ticker{font-size:11px}
}
@media (prefers-reduced-motion:reduce){.pop{animation-duration:.01s}}
</style>
</head>
<body>
<div class="app" id="app">
  <nav class="side" id="side" aria-label="メニュー">
    <button class="tab" data-tab="shop" title="お店"><i>🏠</i><span>お店</span></button>
    <button class="tab" data-tab="cats" title="猫"><i>🐈</i><span>猫</span></button>
    <button class="tab" data-tab="menu" title="メニュー"><i>🍰</i><span>メニュー</span></button>
    <button class="tab" data-tab="dev" title="開発"><i>🧪</i><span>開発</span></button>
    <button class="tab" data-tab="store" title="ショップ"><i>🛒</i><span>ショップ</span></button>
    <button class="tab" data-tab="guests" title="お客さん"><i>🙋</i><span>お客さん</span></button>
    <button class="tab" data-tab="town" title="パトロール"><i>🛡️</i><span>パトロール</span></button>
    <button class="tab" data-tab="info" title="情報"><i>📊</i><span>情報</span></button>
    <button class="tab" data-tab="help" title="説明"><i>❓</i><span>説明</span></button>
    <button class="tab" data-tab="sys" title="機能"><i>⚙️</i><span>機能</span></button>
    <button class="tab" data-tab="log" title="できごと"><i>📜</i><span>できごと</span></button>
    <button class="fold" id="fold" aria-label="メニューをたたむ" title="たたむ">◀</button>
  </nav>
  <div class="main">
    <div class="win hud">
      <div class="t">🐾 ねこカフェ物語</div>
      <div><div class="lb">カレンダー</div><div id="day"></div></div>
      <div><div class="lb">お金</div><div id="money"></div></div>
      <div><div class="lb">人気 <span id="popNum"></span></div><div class="stars" id="stars"></div></div>
      <div id="devBox" hidden style="min-width:110px"><div class="lb">🧪 開発中…</div><div class="bar"><i id="devBar"></i></div></div>
      <div class="sp"></div>
      <button class="btn" id="viewBtn">🏡 おうちへ</button>
      <button class="btn" id="pause">一時停止</button>
    </div>
    <div class="chipsline" id="chips"></div>
    <div class="stagebox" id="stagebox">
      <canvas id="bgc" width="1" height="1" aria-hidden="true"></canvas>
      <div class="stage" id="stage"><canvas id="cv" width="256" height="196"></canvas><div id="fx"></div><div id="ticker"></div><button class="btn" id="modeBtn" hidden></button><div id="info" class="win" hidden></div></div>
      <div class="drawer win" id="drawer" hidden>
        <div class="tt"><span id="drawerTitle"></span><button class="x" id="drawerClose" aria-label="閉じる">×</button></div>
        <div class="subnav" id="subnav" hidden></div>
        <div id="panel"></div>
        <div id="logPane" hidden><ul class="log" id="log"></ul></div>
        <div id="sysPane" hidden>
          <div class="grp"><h3>■ ⏩ ゲームの速さ</h3>
            <select id="speedSel" aria-label="ゲームの速さ" style="font-size:16px"><option value="0.5">ゆっくり ×0.5</option><option value="1" selected>ふつう ×1</option><option value="2">はやい ×2</option><option value="3">とてもはやい ×3</option></select>
            <div class="note">1週間はふつうで約1分です。一時停止は上のボタンでできます。</div></div>
          <div class="grp"><h3>■ 💾 セーブ・ロード</h3>
            <button class="btn" id="saveBtn">💾 セーブ・ロードを開く</button>
            <div class="note">ふだんは自動でセーブされています。別のスロットに残したり、データを書き出して別の端末に移したりできます。</div></div>
          <div class="grp"><h3>■ 🔄 最初からやり直す</h3>
            <div><button class="btn off" id="reset">最初からやり直す</button></div>
            <div class="note">今のお店は消えてしまいます（セーブのスロットに残しておくと安心です）。</div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="battle" hidden><div class="win"><div class="tt" id="bTitle"></div><div class="bd bfull">
  <div class="bside">
    <div id="bResult"></div>
    <div class="line" id="bBtns" style="flex-wrap:wrap"></div>
    <div class="chips" id="bSpecials"></div>

const BIG_WEATHER = { summer: "typhoon", autumn: "typhoon", winter: "heavysnow" };
const BIG_WEATHER_CHANCE = 0.12;
const seasonOf = m => m >= 3 && m <= 5 ? "spring" : m >= 6 && m <= 8 ? "summer" : m >= 9 && m <= 11 ? "autumn" : "winter";
function makeForecast() {   // 1週間（7日分）の天気
  const tbl = WEATHER_TABLE[seasonOf(month())], total = Object.values(tbl).reduce((a, b) => a + b, 0);
  S.weather = Array.from({ length: 7 }, () => { let r = Math.random() * total; for (const [k, v] of Object.entries(tbl)) { if ((r -= v) <= 0) return k; } return "cloudy"; });
  const se = seasonOf(month()), key = `${year()}-${se}`, big = BIG_WEATHER[se];
  if (big && S.bigWeather !== key && Math.random() < BIG_WEATHER_CHANCE) { S.weather[Math.floor(Math.random() * 7)] = big; S.bigWeather = key; }
}

const weeksPerYear = () => CONFIG.weeksPerMonth * 12;
const yearIdx = () => Math.floor((S.day - 1) / weeksPerYear());
const yearProgress = () => (((S.day - 1) % weeksPerYear()) + S.tick / TICKS_PER_DAY) / weeksPerYear();
function yearRanking(key, progress) {
  const g = (1 + CONFIG.yearRivalGrowth * yearIdx() * CONFIG.rivalGrowth) * loopMul(CONFIG.ngRival);
  let seed = yearIdx() * 31 + (key === "heal" ? 7 : 13);
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const rivals = YEAR_RIVALS.map(r => ({ name: r.name, shop: r.shop, v: Math.round(r[key] * g * (0.85 + rnd() * 0.3) * progress) }));
  const mine = S.cats.map(c => ({ id: c.id, name: nameOf(c.id), shop: "うちの店", v: Math.round(key === "heal" ? c.yHeal || 0 : c.yKills || 0), me: true }));
  return [...mine, ...rivals].sort((a, b) => b.v - a.v);
}
function yearAward() {
  const res = [["heal", "💗 癒し部門（満足をかせいだ猫）"], ["kill", "⚔️ 討伐部門（敵を倒した猫）"]].map(([key, title]) => ({ key, title, list: yearRanking(key, 1) }));

  res.forEach(r => {
    const myIdx = r.list.findIndex(x => x.me);
    html += `<div><b>${r.title}</b></div><table>${r.list.slice(0, 5).map((x, i) => `<tr class="${x.me ? "me" : ""}"><td>${i + 1}位　${x.name}<small class="note">（${x.shop}）</small></td><td>${x.v}</td></tr>`).join("")}</table>`;
    if (myIdx >= 5) html += `<div class="note">うちの最高位：${myIdx + 1}位 ${r.list[myIdx].name}（${r.list[myIdx].v}）</div>`;
    const prize = YEAR_PRIZES[myIdx];
    if (prize) {
      S.money += prize.money; S.pop = Math.min(CONFIG.goalPopularity, S.pop + prize.pop);
      got.push(`${r.title.split("（")[0]}で${r.list[myIdx].name}が${myIdx + 1}位！ 賞金${yen(prize.money)}・人気+${prize.pop}`);

  });
  addLog(got.length ? `年間ねこ大賞：${got.join(" ")}` : "年間ねこ大賞：今年は入賞できなかった…。来年こそ！");

}

function tick() {
  if (paused || layoutMode || paintStyle || !$("modal").hidden || !$("saveModal").hidden || !S.cats.length || BT) return;
  if (S.today.popStart === null) S.today.popStart = S.pop;
  S.tick++;

  // 1. 座っているお客さんの時間を進める
  guests.forEach(g => { if (g.state === "seated" && --g.left <= 0) leave(g); });

  // 2. 新しいお客さん
  const maneki = dutyCats().filter(c => !c.sleeping && c.skills.includes("maneki")).length;
  const crown = dutyCats().reduce((s, c) => s + (c.acc ? accData(c.acc).chance || 0 : 0) + (c.sleeping ? 0 : catData(c.id).chance || 0), 0);
  const chance = CONFIG.customerChance + S.pop * CONFIG.popularityBonus + eff("chance") + maneki * 0.05 + crown
    + (event().chance || 0) + (adData()?.chance || 0) + (weekday() >= 5 ? CONFIG.weekendBonus : 0)
    ;
  if (Math.random() < Math.min(0.95, chance * safetyFactor() * avgSatFactor() * todayWeather().mult)) arrive();

  // 台風の日は、街が荒れて安全度が下がる（その日の最初に1回）
  const dayLen = TICKS_PER_DAY / 7;
  if ((S.weather || [])[weekday()] === "typhoon" && (S.tick === 1 || Math.floor((S.tick - 1) / dayLen) !== weekday())) {
    S.areas.forEach(id => S.town[id] = Math.max(0, S.town[id] - 5));
    addLog("🌀 台風で街が荒れた…。すべての地区の安全度-5");
  }

  // 3. 荒らし（街の安全度が低いと来る）
  const avg = townAvg();
  if (!raider && (S.today.raids || 0) < CONFIG.raidMax && avg < CONFIG.raidSafety && S.tick < TICKS_PER_DAY - 10
      && Math.random() < (CONFIG.raidSafety - avg) * CONFIG.raidRate) startRaid();
  if (raider) raidTick();

  // 4. 猫たち
  dutyCats().forEach(catTick);
  startPlay();
  startFurnPlay();
  // おやすみ中の猫はおうちで回復
  S.cats.filter(c => !c.duty).forEach(c => { c.energy = Math.min(catMax(c), c.energy + 2); if (c.energy >= catMax(c)) c.sleeping = false; });

  // 5. メニュー開発
  if (S.dev && --S.dev.left <= 0) finishDev();

  // 6. 閉店
  if (S.tick >= TICKS_PER_DAY) endDay();
  checkNewCats();
  checkNewAreas();
  checkGuestArrivals();
  checkClear();
  checkAchievements();
  renderHud(); renderPanel(); renderInfo();
}

function pickType() {
  const boost = { ...(event().boost || {}) };
  const ad = adData();
  if (ad && ad.boost) Object.entries(ad.boost).forEach(([k, v]) => boost[k] = (boost[k] || 1) * v);
  const list = S.known.map(id => ({ id, w: typeData(id).weight * (boost[id] || 1) * typeFactor(id) * satFactor(id) }));
  let r = Math.random() * list.reduce((s, x) => s + x.w, 0);
  for (const x of list) { if ((r -= x.w) <= 0) return x.id; }
  return list[0].id;
}

  const free = openSeats().filter(i => !taken.includes(i));
  if (!free.length) {
    S.today.turnedAway++;
    if (Math.random() < CONFIG.turnAwayPenalty) { S.pop = Math.max(0, S.pop - 1); fx(DOOR.x, H - 10, "満席…人気-1", "bad"); }
    return;
  }
  // 荒らしがいる間は、入口で引き返すお客さんも
  if (raider && raider.state !== "out" && Math.random() < 0.6) { fx(DOOR.x, DOOR.y - 14, "荒らしがいる…", "bad"); S.today.fled = (S.today.fled || 0) + 1; return; }
  // お客さんの種類を決めて、好きな雰囲気の床の席があればそこに座りたがる
  const preType = pickType();
  const zone = typeData(preType).zone;
  const zoneSeats = free.filter(i => seatZone(i) === zone);
  const seat = zoneSeats.length && Math.random() < CONFIG.zoneSeatChance ? pick(zoneSeats) : pick(free);
  const type = preType, T = typeData(type);
  const onSale = Object.keys(S.menus).filter(id => S.menus[id].on);
  const liked = onSale.filter(id => T.likes.includes(id));
  let menu;
  if (S.boom && onSale.includes(S.boom) && Math.random() < 0.4) menu = S.boom;
  else if (liked.length && Math.random() < 0.7) menu = pick(liked);
  else menu = pick(onSale);
  const s = SEATS[seat];
  guests.push({
    id: ++guestId, seat, type, state: "in", menu,
    liked: T.likes.includes(menu), boom: menu === S.boom,
    stay: 0, left: 0, heal: 0, extra: false, fed: false,
    x: DOOR.x, y: DOOR.y, path: [{ x: DOOR.x, y: s.y + 14 }, { x: s.x, y: s.y + 14 }, { x: s.x, y: s.y }],
    look: { hair: pick(T.look.hair), shirt: pick(T.look.shirt), skin: pick(["#f6d7bd", "#ecc3a0", "#d9a77f"]) },
  });
}

function guestPrice(g) {
  return Math.round(menuPrice(g.menu) * typeData(g.type).pay * (g.boom ? 1.5 : 1) * (1 + (event().sales || 0) + eff("sales")) / 10) * 10;
}

function sitDown(g) {
  g.state = "seated";
  if (g.type === "vet") dutyCats().filter(c => c.sleeping && inBed(c)).forEach(c => { c.energy = Math.min(catMax(c), c.energy + 3); if (c.energy >= catMax(c)) c.sleeping = false; });   // 寝ている猫をみてくれる
  const ch = chairOf(g.seat);
  g.chairSat = chairSat(g);
  g.stay = g.left = Math.max(2, rand(CONFIG.stayMin, CONFIG.stayMax) + typeData(g.type).stay + eff("stay") + (ch ? ch.stay : -1) + todayWeather().stay);
  const p = guestPrice(g);
  S.money += p; S.today.visitors++; S.today.sales += p; S.monthSales += p; S.totalGuests++;
  fx(g.x, g.y - 12, yen(p), "money");
  if (g.liked) setTimeout(() => fx(g.x, g.y - 18, "好物！", "like"), 300);
}

function leave(g) {
  const total = score(g), T = typeData(g.type);
  let delta, msg, fan = 0;
  if (g.heal === 0)                { delta = -1; msg = "猫に会えなかった…"; }
  else if (total >= greatOf(g.type)) {
    delta = Math.max(1, Math.round((T.popGreat || 2) * CONFIG.popGain)); msg = "最高に癒やされた！"; fan = 1; addStat("great");
  }
  else if (total >= goodOf()) { delta = Math.random() < CONFIG.goodPopChance ? 1 : 0; msg = "また来たいな"; fan = Math.random() < CONFIG.goodFanChance ? 1 : 0; }
  else                             { delta = 0; msg = "もっと猫と遊びたかった"; }
  S.pop = Math.max(0, Math.min(CONFIG.goalPopularity, S.pop + delta));
  if (delta > 0) fx(g.x, g.y - 14, "人気+" + delta, "heart");
  if (delta < 0) fx(g.x, g.y - 14, "人気-1", "bad");
  if (delta >= 5) addLog(`${T.name}さんが大絶賛！ 人気+${delta}`);
  else if (delta !== 0 && Math.random() < 0.4) addLog(`${T.name}さん「${msg}」`);
  if (S.pop >= CONFIG.goalPopularity) S.cleared = true;
  if (fan) addFan(g.type, fan);
  // お客さんの種類ごとの満足度（よかったら上がり、残念だと下がる）
  const ts = { ...(S.typeSat || {}) };
  const cur = ts[g.type] ?? 50;
  let next = Math.max(0, Math.min(100, cur + (g.heal === 0 ? -8 : total >= greatOf(g.type) ? 6 : total >= goodOf() ? 2 : -3)));
  // 紹介ライン（fanSatNeed）から上は、好きなメニューを出したときしか上がらない
  if (next > cur && !g.liked && next >= CONFIG.fanSatNeed) {
    next = Math.max(cur, CONFIG.fanSatNeed - 1);
    if (cur >= CONFIG.fanSatNeed - 1 && Math.random() < 0.3) fx(g.x, g.y - 20, "好物が食べたかったな", "like");
  }
  ts[g.type] = next;
  S.typeSat = ts;

  const s = SEATS[g.seat];
  g.state = "out"; g.seat = null;
  g.path = [{ x: s.x, y: s.y + 14 }, { x: DOOR.x, y: s.y + 14 }, { x: DOOR.x, y: DOOR.y }];
}

// 地区の解放・季節のステージ・人気でやって来るお客さん
const arriveOk = t => { const a = t.arrive; return a.area ? S.areas.includes(a.area) : a.season ? (S.seasonWins || []).includes(a.season) : a.pop ? S.pop >= a.pop : false; };
const arriveText = a => a.area ? `${areaData(a.area).name}が解放されると来るらしい` : a.season ? `${areaData(a.season).name}（${areaData(a.season).months}）のパトロールで勝つと来るらしい` : `人気${a.pop}のお店になると来るらしい`;
function checkGuestArrivals() {
  GUEST_TYPES.filter(t => t.arrive && !S.known.includes(t.id) && arriveOk(t)).forEach(t => {
    S.known.push(t.id);
    addLog(`新しいお客さん「${t.name}」が来るようになった！`);
    queueModal("🙋 新しいお客さん！", `<div class="bigemoji">🎉</div>
      <div><b>${t.name}</b>さんが来るようになりました！</div>
      <table><tr><td>特徴</td><td>${t.desc}</td></tr><tr><td>好きなメニュー</td><td>${t.likes.map(id => menuData(id).name).join("・")}</td></tr>
      ${t.special ? `<tr><td>とくべつ</td><td>${t.special}</td></tr>` : ""}</table>`);
  });
}
// ファンが増えると、新しいお客さんを紹介してくれる
function addFan(type, n) {
  S.fans[type] = (S.fans[type] || 0) + n;
  if (S.fans[type] < CONFIG.fanNeed || typeSat(type) < CONFIG.fanSatNeed) return;
  GUEST_TYPES.filter(t => t.from === type && !S.known.includes(t.id)).forEach(t => {
    S.known.push(t.id);
    const from = typeData(type).name;
    addLog(`${from}さんが${t.name}さんを紹介してくれた！`);
    queueModal("🤝 紹介！", `
      <div class="bigemoji">🎉</div>
      <div>常連の<b>${from}</b>さんが、知り合いの<b>${t.name}</b>さんを連れてきてくれた！</div>
      <table><tr><td>特徴</td><td>${t.desc}</td></tr>
      <tr><td>好きなメニュー</td><td>${t.likes.map(id => menuData(id).name).join("・")}</td></tr>
      ${t.special ? `<tr><td>とくべつ</td><td>${t.special}</td></tr>` : ""}</table>
      <div class="note">「お客さん」タブの図鑑で確認できます。</div>`);
  });
}

// ---------- お店の荒らし ----------
function startRaid() {
  const avg = townAvg();
  const type = avg < 20 ? pick(["dog", "crow"]) : avg < 35 ? pick(["rat", "crow"]) : "rat";
  const maxY = areaMaxY();
  const rhp = Math.round(RAIDS[type].hp * loopMul(CONFIG.ngEnemy));
  raider = { type, hp: rhp, max: rhp, state: "in", left: CONFIG.raidTicks,
             x: DOOR.x, y: DOOR.y, tx: rand(36, areaMaxX()), ty: rand(40, maxY) };
  raider.wp = [doorIn()];   // 入口から入ってくる
  S.today.raids = (S.today.raids || 0) + 1;
  addLog(`⚠️ ${ENEMIES[type].name}がお店に入ってきた！ 猫たちが追い払いに向かう！`);
  fx(DOOR.x, H - 14, `${ENEMIES[type].name}が侵入！`, "bad");
}
const chasers = () => dutyCats().filter(c => !c.sleeping && c.x !== undefined).sort((a, b) =>
  Math.hypot(a.x - raider.x, a.y - raider.y) - Math.hypot(b.x - raider.x, b.y - raider.y)).slice(0, 2);
function raidTick() {
  if (raider.state === "out") return;
  raider.t = (raider.t || 0) + 1;   // 入ってきてからの時間（長いほど被害が大きい）
  // お客さんがこわがる（荒らしが長くいるほど、満足がどんどん下がる）
  guests.forEach(g => {
    if (g.state !== "seated" || (g.scared || 0) >= CONFIG.raidScareMax) return;
    g.scared = (g.scared || 0) + 1;
    if (g.scared === 1) fx(g.x, g.y - 14, "こわい…", "bad");
    else if (g.scared % 3 === 0) fx(g.x, g.y - 14, "満足-" + g.scared, "bad");
  });
  // 長くいるほど、逃げて帰るお客さんが増える
  const fleeRate = RAIDS[raider.type].flee * (raider.state === "raid" ? 1 : 0.5) * (1 + CONFIG.raidFleeGrow * raider.t);
  guests.filter(g => g.state === "seated").forEach(g => {
    if (Math.random() >= fleeRate) return;
    fx(g.x, g.y - 16, "もう帰る！", "bad");
    g.heal = 0; g.scared = CONFIG.raidScareMax; leave(g);   // 猫に会えなかった扱いで帰る（人気-1）
    const ts = { ...(S.typeSat || {}) }; ts[g.type] = Math.max(0, (ts[g.type] ?? 50) - 4); S.typeSat = ts;   // そのお客さんの満足度もさらに下がる
    S.today.fled = (S.today.fled || 0) + 1;
  });
  // 近くの猫が攻撃
  chasers().forEach(c => {
    if (Math.hypot(c.x - raider.x, c.y - raider.y) > 9) return;
    raider.hp -= battleStats(c).atk; (raider.hitters = raider.hitters || []).includes(c.id) || raider.hitters.push(c.id); c.energy = Math.max(0, c.energy - 1);
    fx(raider.x, raider.y - 8, "ﾈｺﾊﾟﾝﾁ!", "lv");
    if (c.energy <= 0) { c.sleeping = true; c.target = null; }
  });
  if (raider.hp <= 0) {
    S.pop = Math.min(CONFIG.goalPopularity, S.pop + 1); S.today.repelled++; addStat("repelled");
    (raider.hitters || []).forEach(id => { const c = S.cats.find(x => x.id === id); if (c) { c.repels = (c.repels || 0) + 1; gainBxp(c, 3); } });
    addLog(`猫たちが${ENEMIES[raider.type].name}を追い払った！ 人気+1`);
    fx(raider.x, raider.y - 12, "追い払った！", "heart");
    return raidLeave();
  }
  if (raider.state === "raid" && --raider.left <= 0) {
    const R = RAIDS[raider.type], name = ENEMIES[raider.type].name, cost = Math.round(R.repair * (1 + 0.5 * (S.expand - 1)));
    S.money -= cost; S.today.repair += cost;
    S.pop = Math.max(0, S.pop - R.pop);
    addLog(`${name}にお店を荒らされた…。修理費${yen(cost)}・人気-${R.pop}`);
    fx(raider.x, raider.y - 12, `修理費 ${yen(cost)}`, "bad");
    // 家具を壊す
    const ok = S.items.filter(id => !S.broken.includes(id));
    if (ok.length && Math.random() < R.breaks) {
      const id = pick(ok); S.broken.push(id);
      addLog(`${name}に${itemData(id).name}を壊された！ 「お店」タブで修理しよう。`);
      (S.today.brokeList = S.today.brokeList || []).push(itemData(id).name);
    }
    // 素材を盗む
    const have = Object.keys(S.mats).filter(k => S.mats[k] > 0);
    if (have.length && R.steal) {
      const k = pick(have), n = Math.min(S.mats[k], rand(1, R.steal));
      S.mats[k] -= n; addLog(`${name}に${MATERIALS[k]}を${n}個盗まれた…`);
      (S.today.stolen = S.today.stolen || []).push(`${MATERIALS[k]}${n}`);
    }
    raidLeave();
  }
}
// 荒らしは入口を通って出入りする（壁や外を通りぬけない）
const doorIn = () => ({ x: DOOR.x, y: Math.min(shopBottom(), H) - 6 });
function raidLeave() { raider.state = "out"; raider.wp = [doorIn(), { x: DOOR.x, y: DOOR.y }]; raider.tx = raider.x; raider.ty = raider.y; }

// ---------- 猫同士のじゃれ合い ----------
function startPlay() {
  if (raider || Math.random() > CONFIG.playChance) return;
  const idle = dutyCats().filter(c => !c.sleeping && !c.target && !c.play && c.energy > 3 && c.x !== undefined);
  if (idle.length < 2) return;
  const a = pick(idle), b = pick(idle.filter(c => c !== a));
  const mx = Math.max(30, Math.min(areaMaxX(), Math.round((a.x + b.x) / 2))), my = Math.max(44, Math.min(areaMaxY(), Math.round((a.y + b.y) / 2)));
  const until = S.tick + rand(3, 5);
  a.play = { partner: b.id, until, mx, my, side: -1 };
  b.play = { partner: a.id, until, mx, my, side: 1 };
}
// ---------- 家具で遊ぶ ----------
const furnSpot = id => { const [x, y] = furnPos(id), sp = FURN_PLAY[id].spot; return { x: x + sp[0], y: y + sp[1] }; };
const atFurnSpot = c => { if (!c.fplay) return false; const p = furnSpot(c.fplay.id); return Math.hypot(c.x - p.x, c.y - p.y) < 2; };
function startFurnPlay() {
  if (raider || Math.random() > CONFIG.furnPlayChance + eff("play")) return;
  const busy = dutyCats().filter(c => c.fplay).map(c => c.fplay.id);
  const toys = Object.keys(FURN_PLAY).filter(id => has(id) && !busy.includes(id) && furnSpot(id).x <= areaMaxX() + 8 && furnSpot(id).y <= areaMaxY() + 8);
  const idle = dutyCats().filter(c => !c.sleeping && !c.target && !c.play && !c.fplay && c.energy > 2 && c.x !== undefined);
  if (!toys.length || !idle.length) return;
  pick(idle).fplay = { id: pick(toys), until: S.tick + rand(3, 6) };
}
function furnPlayTick(c) {
  if (S.tick >= c.fplay.until || !has(c.fplay.id)) { c.fplay = null; return false; }
  if (!atFurnSpot(c)) return true;
  const P = FURN_PLAY[c.fplay.id], p = furnSpot(c.fplay.id);
  c.exp += 0.5;
  if (Math.random() < 0.45) fx(p.x, p.y - 12, pick(P.words), "heart");
  guests.filter(g => g.state === "seated" && Math.hypot(g.x - p.x, g.y - p.y) < 40).forEach(g => {
    if (Math.random() < 0.5) { g.heal += CONFIG.playHeal; if (Math.random() < 0.3) fx(g.x, g.y - 16, "かわいい…", "heart"); }
  });
  return true;
}
const atPlaySpot = c => c.play && Math.hypot(c.x - (c.play.mx + c.play.side * 5), c.y - c.play.my) < 2;
function playTick(c) {
  const p = S.cats.find(x => x.id === c.play.partner);
  if (S.tick >= c.play.until || !p || !p.duty || p.sleeping || !p.play) { c.play = null; return false; }
  if (!atPlaySpot(c) || !atPlaySpot(p) || c.play.side > 0) return true;   // 片方の猫だけが演出を担当
  const { mx, my } = c.play;
  fx(mx, my - 12, pick(["にゃっ", "にゃにゃ！", "ぺしぺし", "ころころ", "ふにゃ〜"]), "heart");
  c.exp += 1; p.exp += 1;
  // 近くのお客さんがほっこり
  guests.filter(g => g.state === "seated" && Math.hypot(g.x - mx, g.y - my) < 36).forEach(g => {
    g.heal += CONFIG.playHeal;
    if (Math.random() < 0.4) fx(g.x, g.y - 16, "かわいい…", "heart");
  });
  return true;
}

// 寝床の場所と、寝床に着いているか
const bedOf = c => { const b = BEDS[Math.max(0, dutyCats().indexOf(c))]; return { x: b[0], y: b[1] + 1 }; };
const inBed = c => c.x !== undefined && Math.hypot(c.x - bedOf(c).x, c.y - bedOf(c).y) < 3;
function catTick(c) {
  if (c.sleeping) {
    if (!inBed(c)) { if (S.tick % 4 === 0) fx(c.x, c.y - 10, "ねむい…", "zz"); return; }   // 寝床に着くまで回復しない
    c.energy = Math.min(catMax(c), c.energy + catRecover(c));
    if (c.energy >= catMax(c)) { c.energy = catMax(c); c.sleeping = false; fx(c.x, c.y - 10, "元気いっぱい！", "lv"); }
    else if (S.tick % 3 === 0) fx(c.x, c.y - 8, "Zz", "zz");
    return;
  }
  if (raider && raider.state !== "out" && chasers().includes(c)) { c.target = null; c.play = null; c.fplay = null; return; }   // 荒らしを追いかけ中
  if (c.play && playTick(c)) return;   // じゃれ合い中
  if (c.fplay && furnPlayTick(c)) return;   // 家具で遊び中
  let g = guests.find(x => x.id === c.target && x.state === "seated");
  if (!g || c.serve >= 3) {
    c.target = null; c.serve = 0;
    const busy = dutyCats().map(o => o.target);
    const fav = catData(c.id).fav;
    g = guests.filter(x => x.state === "seated" && !busy.includes(x.id))
      .sort((a, b) => (a.type === fav ? -3 : 0) + a.heal - ((b.type === fav ? -3 : 0) + b.heal))[0];
    if (g) c.target = g.id;
  }
  if (!g) {
    if (c.skills.includes("kanban") && Math.random() < 0.02) {
      S.pop = Math.min(CONFIG.goalPopularity, S.pop + 1);
      fx(c.x, c.y - 10, "看板猫！人気+1", "heart");
    }
    return;
  }
  const p = servePos(g.seat);
  if (Math.hypot(c.x - p.x, c.y - p.y) > 3) return;   // まだ歩いている途中

  // お客さんを癒やす
  let h = catHeal(c);
  if (catData(c.id).fav === g.type) { h += 2; if (Math.random() < 0.4) fx(c.x, c.y - 10, "お気に入り♥", "heart"); }
  else if (Math.random() < 0.5) fx(c.x, c.y - 8, "♥", "heart");
  if (g.type === "maniac") h += c.skills.length;
  g.heal += h;
  c.healCount = (c.healCount || 0) + 1;
  c.yHeal = (c.yHeal || 0) + h;   // 今年かせいだ満足
  c.serve++; c.energy--;
  c.exp += (catData(c.id).growth || 1) * (c.acc ? accData(c.acc).exp || 1 : 1);
  if (menuData(g.menu).forCat && !g.fed) {
    g.fed = true; g.heal += 2;
    fx(c.x, c.y - 10, "おやつ！", "heart");
  }
  if (c.skills.includes("beg") && !g.extra && Math.random() < 0.2) {
    g.extra = true;
    const p2 = guestPrice(g);
    S.money += p2; S.today.sales += p2; S.monthSales += p2;
    fx(g.x, g.y - 12, "おかわり " + yen(p2), "money");
  }
  if (c.lv >= maxLv(c)) c.exp = Math.min(c.exp, c.lv * CONFIG.expPerLevel);   // MAXならもう上がらない
  else if (c.exp >= c.lv * CONFIG.expPerLevel) {
    c.exp = 0; c.lv++;
    fx(c.x, c.y - 12, "Lv UP!", "lv");
    addLog(`${nameOf(c.id)}がLv${c.lv}になった！`);
  }
  if (c.energy <= Math.floor(catMax(c) * CONFIG.tiredRate)) { c.sleeping = true; c.target = null; c.play = null; c.fplay = null; }
}

// ---------- 1週・1か月の終わり ----------
function endDay() {
  guests = []; raider = null;
  const food = S.cats.reduce((sum, c) => sum + foodCost(c), 0);
  const rent = rentOf();
  S.money -= food + rent;
  homeTraining();
  S.cats.forEach(c => { c.energy = catMax(c); c.sleeping = false; c.target = null; });
  const t = S.today, diff = S.pop - (t.popStart ?? S.pop);
  queueModal(`🌙 ${month()}月 第${weekOfMonth()}週 おつかれさま`, `
    <table>
      <tr><td>来てくれたお客さん</td><td>${t.visitors}人</td></tr>
      <tr><td>満席で帰ったお客さん</td><td>${t.turnedAway}人</td></tr>
      <tr><td>売上</td><td class="plus">+${yen(t.sales)}</td></tr>
      <tr><td>猫のごはん代</td><td class="minus">-${yen(food)}</td></tr>
      <tr><td>家賃</td><td class="minus">-${yen(rent)}</td></tr>
      ${t.repair ? `<tr><td>荒らしの修理費</td><td class="minus">-${yen(t.repair)}</td></tr>` : ""}
      <tr><td>今週の収支</td><td class="${t.sales - food - rent - (t.repair || 0) >= 0 ? "plus" : "minus"}">${t.sales - food - rent - (t.repair || 0) >= 0 ? "+" : "-"}${yen(Math.abs(t.sales - food - rent - (t.repair || 0)))}</td></tr>
      <tr><td>人気</td><td class="${diff >= 0 ? "plus" : "minus"}">${diff >= 0 ? "+" : ""}${diff}</td></tr>
      <tr><td>街の安全度</td><td>${townAvg()}%</td></tr>
      ${t.raids ? `<tr><td>荒らし</td><td>${t.raids}回（追い払った ${t.repelled || 0}回）</td></tr>` : ""}
      ${t.fled ? `<tr><td>こわがって帰ったお客さん</td><td class="minus">${t.fled}人</td></tr>` : ""}
      ${t.brokeList ? `<tr><td>壊された家具</td><td class="minus">${t.brokeList.join("・")}</td></tr>` : ""}
      ${t.stolen ? `<tr><td>盗まれた素材</td><td class="minus">${t.stolen.join("・")}</td></tr>` : ""}
    </table>
    ${S.areas.some(id => S.town[id] < 35) ? `<div class="note">安全度が下がっている地区があります。「パトロール」からパトロールに出よう。</div>` : ""}
    ${t.turnedAway >= 3 ? `<div class="note">満席で帰ったお客さんが多いみたい。席を増やしてみよう。</div>` : ""}`);

  if (S.ad && --S.ad.days <= 0) { addLog(`${adData().name}の効果が終わった。`); S.ad = null; }
  // 街の安全度が下がる
  const decay = Math.max(2, CONFIG.safetyDecay - eff("safety"));
  S.areas.forEach(id => {
    S.town[id] = Math.max(0, S.town[id] - decay);
    if (S.town[id] < 20) { S.pop = Math.max(0, S.pop - 2); addLog(`${areaData(id).name}が荒らされている…。人気-2`); }
  });
  const monthEnd = weekOfMonth() === CONFIG.weeksPerMonth;
  if (monthEnd) monthRanking();
  if (monthEnd && month() === ((CONFIG.startMonth + 10) % 12) + 1) yearAward();   // 1年の最後の月の終わり
  S.day++; S.tick = 0; S.today = newDayStats();
  makeForecast();
  if (monthEnd) startMonth(true);
  save();
}

// 街のねこランキング（うちの猫＋ライバル店の看板猫）
function townCatRanking() {
  const mi = monthIndex(), g = CONFIG.rivalGrowth, L = loopMul(CONFIG.ngRival);
  const rivals = RIVAL_CATS.map(r => ({ name: r.name, shop: r.shop, heal: Math.round((r.heal + 0.5 * mi * g) * L), pow: Math.round((r.pow + 1.5 * mi * g) * L), lv: Math.round((r.lv + 0.8 * mi * g) * L) }));
  const mine = S.cats.map(c => ({ id: c.id, name: nameOf(c.id), shop: "うちの店", heal: catHeal(c), pow: battlePower(c), lv: c.lv, me: true }));
  const all = [...mine, ...rivals];
  return [["💗 癒し部門", "heal"], ["💪 戦闘力部門", "pow"], ["⭐ レベル部門", "lv"]].map(([title, key]) => ({ title, key, list: [...all].sort((a, b) => b[key] - a[key] || (b.me ? 1 : 0) - (a.me ? 1 : 0)) }));
}

function monthRanking() {
  // 猫の部門で1位ならごほうび
  const awards = townCatRanking().filter(r => r.list[0].me);
  awards.forEach(() => { S.money += CAT_AWARD.money; S.pop = Math.min(CONFIG.goalPopularity, S.pop + CAT_AWARD.pop); });
  if (awards.length) {
    addLog(`ねこアワード：${awards.map(r => `${r.title}で${r.list[0].name}が1位！`).join(" ")}`);
    queueModal(`🐾 ${month()}月 ねこアワード`, `
      <div>街のねこランキングで、うちの猫が1位をとりました！</div>
      <table>${awards.map(r => `<tr><td>${r.title}</td><td>${r.list[0].name}</td></tr>`).join("")}</table>
      <div>ごほうび：1部門につき <b>${yen(CAT_AWARD.money)}</b>・人気+${CAT_AWARD.pop}</div>`);
  }
  const mi = monthIndex();
  const me = { name: "うちのお店", score: Math.round(S.monthSales / 1000) + S.pop, me: true };
  const list = RIVALS.map(r => ({ name: r.name, score: Math.round((r.base + r.grow * CONFIG.rivalGrowth * mi) * loopMul(CONFIG.ngRival) * (0.9 + Math.random() * 0.2)) }));
  list.push(me);
  list.sort((a, b) => b.score - a.score);
  const place = list.indexOf(me) + 1;
  S.bestPlace = S.bestPlace === null ? place : Math.min(S.bestPlace, place);
  const prize = PRIZES[place - 1];
  if (prize) { S.money += prize.money; S.pop = Math.min(CONFIG.goalPopularity, S.pop + prize.pop); }
  if (place === 1) gainLimitItem(1, "グランプリ1位のごほうび");
  S.lastRank = { label: `${year()}年目 ${month()}月`, list, place };
  addLog(`${month()}月のねこカフェグランプリは${place}位！`);
  queueModal(`🏆 ${month()}月 ねこカフェグランプリ`, `
    <div class="note">今月の売上と人気で、街のねこカフェが競います。</div>
    <table>${list.map((r, i) => `<tr class="${r.me ? "me" : ""}"><td>${i + 1}位　${r.name}</td><td>${r.score}点</td></tr>`).join("")}</table>
    <div>${prize ? `賞金 <b>${yen(prize.money)}</b>・人気+${prize.pop} をもらった！` : "3位以内で賞金がもらえます。来月もがんばろう！"}</div>`);
  if (S.pop >= CONFIG.goalPopularity) S.cleared = true;
}

function startNewGamePlus(partnerId) {

  S = newGame();
  Object.assign(S, {
    loop: (old.loop || 1) + 1, bestLoop: Math.max(old.bestLoop || 1, (old.loop || 1) + 1),
    ach: [...(old.ach || [])], met: [...(old.met || [])], stat: { ...(old.stat || {}), streak: 0 },

  S.ach.forEach(id => { const a = achData(id); if (a && !S.unlockedCats.includes(a.cat)) S.unlockedCats.push(a.cat); });
  if (partner) {
    const p = JSON.parse(JSON.stringify(partner));
    Object.assign(p, { duty: true, energy: catMax(p), sleeping: false, target: null, play: null, fplay: null, x: undefined, y: undefined, patrolWeek: undefined, yHeal: 0, yKills: 0 });

  if (!S.tried.includes(key)) S.tried.push(key);

  if (m && !S.menus[m.id]) {
    S.menus[m.id] = { lv: 1, on: onMenus().length < menuSlots() };
    addLog(`新メニュー「${m.name}」ができた！`);

    queueModal("🧪 新メニュー開発！", `
      <div class="bigemoji">${m.emoji}</div>
      <div style="text-align:center;font-size:18px">${m.name}</div>
      <table><tr><td>値段</td><td>${yen(m.price)}</td></tr><tr><td>満足度</td><td>${m.sat}</td></tr>
      ${fans.length ? `<tr><td>好きなお客さん</td><td>${fans.join("・")}</td></tr>` : ""}
      ${m.forCat ? `<tr><td colspan="2">🐾 猫用おやつ：猫が元気になる</td></tr>` : ""}</table>`);
  } else if (m) {
    addLog(`${m.name}ができた。…もう知っているレシピだった。`);
  } else {
    const hint = MENUS.find(x => x.recipe && !S.menus[x.id] && x.recipe.some(i => sel.includes(i)) && x.recipe.every(i => S.ingredients.includes(i)));
    if (hint) {
      const base = hint.recipe.find(i => sel.includes(i));
      addLog(`謎の料理ができた…。でも「${ingData(base).name}は何かと相性がよさそう${hint.recipe.length === 3 ? "（3つ組み合わせるのかも？）" : ""}」とひらめいた。`);
    } else addLog("謎の料理ができた…。新しい食材を仕入れるとレシピが広がりそう。");
  }
}

// ---------- 買い物・行動 ----------
function act(kind, id) {
  const pay = (cost, mat) => payAll(cost, mat);
  if (kind === "ngplus") {
    if (!S.endingShown) return;
    if (!ngArmed) { ngArmed = true; setTimeout(() => { ngArmed = false; renderPanel(true); }, 4000); return renderPanel(true); }
    ngArmed = false;
    return startNewGamePlus(($("ngPartner") || {}).value);
  }
  if (kind === "counter") {
    if ((S.counter || 0) >= counterCap() || !pay(counterPrice())) return;
    S.counter = (S.counter || 0) + 1; addLog("一人席（カウンター席）を増やした！");
  } else if (kind === "seat") {
    if (S.seats >= seatCap() || !pay(seatPrice())) return;
    S.seats++; addLog("席を1つ増やした！");
  } else if (kind === "expand") {
    if (S.expand >= MAX_EXPAND || !pay(CONFIG.expandCosts[S.expand - 1], CONFIG.expandMats[S.expand - 1])) return;
    S.expand++; addLog("お店を広げた！ 席を増やせるようになった。");
  } else if (kind === "unstore") {
    if (!(S.stored || []).includes(id)) return;
    S.stored = S.stored.filter(x => x !== id); S.items.push(id); addLog(`${itemData(id).name}を倉庫から出した！`);
  } else if (kind === "item") {
    const it = itemData(id);
    if (S.items.includes(id) || (S.stored || []).includes(id) || !pay(it.cost, it.mat)) return;
    S.items.push(id); addLog(`${it.name}を置いた！`);
    SETS.filter(st => st.items.includes(id) && st.items.every(has)).forEach(st => {
      addLog(`「${st.name}」が完成した！`);
      queueModal("✨ セット完成！", `<div class="bigemoji">🛋️</div><div style="text-align:center;font-size:18px">${st.name}</div><div>${st.desc}</div>`);
    });
  } else if (kind === "cat") {
    const d = catData(id);
    if (S.cats.length >= MAX_CATS || !catAvailable(d) || S.cats.some(c => c.id === id) || S.pop < adoptPop(d) || !pay(adoptCost(d), adoptMat(d))) return;
    const c = makeCat(id); c.x = DOOR.x; c.y = H - 10; c.duty = dutyCats().length < catCap(); S.cats.push(c);
    if (!S.met.includes(id)) S.met.push(id);
    addLog(`${d.name}が仲間になった！`);
  } else if (kind === "duty") {
    const c = S.cats.find(x => x.id === id);
    if (!c.duty && dutyCats().length >= catCap()) { addLog(`出勤できるのは${catCap()}匹までです。だれかをおやすみにしよう。`); renderAll(); return; }
    c.duty = !c.duty; c.target = null;
    if (c.duty) { c.x = DOOR.x; c.y = H - 10; addLog(`${nameOf(id)}がお店に出勤した！`); }
    else { fx(c.x, c.y - 10, "おつかれさま", "zz"); c.x = undefined; addLog(`${nameOf(id)}はおうちでおやすみ。`); }
    if (selected && selected.kind === "cat" && selected.id === id) selected = null;
  } else if (kind === "rehome") {
    if (S.cats.length <= 1) return;
    if (rehomeArmed !== id) {
      rehomeArmed = id; renderPanel(true);
      setTimeout(() => { if (rehomeArmed === id) { rehomeArmed = null; renderPanel(true); } }, 3000);
      return;
    }
    rehomeArmed = null;
    const leaving = nameOf(id);
    S.cats = S.cats.filter(c => c.id !== id);
    if (selected && selected.kind === "cat" && selected.id === id) selected = null;
    addLog(`${leaving}は、やさしい里親さんのところへ旅立った。`);
  } else if (kind === "train") {
    const c = S.cats.find(x => x.id === id);
    const can = SKILLS.filter(s => !c.skills.includes(s.id));
    const sk = can.some(s => s.id === trainSel[id]) ? trainSel[id] : can[0]?.id;
    if (!sk || c.skills.length >= MAX_SKILLS || !pay(skillData(sk).cost)) return;
    const d = skillData(sk);
    if (Math.random() * 100 < trainRate(c, sk)) {
      c.skills.push(sk); delete trainSel[id];
      addLog(`${nameOf(id)}は「${d.name}」を覚えた！`);
      fx(c.x, c.y - 12, d.name + "！", "lv");
    } else { c.exp += 5; addLog(`${nameOf(id)}の特訓は失敗…。でも経験+5`); }
  } else if (kind === "limitBreak") {
    const c = S.cats.find(x => x.id === id);
    if (!c || (S.limitItems || 0) < 1 || (c.capUp || 0) >= LIMIT_MAX) return;
    S.limitItems--; c.capUp = (c.capUp || 0) + 1;
    addLog(`🔔 ${nameOf(id)}が限界を突破した！ 上限がLv${maxLv(c)}になった。`);
    fx(c.x, c.y - 12, "限界突破！", "lv");
  } else if (kind === "buyChair") {
    const c = chairData(id);
    if ((S.chairTypes || []).includes(id) || !pay(c.cost, c.mat)) return;
    S.chairTypes = [...(S.chairTypes || []), id]; addLog(`${c.name}を買った！ テーブルごとに選べるよ。`);
  } else if (kind === "buyFloor") {
    const f = FLOORS[id];
    if ((S.floorTypes || []).includes(id) || !pay(f.cost, f.mat)) return;
    S.floorTypes = [...(S.floorTypes || []), id]; addLog(`${f.name}を買った！ 「この床を張る」で好きなマスに張れるよ。`);
  } else if (kind === "paint") {
    paintStyle = id; layoutMode = false; layoutSel = null; closeDrawer(); if (view !== "shop") setView("shop");
    addLog(`${FLOORS[id].name}を張る：お店のマスをタップしてね。`);
  } else if (kind === "paintEnd") {
    paintStyle = null;
  } else if (kind === "layout") {
    paintStyle = null;
    layoutMode = !layoutMode; layoutSel = null;
    if (layoutMode) { closeDrawer(); if (view !== "shop") setView("shop"); }
    if (layoutMode) addLog("模様替えモード：動かしたい家具をタップしよう。");
  } else if (kind === "layoutReset") {
    S.itemPos = {}; S.tablePos = {}; applyTablePos(); layoutSel = null; addLog("家具とテーブルを元の場所に戻した。");
  } else if (kind === "forget") {
    if (forgetArmed !== id) {
      forgetArmed = id; renderPanel(true);
      setTimeout(() => { if (forgetArmed === id) { forgetArmed = null; renderPanel(true); } }, 3000);
      return;
    }
    forgetArmed = null;
    const [catId, sk, type] = id.split(":");
    const c = S.cats.find(x => x.id === catId); if (!c) return;
    if (type === "shop") c.skills = c.skills.filter(x => x !== sk);
    else c.bskills = (c.bskills || []).filter(x => x !== sk);
    c.energy = Math.min(c.energy, catMax(c));
    addLog(`${nameOf(catId)}は「${type === "shop" ? skillData(sk).name : bskillData(sk).name}」を忘れた。新しい特技を覚えられる。`);
  } else if (kind === "renameOpen") {
    renameOpen = renameOpen === id ? null : id;
    renderPanel(true);
    const inp = $("rn-" + id); if (inp) inp.focus();
    return;
  } else if (kind === "renameSave" || kind === "renameReset") {
    const c = S.cats.find(x => x.id === id);
    const v = kind === "renameSave" ? ($("rn-" + id)?.value || "").replace(/[<>&"'`]/g, "").trim().slice(0, 10) : "";
    c.nick = v || null; renameOpen = null;
    addLog(v ? `${catData(id).name}の名前を「${v}」にした！` : `${catData(id).name}の名前を元に戻した。`);
  } else if (kind === "btrain") {
    const c = S.cats.find(x => x.id === id);
    c.bskills = c.bskills || [];
    const can = BSKILLS.filter(x => !c.bskills.includes(x.id));
    const sk = can.some(x => x.id === btrainSel[id]) ? btrainSel[id] : can[0]?.id;
    if (!sk || c.bskills.length >= MAX_BSKILLS || !pay(bskillData(sk).cost)) return;
    const d = bskillData(sk);
    if (Math.random() * 100 < Math.min(95, d.rate + (c.lv - 1) * 5)) {
      c.bskills.push(sk); delete btrainSel[id];
      addLog(`${nameOf(id)}は戦闘特技「${d.name}」を覚えた！`);
      fx(c.x, c.y - 12, d.name + "！", "lv");
    } else { c.exp += 5; addLog(`${nameOf(id)}の特訓は失敗…。でも経験+5`); }
  } else if (kind === "buyHome") {
    const h = HOME_FURN.find(x => x.id === id);
    if (!h || (S.home || []).includes(id) || !pay(h.cost, h.mat)) return;
    S.home = [...(S.home || []), id]; addLog(`🏡 おうちに${h.name}を置いた！ 休んでいる猫が遊んで育ちます。`);
  } else if (kind === "buyAcc") {
    if (!pay(accData(id).cost, accData(id).mat)) return;
    S.accs.push(id); addLog(`${accData(id).name}を買った！ 猫タブで「お店用」に装備しよう。`);
  } else if (kind === "ing") {
    if (!ingInStock(ingData(id)) || S.ingredients.includes(id) || !pay(ingData(id).cost)) return;
    S.ingredients.push(id); addLog(`${ingData(id).name}を仕入れた！`);
  } else if (kind === "improve") {
    if (S.menus[id].lv >= 5 || !pay(improveCost(id))) return;
    S.menus[id].lv++; addLog(`${menuData(id).name}を改良した！（Lv${S.menus[id].lv}）`);
  } else if (kind === "toggle") {
    const onCount = onMenus().length;
    if (S.menus[id].on && onCount <= 1) return;
    if (!S.menus[id].on && onCount >= menuSlots()) { addLog(`お店に出せるメニューは${menuSlots()}品までです。どれかを下げよう。`); renderAll(); return; }
    S.menus[id].on = !S.menus[id].on;
  } else if (kind === "pickIng") {
    if (devSel.includes(id)) devSel = devSel.filter(x => x !== id);
    else if (devSel.length < 3) devSel.push(id);
  } else if (kind === "dev") {
    startDev();
  } else if (kind === "repair") {
    if (!S.broken.includes(id) || !pay(repairCost(id))) return;
    S.broken = S.broken.filter(x => x !== id); addLog(`${itemData(id).name}を修理した！`);
  } else if (kind === "buyGear") {
    const g = gearData(id);
    if (!gearOnSale(g) || !pay(g.price)) return;
    S.gear.push(id); addLog(`${g.name}を買った！ 猫タブで「戦闘用」に装備しよう。`);
  } else if (kind === "craft") {
    const g = gearData(id);
    if (!g.mat || !pay(0, g.mat)) return;
    S.gear.push(id); addLog(`${g.name}を作った！ 猫タブで「戦闘用」に装備しよう。`);
  } else if (kind === "patrol") {
    if (!readyCats().length) return;
    return openBattle(id, Math.min(S.townLv[id] || 1, areaSel[id] || S.townLv[id] || 1));
  } else if (kind === "ad") {
    const a = ADS.find(x => x.id === id);
    if (S.ad || (a.need && !S.known.includes(a.need)) || !pay(a.cost)) return;
    S.ad = { id, days: a.days }; addLog(`${a.name}をした！ ${a.days}週間効果が続く。`);
  }
  save(); renderAll();
}

// 装備の数（同じ装備を何個でも持てる）
const ownN = (list, id) => list.filter(x => x === id).length;
const usedN = (key, id, except) => S.cats.filter(c => c !== except && c[key] === id).length;
const freeN = (key, list, id, except) => ownN(list, id) - usedN(key, id, except);
// 空きがなければ、ほかの猫から1つはずして付け替える
function equipSlot(key, list, catId, id) {
  const c = S.cats.find(x => x.id === catId);
  if (id && freeN(key, list, id, c) <= 0) {
    const o = S.cats.find(x => x !== c && x[key] === id);
    if (o) { o[key] = null; addLog(`${nameOf(o.id)}から付け替えた（もう1つ買う・作ると両方に装備できます）`); }
  }
  c[key] = id || null;
  return c;
}
function equip(catId, accId) {
  const c = equipSlot("acc", S.accs, catId, accId);
  c.energy = Math.min(c.energy, catMax(c));
  save(); renderAll();
}

const patternOf = id => CAT_PATTERN_OF[id] || Object.keys(CAT_PATTERNS)[[...id].reduce((n, ch) => n + ch.charCodeAt(0), 0) % Object.keys(CAT_PATTERNS).length];
const shapeCache = {};
function catShape(id) {
  if (shapeCache[id]) return shapeCache[id];
  const base = CAT_SIT.map(r => [...r]);
  CAT_PATTERNS[patternOf(id)].forEach(([j, i, ch]) => { if (base[j] && base[j][i] && base[j][i] !== "." && base[j][i] !== "e" && base[j][i] !== "p") base[j][i] = ch; else if (base[j] && i === 8 && ch === "c") base[j][i] = ch; });
  const sit = base.map(r => r.join(""));
  const sh = catData(id).shape;
  return (shapeCache[id] = sh === "fold" ? { map: [".........", ".cc...aa.", ...sit.slice(2)], dy: 0 } : sh === "short" ? { map: sit.filter((r, i) => i !== 7), dy: 1 } : { map: sit, dy: 0 });
}

function walkMap(id, frame, dir) {
  let m = CAT_WALK[frame];

  if (sh === "fold") m = [".........", ...m.slice(1)].map((r, i) => i === 0 ? "..........." : r);

function sprite(map, pal, x, y, to = ctx) {
  map.forEach((row, j) => {
    for (let i = 0; i < row.length; i++) {
      const col = pal[row[i]];
      if (!col) continue;
      to.fillStyle = col;
      to.fillRect(Math.round(x) + i, Math.round(y) + j, 1, 1);
    }
  });
}
// ふちどり付きで描く（ドット絵がくっきり見える）
function spriteO(map, pal, x, y, to = ctx, oc = "rgba(42,36,51,.8)") {
  const X = Math.round(x), Y = Math.round(y), h = map.length;
  const on = (j, i) => j >= 0 && j < h && i >= 0 && i < map[j].length && !!pal[map[j][i]];
  to.fillStyle = oc;
  for (let j = -1; j <= h; j++) {
    const w = map[Math.max(0, Math.min(h - 1, j))].length;
    for (let i = -1; i <= w; i++) {
      if (on(j, i)) continue;
      if (on(j - 1, i) || on(j + 1, i) || on(j, i - 1) || on(j, i + 1)) to.fillRect(X + i, Y + j, 1, 1);
    }
  }
  sprite(map, pal, X, Y, to);
}
function rect(x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(x, y, w, h); }

// ---------- 動き ----------
function moveTo(o, tx, ty, speed, dt) {
  const dx = tx - o.x, dy = ty - o.y, d = Math.hypot(dx, dy);
  if (d < 0.5) { o.x = tx; o.y = ty; return true; }
  const step = Math.min(d, speed * dt);
  o.x += dx / d * step; o.y += dy / d * step;
  return false;
}

function update(dt) {
  guests.forEach(g => {
    if (!g.path.length) return;
    if (moveTo(g, g.path[0].x, g.path[0].y, 34, dt)) {
      g.path.shift();
      if (!g.path.length && g.state === "in") sitDown(g);
    }
  });
  guests = guests.filter(g => !(g.state === "out" && !g.path.length));

  if (raider && raider.wp && raider.wp.length) {   // まず入口を通る
    const w = raider.wp[0];
    if (moveTo(raider, w.x, w.y, raider.state === "out" ? 42 : 30, dt)) raider.wp.shift();
    if (raider.state === "out" && !raider.wp.length) raider = null;
  } else if (raider) {
    const arrived = moveTo(raider, raider.tx, raider.ty, raider.state === "out" ? 42 : 30, dt);
    if (arrived && raider.state === "in") raider.state = "raid";
    if (arrived && raider.state === "raid" && Math.random() < dt) { raider.tx = Math.max(30, Math.min(areaMaxX(), raider.x + rand(-20, 20))); raider.ty = Math.max(40, Math.min(areaMaxY(), raider.y + rand(-12, 12))); }
    if (arrived && raider.state === "out") raider = null;
  }
  const chasing = raider && raider.state !== "out" && raider.y < shopBottom() ? chasers() : [];   // お店の中に入ってから追いかける
  const maxY = areaMaxY(), maxX = areaMaxX();
  dutyCats().forEach((c, i) => {
    if (c.x === undefined) { c.x = rand(30, maxX); c.y = rand(44, maxY); }
    let t;
    if (c.sleeping) t = { x: BEDS[i][0], y: BEDS[i][1] + 1 };
    else if (chasing.includes(c)) t = { x: raider.x + (c.x < raider.x ? -6 : 6), y: raider.y };
    else if (c.play) t = { x: c.play.mx + c.play.side * 5, y: c.play.my };
    else if (c.fplay) t = furnSpot(c.fplay.id);
    else {
      const g = guests.find(x => x.id === c.target && x.state === "seated");
      if (g) t = servePos(g.seat);
      else {
        if (!c.wander || performance.now() > c.wanderUntil) { c.wander = { x: rand(24, maxX), y: rand(44, maxY) }; c.wanderUntil = performance.now() + rand(2000, 5000); }
        t = c.wander;
      }
    }
    const px = c.x;
    c.moving = !moveTo(c, t.x, t.y, (c.sleeping ? CONFIG.catSleepySpeed : (chasing.includes(c) ? CONFIG.catChaseSpeed : CONFIG.catWalkSpeed) + eff("catSpeed") * 0.4), dt);
    if (Math.abs(c.x - px) > 0.05) c.dir = c.x < px ? -1 : 1;
  });

  parts.forEach(p => {
    p.y += p.v * dt; p.x += Math.sin(performance.now() / 600 + p.p) * 6 * dt;
    if (p.y > H) { p.y = -2; p.x = Math.random() * W; }
  });
}

function updateHome(dt) {
  const now = performance.now();
  homeCats().forEach((c, i) => {
    const p = homePos[c.id] || (homePos[c.id] = { x: rand(30, W - 30), y: rand(60, H - 20), dir: 1, mode: "walk", until: 0 });
    if (now > p.until) {   // つぎにすることを決める
      const toys = (S.home || []).filter(id => HOME_SPOTS[id]);
      const r = Math.random();
      if (c.energy < catMax(c) * 0.6 || r < 0.25) { const cu = CUSHIONS()[i % 16]; Object.assign(p, { mode: "sleep", tx: cu.x, ty: cu.y, until: now + rand(5000, 9000) }); }
      else if (toys.length && r < 0.65) { const t = homeSpot(pick(toys)); Object.assign(p, { mode: "play", tx: t.x + rand(-6, 6), ty: t.y + 8, until: now + rand(3000, 6000) }); }
      else Object.assign(p, { mode: "walk", tx: rand(20, W - 20), ty: rand(56, H - 14), until: now + rand(2500, 5000) });
    }
    const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy), sp = (p.mode === "sleep" ? 14 : 22) * dt;
    p.moving = d > 1;
    if (d > 1) { p.x += dx / d * Math.min(sp, d); p.y += dy / d * Math.min(sp, d); if (Math.abs(dx) > 0.3) p.dir = dx < 0 ? -1 : 1; }
  });
}

function homeHit(p) {

function frame(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  if (!paused && $("modal").hidden && $("saveModal").hidden && !BT) update(Math.min(0.2, dt * gameSpeed));
  if (BT) { if (BT.running && $("modal").hidden) updateBattle(dt * BT.speed); if (BT) { animBattle(dt * (BT.running ? BT.speed : 1)); drawBattle(); } }
  if (view === "home") { if (!BT) updateHome(dt); drawHome(); } else draw();
  requestAnimationFrame(frame);
}

function hitTest(p) {

  dutyCats().forEach(c => {
    if (c.x === undefined) return;
    const d = Math.hypot(p.x - c.x, p.y - (c.y - 4));
    if (d < bestD) { bestD = d; best = { kind: "cat", id: c.id }; }
  });
  guests.forEach(g => {
    const d = Math.hypot(p.x - g.x, p.y - (g.y - 5));
    if (d < bestD) { bestD = d; best = { kind: "guest", id: g.id }; }

  const html = `<div class="tt">${title}<button class="x" id="infoClose" aria-label="閉じる">×</button></div><div class="bd">${body}</div>`;
  box.hidden = false;
  if (box._html === html) return;   // 同じなら描き直さない（ボタンが押しやすいように）
  if (document.activeElement && box.contains(document.activeElement) && document.activeElement.tagName === "SELECT") return;   // 選んでいる途中
  box._html = html; box.innerHTML = html; paintPics(box);
  $("infoClose").onclick = () => { selected = null; renderInfo(); };
}

// 項目の中を小分けにするボタン（「■ ○○」の見出しごとに1つ）
const subSel = {};
const subKey = h => { const t = h.replace(/^■\s*/, "").replace(/（[^）]*）/g, "").trim(); return (t.length > 12 ? t.split("・")[0] : t).replace(/[0-9０-９%％/／]+/g, "").trim(); };
function applySub() {
  const groups = [...$("panel").children].filter(el => el.classList.contains("grp") && el.querySelector("h3"));
  $("subnav").hidden = true;
  if (groups.length < 2) { groups.forEach(g => { g.classList.remove("acc", "closed"); }); return; }
  const keys = groups.map(g => subKey(g.querySelector("h3").textContent));
  if (!keys.includes(subSel[tab])) subSel[tab] = null;   // 最初は全部閉じている
  groups.forEach((g, i) => {
    const open = keys[i] === subSel[tab];
    g.classList.add("acc"); g.classList.toggle("closed", !open);
    const h = g.querySelector("h3");
    h.dataset.acc = keys[i]; h.setAttribute("role", "button"); h.tabIndex = 0; h.setAttribute("aria-expanded", open);
  });
}
// 見出しを押すと開く・もう一度押すと閉じる
function toggleAcc(h) {
  subSel[tab] = subSel[tab] === h.dataset.acc ? null : h.dataset.acc;
  applySub();
  if (subSel[tab]) h.scrollIntoView({ block: "nearest" });
}
$("panel").addEventListener("click", e => { const h = e.target.closest("h3[data-acc]"); if (h) toggleAcc(h); });
$("panel").addEventListener("keydown", e => { const h = e.target.closest("h3[data-acc]"); if (h && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggleAcc(h); } });
function renderAll() { renderHud(); renderPanel(true); }

  s_winter:  [[[200, 104], [100, 104], [100, 30], [12, 30]],
              [[200, 44], [150, 44], [150, 74], [130, 74], [130, 30], [12, 30]]],
  maou:      [[[200, 20], [170, 20], [170, 60], [120, 60], [120, 20], [70, 20], [70, 100], [12, 100]],
              [[200, 112], [100, 112], [100, 100], [12, 100]]],
};
let ROUTES = PATHS.shotengai;   // いま戦っている地区の道（1本か2本）
let BPATH = ROUTES[0];
const housePos = () => BPATH[BPATH.length - 1];
const allSegs = () => ROUTES.flatMap(r => r.slice(1).map((pt, k) => [r[k], pt]));
let BT = null;   // 戦闘中の状態

// 点と線の距離（道の上に猫を置けないようにするため）
function segDist(px, py, [x1, y1], [x2, y2]) {
  const dx = x2 - x1, dy = y2 - y1, l = dx * dx + dy * dy;
  const t = l ? Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / l)) : 0;
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}
// 置けない理由を返す（置けるなら null）
function placeError(x, y, ignoreId) {
  if (x < 6 || x > BW - 6 || y < 10 || y > BH - 2) return "ここには置けません";
  const [hx, hy] = housePos();
  if (Math.abs(x - hx) < 12 && y > hy - 20 && y < hy + 16) return "おうちの上には置けません";
  if (allSegs().some(([a, b]) => segDist(x, y - 4, a, b) < 10)) return "道の上には置けません";
  if (BT.placed.some(q => q.id !== ignoreId && Math.hypot(q.x - x, q.y - y) < 11)) return "ほかの猫と近すぎます";
  return null;
}

// 戦闘力（1秒あたりのダメージのめやす）
const battlePower = c => { const st = battleStats(c); return Math.round(st.atk * st.mult / st.cd); };
function atkParts(c) {
  const G = c.gear ? gearData(c.gear) : {};
  const K = (c.bskills || []).reduce((s, id) => s + (bskillData(id).atk || 0), 0);
  return [["猫の基本", catData(c.id).heal + 2], ["戦闘Lv", (c.bLv || 1) * 2], ["レア猫ボーナス", catData(c.id).atk || 0], ["戦闘用装備", G.atk || 0], ["戦闘特技", K]].filter(p => p[1]);
}
// 戦闘の経験（パトロールと荒らし退治でだけ増える）
const bxpNeed = c => (c.bLv || 1) * 20;
function gainBxp(c, n, x, y, inBattle) {
  c.bLv = c.bLv || 1; c.bxp = (c.bxp || 0) + n;
  if (c.bLv >= maxBLv(c)) { c.bxp = 0; return; }   // MAXならもう上がらない
  while (c.bxp >= bxpNeed(c) && c.bLv < maxBLv(c)) {
    c.bxp -= bxpNeed(c); c.bLv++;
    addLog(`${nameOf(c.id)}の戦闘Lvが${c.bLv}に上がった！`);
    if (inBattle && x !== undefined) bfx(x, y, "戦闘Lv UP!", "crit"); else fx(c.x, c.y - 12, "戦闘Lv UP!", "lv");
  }
}
const statPills = c => `<div class="twostat"><span class="st2 heal">💗 癒し <b>${catHeal(c)}</b></span><span class="st2 pow">⚔️ 戦闘力 <b>${battlePower(c)}</b> <small>戦闘Lv${c.bLv || 1}/${maxBLv(c)}${(c.bLv || 1) >= maxBLv(c) ? "（MAX）" : ""}</small></span></div>`;
function statDetails(c) {
  const st = battleStats(c), extra = [st.splash ? "範囲攻撃" : "", st.slow ? "足止め" : "", st.crit ? `${Math.round(st.crit * 100)}%で2倍` : ""].filter(Boolean);
  return `<details class="more" data-det="${c.id}" ${openDetails.has(c.id) ? "open" : ""}><summary>くわしく見る</summary>
    <table>
      <tr><td colspan="2"><b>💗 癒し ${catHeal(c)}</b>　お客さんを1回なでるごとに増える満足度</td></tr>

      <tr><td>　戦闘Lv</td><td>${c.bLv || 1}/${maxBLv(c)}${(c.bLv || 1) >= maxBLv(c) ? "（MAX）" : `（次まで ${bxpNeed(c) - (c.bxp || 0)}）`}</td></tr>
      <tr><td colspan="2"><b>📈 この猫の限界</b>　Lv・戦闘Lvの上限は${maxLv(c)}。最大まで育てると 💗癒し${potential(c.id).heal}・⚔️戦闘力${potential(c.id).pow}（装備・特技なし）</td></tr>

      <tr><td>　✨必殺技</td><td>${specialOf(c.id).name}<br><small>${specialText(specialOf(c.id))}</small></td></tr>

// パトロールでの猫の強さ
function battleStats(c) {
  const R = role(c.id), G = c.gear ? gearData(c.gear) : {};
  const K = (c.bskills || []).map(bskillData);
  const sk = key => K.reduce((s, x) => s + (x[key] || 0), 0);
  const splash = (R.splash || 0) + (G.splash || 0) + sk("splash");
  return {

function openBattle(areaId, lv) {
  const a = areaData(areaId);
  const hpMult = (1 + 0.3 * (a.level - 1) + 0.2 * (lv - 1)) * (a.hpBoost || 1) * loopMul(CONFIG.ngEnemy);
  const pool = poolFor(a, lv), boss = bossFor(a, lv);
  // 敵の出てくる順番を作る（3つの波）
  const queue = []; let t = 1;
  for (let w = 0; w < 3; w++) {
    const n = 3 + a.level + w * 2 + Math.floor(lv / 3);
    for (let i = 0; i < n; i++) { queue.push({ t, type: pick(pool), wave: w + 1 }); t += Math.max(0.7, 1.1 - lv * 0.03); }
    if (w === 2 && boss) { queue.push({ t: t + 1, type: boss, wave: 3, boss: true }); t += 1; }
    t += 4;
  }
  BT = { area: a, lv, hpMult, queue, total: queue.length, enemies: [], fxs: [], parts: [], placed: [],
         selCat: readyCats()[0].id, hover: null, msg: "", t: 0, time: 0, running: false, speed: 1,
         house: CONFIG.houseHp, kills: 0, over: false, retreatArmed: false, cd: {}, shake: 0, flash: 0, wave: 0,
         bg: makeBattleBG(a, lv) };
  $("bTitle").textContent = `🛡️ ${a.name}のパトロール（Lv${lv}）`;
  $("bResult").innerHTML = ""; $("bfx").innerHTML = "";
  // 前回の配置を思い出す（この地区の前回 → なければ最後のパトロール）
  const memo = (S.lastPlace || {})[areaId] || (S.lastPlace || {})._last || [];
  const ready = readyCats().map(c => c.id);
  memo.forEach(m => {
    if (!ready.includes(m.id) || BT.placed.some(q => q.id === m.id) || placeError(m.x, m.y, m.id)) return;
    BT.placed.push({ id: m.id, x: m.x, y: m.y, stun: 0, lunge: 0, lx: 0, ly: 0, ph: Math.random() * 2, sp: 0, rapid: 0, rapidF: 1 });
  });
  if (BT.placed.length) {
    BT.msg = "前回の配置を思い出しました。そのまま開始するか、動かして調整してね。";
    const next = readyCats().find(c => !BT.placed.some(q => q.id === c.id));
    BT.selCat = next ? next.id : BT.placed[0].id;
  }
  $("battle").hidden = false;
  requestAnimationFrame(fitBattle);
  renderBattleUI();
  banner(`${a.name}をパトロール！`);
}

// ---------- 開始前の見通し（配置した猫でクリアできそうか） ----------
const pathPts = route => {   // 道の上の点（2ピクセルごと）
  const pts = [];
  for (let i = 1; i < route.length; i++) {
    const [x1, y1] = route[i - 1], [x2, y2] = route[i], d = Math.hypot(x2 - x1, y2 - y1);
    for (let k = 0; k < d; k += 2) pts.push([x1 + (x2 - x1) * k / d, y1 + (y2 - y1) * k / d]);
  }
  return pts;
};
function forecast() {
  const cats = BT.placed.map(q => {
    const c = S.cats.find(x => x.id === q.id), st = battleStats(c);
    // 射程に入る道の長さ（分かれ道なら2本の平均）
    const covered = (BT.pts || (BT.pts = ROUTES.map(pathPts))).reduce((sum, pts) => sum + pts.filter(([x, y]) => Math.hypot(x - q.x, y - (q.y - 4)) <= st.range).length * 2, 0) / ROUTES.length;
    return { q, c, dps: battlePower(c) * (st.splash ? 1.5 : 1), covered, slow: !!st.slow };
  });
  const slowBonus = 1 + Math.min(0.3, cats.filter(x => x.slow && x.covered).length * 0.15);
  const spacing = Math.max(0.7, 1.1 - BT.lv * 0.03);
  let hpTotal = 0, cap = 0, bossOk = true;
  BT.queue.forEach(e => {
    const E = ENEMIES[e.type], hp = E.hp * BT.hpMult * (e.boss ? CONFIG.bossHp : 1);
    hpTotal += hp;
    const dmg = cats.reduce((s, x) => s + x.dps * Math.min(e.boss ? 99 : spacing * 1.5, x.covered / E.speed), 0) * slowBonus;
    cap += Math.min(hp, dmg);
    if (e.boss && dmg < hp * 0.9) bossOk = false;
  });
  const ratio = hpTotal ? cap / hpTotal : 0;
  const idle = cats.filter(x => !x.covered).map(x => nameOf(x.q.id));
  return { ratio, bossOk, idle, hasBoss: BT.queue.some(e => e.boss) };
}
function renderAdvice() {
  const box = $("bAdvice");
  if (!BT || BT.running || BT.over || !BT.placed.length) { box.innerHTML = ""; return; }
  const f = forecast(), r = f.ratio;
  const [g, title, text] =
    r >= 0.95 ? ["g1", "😸 余裕で守れそう！", "この配置なら安心です。"] :
    r >= 0.8  ? ["g2", "🙂 たぶん守れそう", "少し取りこぼすかも。必殺技を使えば大丈夫そう。"] :
    r >= 0.6  ? ["g3", "😼 ギリギリかも…", "必殺技がカギです。射程の重なる場所に置くとよいかも。"] :
    r >= 0.4  ? ["g4", "😿 ちょっと厳しそう", "猫を増やすか、装備や戦闘特技で強くしよう。低いレベルで戦闘Lvを上げるのも手です。"] :
                ["g5", "🙀 かなり危険！", "今のままだと守りきれなさそう。レベルを下げるか、もっと猫を出そう。"];
  box.innerHTML = `<div class="adv ${g}"><b>${title}</b>（見通し ${Math.min(100, Math.round(r * 100))}%）<br>${text}
    ${f.hasBoss && !f.bossOk ? "<br>⚠️ ボスを止めきれないかも。ボスに突破されると負けです。" : ""}
    ${f.idle.length ? `<br>⚠️ ${f.idle.join("・")}は道に攻撃が届いていません。` : ""}</div>`;
}

    : "猫を選んで、地図の好きな場所をタップして置こう（道の上はダメ）。道に近いと敵にひっかかれてひるむので、防御のある装備が役立ちます。";
  $("bCats").innerHTML = BT.over ? "" : S.cats.map(c => {

  }).join("");
  $("bBtns").innerHTML = BT.over ? "" : `

    ${BT.running
      ? `<button class="btn" id="bSpeed">${BT.speed === 1 ? "倍速にする" : "ふつうの速さ"}</button><button class="btn off" id="bRetreat">${BT.retreatArmed ? "本当に撤退する？" : "撤退する"}</button>`
      : `<button class="btn big" id="bStart" ${BT.placed.length ? "" : "disabled"}>パトロール開始！</button><button class="btn off" id="bCancel">やめる</button>`}`;
  $("bCats").querySelectorAll("[data-bcat]").forEach(b => b.onclick = () => { if (b.disabled) return; BT.selCat = b.dataset.bcat; BT.msg = ""; renderBattleUI(); });
  if ($("bRemove")) $("bRemove").onclick = () => { BT.placed = BT.placed.filter(q => q.id !== BT.selCat); renderBattleUI(); };
  if ($("bStart")) $("bStart").onclick = () => {
    BT.running = true; BT.msg = "";
    // 配置を覚えておく
    const memo = BT.placed.map(q => ({ id: q.id, x: q.x, y: q.y }));
    S.lastPlace = { ...(S.lastPlace || {}), [BT.area.id]: memo, _last: memo }; save();
    renderBattleUI();
  };
  if ($("bClear")) $("bClear").onclick = () => { BT.placed = []; BT.selCat = readyCats()[0].id; BT.msg = ""; renderBattleUI(); };
  if ($("bCancel")) $("bCancel").onclick = () => { BT = null; $("battle").hidden = true; renderAll(); };
  if ($("bSpeed")) $("bSpeed").onclick = () => { BT.speed = BT.speed === 1 ? 2 : 1; renderBattleUI(); };
  if ($("bRetreat")) $("bRetreat").onclick = () => {
    if (!BT.retreatArmed) { BT.retreatArmed = true; renderBattleUI(); setTimeout(() => { if (BT && BT.retreatArmed) { BT.retreatArmed = false; renderBattleUI(); } }, 3000); return; }
    finishBattle(false, true);
  };
}
function renderSpecials() {
  const box = $("bSpecials");
  if (!BT.running || BT.over) { if (box.innerHTML) { box.innerHTML = ""; box.dataset.key = ""; } return; }
  const info = BT.placed.map(q => { const sp = specialOf(q.id), pct = Math.floor((q.sp || 0) / sp.charge * 100); return { q, sp, pct, ready: pct >= 100 }; });
  const key = info.map(x => x.q.id + (x.ready ? "!" : "")).join(",");
  if (key !== box.dataset.key) {   // ボタンの並びが変わったときだけ作り直す（押しやすさのため）
    box.dataset.key = key;
    box.innerHTML = info.map(({ q, sp, ready }) => `<button class="sp-btn ${ready ? "ready" : ""}" data-sp="${q.id}" ${ready ? "" : "aria-disabled=\"true\""} title="${nameOf(q.id)}の必殺技「${sp.name}」：${specialText(sp)}"><i></i><span>${ready ? "✨" : ""}${nameOf(q.id)}<br><small>${sp.name}${ready ? "！" : ""}<b class="pct"></b></small><br><small class="sp-desc">${specialText(sp)}</small></span></button>`).join("");
  }
  info.forEach(({ q, pct, ready }) => {
    const b = box.querySelector(`[data-sp="${q.id}"]`); if (!b) return;
    b.querySelector("i").style.width = (ready ? 0 : pct) + "%";
    b.querySelector(".pct").textContent = ready ? "" : ` ${pct}%`;
  });
}

// ボタンにカーソルを合わせる（指で触る）と、どの猫が使うのか地図で光る
["mouseover", "touchstart", "focusin"].forEach(ev => $("bSpecials").addEventListener(ev, e => {

}, { passive: true }));

function useSpecial(id) {
  const q = BT && BT.placed.find(x => x.id === id), c = S.cats.find(x => x.id === id);
  if (!q || !c || BT.over || !BT.running) return;
  const sp = specialOf(id);
  if ((q.sp || 0) < sp.charge) return;
  q.sp = 0; q.stun = 0;
  const st = battleStats(c);
  banner(`${nameOf(id)}の「${sp.name}」！`);
  BT.flash2 = 0.35; BT.flashCol = catData(id).colors.a;
  burst(q.x, q.y - 6, ["#ffd54a", "#ff7aa2", "#ffffff", catData(id).colors.c], 24, 70);
  sp.fx.forEach(([k, a, b]) => {
    if (k === "nuke") {
      const targets = BT.enemies.filter(en => !a || Math.hypot(en.x - q.x, en.y - q.y) <= a);
      const dmg = Math.round(st.atk * b);
      targets.forEach(en => { en.hp -= dmg; en.flash = 0.2; en.lastHit = id; bfx(en.x, en.y - 10, String(dmg), "crit"); });
      BT.fxs.push({ kind: "ring", x2: q.x, y2: q.y - 4, life: 0.5, max: 0.5, splash: a || 140 });
      BT.shake = 0.35;
    } else if (k === "pierce") {
      const t = [...BT.enemies].sort((x, y) => y.dist - x.dist)[0];
      if (t) { const dmg = Math.round(st.atk * a); t.hp -= dmg; t.flash = 0.3; t.lastHit = id; bfx(t.x, t.y - 12, `${dmg}!!`, "crit");
        BT.fxs.push({ kind: "beam", x1: q.x, y1: q.y - 5, x2: t.x, y2: t.y - 3, life: 0.4, max: 0.4 }); BT.shake = 0.25; }
    } else if (k === "heal") {
      BT.house = Math.min(CONFIG.houseHp, BT.house + a); bfx(housePos()[0] - 2, housePos()[1] - 14, `+${a}`, "heart"); burst(housePos()[0] - 2, housePos()[1], ["#5cc27a", "#ffffff"], 14, 40);
    } else if (k === "rapid") { q.rapid = a; q.rapidF = b; BT.cd[id] = 0;
    } else if (k === "buff") { BT.buff = a; BT.buffMult = b; BT.placed.forEach(p => burst(p.x, p.y - 6, ["#ff7aa2", "#ffd54a"], 5, 30));
    } else if (k === "slow") { BT.enemies.forEach(en => en.slow = Math.max(en.slow, a)); BT.tint = { col: "rgba(120,180,255,.18)", t: 0.6 };
    } else if (k === "stun") { BT.enemies.forEach(en => en.stun = Math.max(en.stun || 0, a)); BT.tint = { col: "rgba(255,255,200,.22)", t: 0.5 };
    } else if (k === "gold") { BT.gold = a; BT.tint = { col: "rgba(255,213,74,.2)", t: 0.6 }; }
  });
  addLog(`${nameOf(id)}の必殺技「${sp.name}」！`);
  renderSpecials();
}
